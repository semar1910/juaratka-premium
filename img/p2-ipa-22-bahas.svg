tyle="animation-delay:0.40s"><rect x="338" y="280" width="134" height="50" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="405" y="270" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">300</text></g><g class="fx kedut" style="animation-delay:1.20s"><rect x="338" y="280" width="134" height="50" rx="6" fill="#EF6C00" fill-opacity=".55" stroke="#EF6C00" stroke-width="5"/></g><g class="fx pop" style="animation-delay:1.80s"><rect x="540" y="240" width="320" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="572" cy="269" r="18" fill="#E53935"/><path d="M565 262 L579 276 M579 262 L565 276" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="600" y="279" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">daya 0 W, padam</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="90" y="410" width="480" height="68" rx="34" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="126" cy="444" r="20.4" fill="#E53935"/><path d="M118 436 L134 452 M134 436 L118 452" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="166" y="455" text-anchor="start" font-size="30" font-weight="700" fill="#B71C1C">Pernyataan 1: Salah</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="15" y="9" width="285" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M157 94 V112 H195 V126" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="157" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="195" cy="126" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><text class="fx sorot" style="animation-delay:0.90s" x="700" y="350" text-anchor="middle" font-size="34" font-weight="700" fill="#1E8