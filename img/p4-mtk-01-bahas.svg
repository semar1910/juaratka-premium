ne" stroke="#E53935" stroke-width="5"/><path class="alir" d="M361 94 V112 H885 V424 H172" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="361" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="172" cy="424" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><text x="450" y="462" text-anchor="middle" font-size="34" font-weight="700" fill="#1E88E5">135 = 100 + 30 + 5</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="40" y="480" width="260" height="64" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="170" y="522" text-anchor="middle" font-size="28" font-weight="700" fill="#0D47A1">100 × 8 = 800</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="320" y="480" width="260" height="64" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="450" y="522" text-anchor="middle" font-size="28" font-weight="700" fill="#0D47A1">30 × 8 = 240</text></g><g class="fx pop" style="animation-delay:1.80s"><rect x="600" y="480" width="260" height="64" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="730" y="522" text-anchor="middle" font-size="28" font-weight="700" fill="#0D47A1">5 × 8 = 40</text></g><g class="fx pop" style="animation-delay:2.60s"><rect x="100" y="562" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="591" r="18" fill="#E53935"/><path d="M125 584 L139 598 M139 584 L125 598" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="601" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">lupa 30 × 8 → 800 + 40 = 840 (salah)</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="524" y="9" width="177" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M612 94 V112 H885 V664 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="612" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="664" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><text class="fx sorot" style="animation-delay:0.80s" x="450" y="666" text-anchor="middle" font-size="36" font-weight="700" fill="#1F2937">800 + 240 + 40 = 1.080</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="150" y="690" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="724" r="20.4" fill="#2E7D32"/><path d="M177 724 L184 732 L196 717" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="736" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">D: 1.080 butir telur</text></g></g></svg>