<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Tebak dari konteks</text><rect x="30" y="58" width="540" height="52" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2" /><text x="300.0" y="80.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" >"Sejak menang lomba, Doni tidak lagi mau menyapa</text><text x="300.0" y="100.0" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" >teman lamanya. Ia sudah besar kepala."</text><rect x="14" y="140" width="172" height="64" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="100.0" y="168.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" >Apa yang</text><text x="100.0" y="186.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" >terjadi?</text><line x1="190.0" y1="172.0" x2="210.0" y2="172.0" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" /><path d="M210.0 172.0 L201.2 176.8 L201.2 167.2Z" fill="#6B7280"/><rect x="214" y="140" width="172" height="64" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" /><text x="300.0" y="168.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >Sifat apa</text><text x="300.0" y="186.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >yang cocok?</text><line x1="390.0" y1="172.0" x2="410.0" y2="172.0" stroke="#6B7280" stroke-width="2.5" stroke-linecap="round" /><path d="M410.0 172.0 L401.2 176.8 L401.2 167.2Z" fill="#6B7280"/><rect x="414" y="140" width="172" height="64" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2" /><text x="500.0" y="168.0" font-size="14" font-weight="700" fill="#047857" text-anchor="middle" >Makna</text><text x="500.0" y="186.0" font-size="14" font-weight="700" fill="#047857" text-anchor="middle" >ungkapannya</text><rect x="21.679999999999993" y="220" width="156.64000000000001" height="28" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="100.0" y="239.0" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle" >tidak mau menyapa</text><rect x="221.68" y="220" width="156.64000000000001" height="28" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" /><text x="300.0" y="239.0" font-size="12" font-weight="700" fill="#B45309" text-anchor="middle" >tidak rendah hati</text><rect x="458.97" y="220" width="82.06" height="28" rx="14" fill="#D1FAE5" stroke="#047857" stroke-width="2" /><text x="500.0" y="239.0" font-size="13" font-weight="700" fill="#047857" text-anchor="middle" >sombong</text>
</svg>
