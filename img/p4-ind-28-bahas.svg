<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 622" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="21" y="16" width="269" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="49" cy="54" r="10" fill="#1E88E5"/><text x="65" y="64" text-anchor="start" font-size="29" font-weight="700" fill="#1F2937">5 soal sehari</text><rect x="306" y="16" width="377" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="334" cy="54" r="10" fill="#EF6C00"/><text x="350" y="64" text-anchor="start" font-size="29" font-weight="700" fill="#1F2937">sedikit demi sedikit</text><rect x="699" y="16" width="180" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="727" cy="54" r="10" fill="#8D6E63"/><text x="743" y="64" text-anchor="start" font-size="29" font-weight="700" fill="#1F2937">70 soal</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="299" y="9" width="391" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M494 94 V112 H450 V136" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="494" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="136" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="160" y="140" width="580" height="70" rx="16" fill="#F3E5F5" stroke="#8E24AA" stroke-width="3"/><text x="450" y="187" text-anchor="middle" font-size="32" font-weight="700" fill="#4A148C">“sedikit demi sedikit”</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="14" y="9" width="283" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M155 94 V112 H885 V310 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="155" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="310" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="250" width="395" height="110" rx="16" fill="#FFEBEE" stroke="#E53935" stroke-width="3" stroke-dasharray="9 6"/><circle cx="72" cy="305" r="20" fill="#E53935"/><path d="M64 297 L80 313 M80 297 L64 313" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="254" y="292" text-anchor="middle" font-size="28" font-weight="600" fill="#B71C1C">arti kata per kata</text><text x="254" y="336" text-anchor="middle" font-size="28" font-weight="700" fill="#B71C1C">tanah jadi bukit</text></g><g class="fx pop" style="animation-delay:1.00s"><text class="fx sorot" style="animation-delay:1.60s" x="450" y="420" text-anchor="middle" font-size="32" font-weight="700" fill="#8D6E63">5 soal × 14 hari = 70 soal</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="692" y="9" width="194" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M789 94 V112 H885 V500 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="789" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="500" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="465" y="250" width="395" height="110" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><circle cx="497" cy="305" r="20" fill="#2E7D32"/><path d="M488 305 L495 313 L507 298" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="292" text-anchor="middle" font-size="28" font-weight="600" fill="#1B5E20">makna dalam cerita</text><text x="678" y="336" text-anchor="middle" font-size="28" font-weight="700" fill="#1B5E20">rutin jadi banyak</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="100" y="450" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="484" r="20.4" fill="#2E7D32"/><path d="M127 484 L134 492 L146 477" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="495" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">A: sedikit rutin, lama-lama banyak</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="100" y="530" width="700" height="68" rx="34" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="136" cy="564" r="20.4" fill="#E53935"/><path d="M128 556 L144 572 M144 556 L128 572" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="176" y="575" text-anchor="start" font-size="30" font-weight="700" fill="#B71C1C">C: sedikit, langsung pintar</text></g></g></svg>