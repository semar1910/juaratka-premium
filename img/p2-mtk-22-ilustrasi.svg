<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><rect width="900" height="520" fill="#fff"/><text x="450" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">Ubin dipasang rapat, tanpa celah dan tanpa sisa</text><rect x="60" y="100" width="500" height="300" rx="6" fill="#CFD8DC" stroke="#546E7A" stroke-width="6"/><rect x="60" y="100" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="60" y="150" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="60" y="200" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="60" y="250" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="60" y="300" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="60" y="350" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="110" y="100" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="110" y="150" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="110" y="200" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="110" y="250" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="110" y="300" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="110" y="350" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="160" y="100" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="160" y="150" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="160" y="200" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="160" y="250" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="160" y="300" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="160" y="350" width="50" height="50" fill="#90CAF9" stroke="#fff" stroke-width="3"/><rect x="210" y="100" width="50" height="50" fill="