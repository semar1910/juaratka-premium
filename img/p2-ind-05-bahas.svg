" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Sebelum</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="561" y="9" width="325" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M724 94 V112 H885 V408 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="724" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="408" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="370" width="820" height="76" rx="16" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/><text x="64" y="417" text-anchor="start" font-size="28" font-weight="700" fill="#4E342E">3.  untuk yang tak makan babi</text><rect x="540" y="380" width="150" height="56" rx="14" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="2"/><text x="615" y="417" text-anchor="middle" font-size="28" font-weight="600" fill="#90A4AE">Sebelum</text></g><g class="fx pop" style="animation-delay:1.10s"><rect x="710" y="380" width="150" height="56" rx="14" fill="#2E7D32"/><text x="785" y="417" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Sesudah</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="40" y="540" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="569" r="18" fill="#E53935"/><path d="M65 562 L79 576 M79 562 L65 576" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="579" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">salah: isi babi cocok bagi mereka</text></g><g class="fx pop" style="animation-delay:2.00s"><rect x="100" y="620" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="654" r="20.4" fill="#