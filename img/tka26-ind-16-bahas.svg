<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<!-- Pita Diketahui -->
<g id="tahap0">
  <rect x="48" y="16" width="350" height="70" rx="35" fill="#1E88E5"/>
  <text x="223" y="60" text-anchor="middle" font-size="28" font-weight="600" fill="#fff">kota berkelanjutan</text>
  <rect x="418" y="16" width="200" height="70" rx="35" fill="#EF6C00"/>
  <text x="518" y="60" text-anchor="middle" font-size="28" font-weight="600" fill="#fff">ciri-ciri</text>
  <rect x="638" y="16" width="216" height="70" rx="35" fill="#8D6E63"/>
  <text x="746" y="60" text-anchor="middle" font-size="28" font-weight="600" fill="#fff">semua ciri</text>
</g>

<!-- Langkah 1: bagian pembuka -> topik -->
<g id="tahap1">
  <rect class="fx drop" x="40" y="120" width="820" height="96" rx="22" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
  <text class="muncul" x="450" y="152" text-anchor="middle" font-size="28" fill="#1565C0" style="animation-delay:0.40s">Cara: bagian pembuka</text>
  <text class="muncul" x="450" y="200" text-anchor="middle" font-size="40" font-weight="700" fill="#0D47A1" style="animation-delay:0.90s">Topik: kota berkelanjutan</text>
  <g class="penunjuk">
    <rect class="fx cincin" x="41" y="9" width="364" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 223 94 V108 H885 V168 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="223" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="168" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
</g>

<!-- Langkah 2: isi tiap paragraf -> satu topik -->
<g id="tahap2">
  <rect class="fx drop" x="40" y="228" width="820" height="182" rx="22" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
  <text class="muncul" x="450" y="262" text-anchor="middle" font-size="28" fill="#E65100" style="animation-delay:0.30s">Isi tiap paragraf → satu topik utama</text>
  <g class="fx pop" style="animation-delay:0.60s">
    <rect x="60" y="274" width="380" height="56" rx="14" fill="#fff" stroke="#EF6C00" stroke-width="3"/>
    <text x="250" y="312" text-anchor="middle" font-size="28" font-weight="500" fill="#5D4037">Transportasi</text>
  </g>
  <g class="fx pop" style="animation-delay:1.00s">
    <rect x="460" y="274" width="380" height="56" rx="14" fill="#fff" stroke="#EF6C00" stroke-width="3"/>
    <text x="650" y="312" text-anchor="middle" font-size="28" font-weight="500" fill="#5D4037">Listrik, gedung, air</text>
  </g>
  <g class="fx pop" style="animation-delay:1.40s">
    <rect x="60" y="342" width="380" height="56" rx="14" fill="#fff" stroke="#EF6C00" stroke-width="3"/>
    <text x="250" y="380" text-anchor="middle" font-size="28" font-weight="500" fill="#5D4037">Fasilitas publik</text>
  </g>
  <g class="fx pop" style="animation-delay:1.80s">
    <rect x="460" y="342" width="380" height="56" rx="14" fill="#fff" stroke="#EF6C00" stroke-width="3"/>
    <text x="650" y="380" text-anchor="middle" font-size="28" font-weight="500" fill="#5D4037">Makanan &amp; sampah</text>
  </g>
  <g class="penunjuk">
    <rect class="fx cincin" x="411" y="9" width="214" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 518 94 V108 H885 V319 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="518" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="319" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
</g>

<!-- Langkah 3: kalimat penutup -> kesimpulan -->
<g id="tahap3">
  <rect class="fx drop" x="40" y="422" width="820" height="96" rx="22" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/>
  <text class="muncul" x="450" y="454" text-anchor="middle" font-size="28" fill="#6D4C41" style="animation-delay:0.40s">Cara: kalimat penutup</text>
  <text class="muncul" x="450" y="502" text-anchor="middle" font-size="36" font-weight="700" fill="#4E342E" style="animation-delay:0.90s">Kesimpulan: kota berkelanjutan</text>
  <g class="penunjuk">
    <rect class="fx cincin" x="631" y="9" width="230" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 746 94 V108 H885 V470 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="746" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="470" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
</g>

<!-- Langkah 4: cocokkan pilihan -->
<g id="tahap4">
  <g class="fx pop" style="animation-delay:0.30s">
    <rect x="40" y="530" width="400" height="120" rx="22" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="4"/>
    <text x="240" y="584" text-anchor="middle" font-size="40" font-weight="700" fill="#616161">A, C, D</text>
    <text x="240" y="628" text-anchor="middle" font-size="28" fill="#616161">hanya satu bagian</text>
  </g>
  <g class="fx pop" style="animation-delay:0.80s">
    <rect x="460" y="530" width="400" height="120" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/>
    <text class="fx kedut" style="animation-delay:1.40s" x="660" y="586" text-anchor="middle" font-size="48" font-weight="700" fill="#1B5E20">B</text>
    <text x="660" y="630" text-anchor="middle" font-size="28" fill="#2E7D32">mencakup seluruh teks</text>
  </g>
  <g class="penunjuk">
    <rect class="fx cincin" x="41" y="9" width="364" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 223 94 V108 H885 V590 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="223" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="590" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
</g>
</svg>
