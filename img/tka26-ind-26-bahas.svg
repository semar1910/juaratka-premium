<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
  <g class="fx drop"><rect x="15" y="16" width="250" height="70" rx="35" fill="#1E88E5"/><text x="140" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Ketua adat</text></g>
  <g class="fx drop" style="animation-delay:0.2s"><rect x="285" y="16" width="300" height="70" rx="35" fill="#EF6C00"/><text x="435" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Tempat ritual</text></g>
  <g class="fx drop" style="animation-delay:0.4s"><rect x="605" y="16" width="280" height="70" rx="35" fill="#8D6E63"/><text x="745" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Ibu &amp; ayah</text></g>
</g>
<g id="tahap1">
<g class="penunjuk">
  <rect class="fx cincin" x="8" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 140 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="140" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="185" width="810" height="72" rx="20" fill="#FFF8EC" stroke="#F59E0B" stroke-width="3"/>
  <text x="445" y="232" text-anchor="middle" font-size="30" fill="#5D4037">“rambut Rara akan dipotong”</text></g>
<text class="fx pop" style="animation-delay:0.5s" x="445" y="325" text-anchor="middle" font-size="46" font-weight="700" fill="#1E88E5">memotong rambut</text>
<g class="fx pop" style="animation-delay:0.9s"><rect x="40" y="360" width="810" height="175" rx="26" fill="#fff" stroke="#1E88E5" stroke-width="5"/>
  <text x="70" y="400" font-size="28" fill="#757575">Cari kata kunci</text>
  <text x="70" y="455" font-size="36" fill="#212121">kata kunci: memotong rambut</text>
  <text x="70" y="515" font-size="50" font-weight="700" fill="#1E88E5">→ Cari pelakunya</text></g>
</g>
<g id="tahap2">
<g class="penunjuk">
  <rect class="fx cincin" x="278" y="9" width="314" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 435 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="435" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="185" width="810" height="72" rx="20" fill="#FFF8EC" stroke="#F59E0B" stroke-width="3"/>
  <text x="445" y="232" text-anchor="middle" font-size="30" fill="#5D4037">“Ketua adat akan memotong rambut gimbal”</text></g>
<g class="fx pop" style="animation-delay:0.5s"><rect x="120" y="272" width="280" height="62" rx="31" fill="#1E88E5"/><text x="260" y="314" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Ketua adat</text></g>
<g class="muncul" style="animation-delay:0.8s"><path d="M 412 303 H 480 M 465 289 L 485 303 L 465 317" fill="none" stroke="#212121" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="fx pop" style="animation-delay:1.0s"><rect x="500" y="272" width="280" height="62" rx="31" fill="#F59E0B"/><text x="640" y="314" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">rambut Rara</text></g>
<g class="fx pop" style="animation-delay:1.3s"><rect x="40" y="360" width="810" height="175" rx="26" fill="#fff" stroke="#1E88E5" stroke-width="5"/>
  <text x="70" y="400" font-size="28" fill="#757575">Temukan pelaku</text>
  <text x="70" y="455" font-size="36" fill="#212121">Ketua adat memotong rambut</text>
  <text x="70" y="515" font-size="50" font-weight="700" fill="#1E88E5">→ Ketua adat</text></g>
</g>
<g id="tahap3">
<g class="penunjuk">
  <rect class="fx cincin" x="598" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 745 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="745" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="185" width="810" height="72" rx="20" fill="#FFF8EC" stroke="#F59E0B" stroke-width="3"/>
  <text x="445" y="232" text-anchor="middle" font-size="30" fill="#5D4037">“memberikan barang yang kamu minta”</text></g>
<g class="fx pop" style="animation-delay:0.5s"><circle cx="200" cy="302" r="28" fill="#43A047"/><text x="200" y="313" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">A</text></g>
<g class="fx pop" style="animation-delay:0.7s"><circle cx="360" cy="302" r="28" fill="#BDBDBD"/><text x="360" y="313" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">B</text></g>
<g class="fx pop" style="animation-delay:0.9s"><circle cx="520" cy="302" r="28" fill="#BDBDBD"/><text x="520" y="313" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">C</text></g>
<g class="fx pop" style="animation-delay:1.1s"><circle cx="680" cy="302" r="28" fill="#BDBDBD"/><text x="680" y="313" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">D</text></g>
<path class="garis" style="animation-delay:1.3s" d="M 340 322 L 380 282" stroke="#E53935" stroke-width="6" stroke-linecap="round" fill="none"/>
<path class="garis" style="animation-delay:1.5s" d="M 500 322 L 540 282" stroke="#E53935" stroke-width="6" stroke-linecap="round" fill="none"/>
<path class="garis" style="animation-delay:1.7s" d="M 660 322 L 700 282" stroke="#E53935" stroke-width="6" stroke-linecap="round" fill="none"/>
<g class="fx pop" style="animation-delay:1.9s"><rect x="40" y="360" width="810" height="175" rx="26" fill="#fff" stroke="#2E7D32" stroke-width="5"/>
  <text x="70" y="400" font-size="28" fill="#757575">Cocokkan pilihan</text>
  <text x="70" y="455" font-size="36" fill="#212121">cocokkan pilihan dengan bukti</text>
  <text x="70" y="515" font-size="50" font-weight="700" fill="#2E7D32">→ Jawaban A</text></g>
</g>
</svg>