<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 796" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="70" y="16" width="342" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="98" cy="54" r="10" fill="#1E88E5"/><text x="114" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">tali jemuran 6 m</text><rect x="428" y="16" width="402" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="456" cy="54" r="10" fill="#EF6C00"/><text x="472" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">pagar bambu 450 cm</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="421" y="9" width="416" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M629 94 V112 H885 V368 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="629" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="368" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.10s"><rect x="90" y="210" width="96" height="54" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="138" y="248" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">km</text></g><g class="fx pop" style="animation-delay:0.18s"><rect x="194" y="236" width="96" height="54" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="242" y="274" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">hm</text></g><g class="fx pop" style="animation-delay:0.26s"><rect x="298" y="262" width="96" height="54" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="346" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">dam</text></g><g class="fx pop" style="animation-delay:0.34s"><rect x="402" y="288" width="96" height="54" rx="10" fill="#1E88E5" stroke="#1E88E5" stroke-width="3"/><text x="450" y="326" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">m</text></g><g class="fx pop" style="animation-delay:0.42s"><rect x="506" y="314" width="96" height="54" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="554" y="352" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">dm</text></g><g class="fx pop" style="animation-delay:0.50s"><rect x="610" y="340" width="96" height="54" rx="10" fill="#1E88E5" stroke="#1E88E5" stroke-width="3"/><text x="658" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">cm</text></g><g class="fx pop" style="animation-delay:0.58s"><rect x="714" y="366" width="96" height="54" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="762" y="404" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">mm</text></g><path class="garis" style="animation-delay:1.00s" d="M658 336 Q554 248 450 284" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:1.70s"><text x="554" y="264" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">÷ 100</text></g><g class="fx pop" style="animation-delay:2.00s"><rect x="60" y="446" width="780" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="90" cy="474" r="16.8" fill="#2E7D32"/><path d="M82 474 L88 480 L98 468" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="485" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">A: 450 cm = 4,5 m</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="63" y="9" width="356" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M241 94 V112 H885 V540 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="241" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="540" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><text class="fx sorot" style="animation-delay:0.90s" x="240" y="348" text-anchor="middle" font-size="32" font-weight="700" fill="#1E88E5">6 m = 600 cm</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="60" y="512" width="780" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="90" cy="540" r="16.8" fill="#2E7D32"/><path d="M82 540 L88 546 L98 534" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="551" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">B: 600 − 450 = 150 cm</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="63" y="9" width="356" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M241 94 V112 H885 V606 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="241" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="606" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><text class="fx sorot" style="animation-delay:0.90s" x="240" y="388" text-anchor="middle" font-size="32" font-weight="700" fill="#1E88E5">6 m = 60 dm</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="60" y="578" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="607" r="18" fill="#E53935"/><path d="M85 600 L99 614 M99 600 L85 614" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="617" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">C salah: 6 m bukan 600 dm</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="421" y="9" width="416" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M629 94 V112 H885 V674 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="629" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="674" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><text class="fx sorot" style="animation-delay:0.90s" x="240" y="428" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">4,5 m &lt; 6 m</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="60" y="646" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="675" r="18" fill="#E53935"/><path d="M85 668 L99 682 M99 668 L85 682" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="685" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">D salah: angka 450 &gt; 6, satuan beda</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="60" y="716" width="780" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="90" cy="744" r="16.8" fill="#2E7D32"/><path d="M82 744 L88 750 L98 738" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="756" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">Jawaban: A dan B</text></g></g></svg>