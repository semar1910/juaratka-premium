ne" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:2.40s"><text class="fx sorot" style="animation-delay:3.00s" x="450" y="326" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">4/12 + 6/12 = 10/12</text></g><g class="fx pop" style="animation-delay:2.60s"><rect x="120" y="364" width="660" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="152" cy="393" r="18" fill="#E53935"/><path d="M145 386 L159 400 M159 386 L145 400" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="180" y="403" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">1/3 + 1/2 = 2/5, keliru</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="575" y="9" width="301" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M725 94 V112 H885 V227 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="725" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="227" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.20s" x="571.5" y="191.5" width="177.0" height="71" rx="12" fill="#8D6E63"/><g class="fx pop" style="animation-delay:0.80s"><text x="660" y="238" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">−3/12</text></g><line class="muncul" style="animation-delay:0.36s" x1="630.0" y1="194" x2="630.0" y2="260" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:0.42s" x1="690.0" y1="194" x2="690.0" y2="260" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><path class="garis" style="animation-delay:1.00s" d="M573 178 V166 H747 V178" fill="none" stroke="#8D6E63" stroke-width="5"/><g class="fx pop" style="animation-delay