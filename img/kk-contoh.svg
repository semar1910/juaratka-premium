<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 275" width="600" height="275" font-family="Poppins, Inter, Arial, sans-serif">
<rect width="600" height="275" fill="#fff"/>
<text x="300.0" y="28.0" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" >Apa arti kemarau?</text><rect x="30" y="46" width="540" height="34" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2" /><text x="42.0" y="68.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" >Sudah dua bulan hujan tidak turun.</text><rect x="30" y="88" width="540" height="34" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2" /><text x="42.0" y="110.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" >Sawah-sawah retak dan sumur warga mulai kering.</text><rect x="30" y="130" width="540" height="34" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="2" /><text x="42.0" y="152.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" >Petani berharap musim kemarau segera berakhir.</text><g id="tahap1" opacity="0"><rect x="80.36" y="180" width="159.28" height="28" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2" /><text x="160.0" y="199.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle" >yaitu / artinya?</text><line x1="252.0" y1="186.0" x2="272.0" y2="206.0" stroke="#EF4444" stroke-width="4" stroke-linecap="round" /><line x1="272.0" y1="186.0" x2="252.0" y2="206.0" stroke="#EF4444" stroke-width="4" stroke-linecap="round" /></g><g id="tahap2" opacity="0"><rect x="30" y="46" width="540" height="76" rx="9" fill="none" stroke="#2563EB" stroke-width="3" /><rect x="311.75" y="180" width="236.5" height="28" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="430.0" y="199.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" >hujan tidak turun, kering</text></g><g id="tahap3" opacity="0"><rect x="70" y="226" width="460" height="36" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2" /><text x="300.0" y="250.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >Uji: "berharap musim ... segera berakhir"</text></g>
