<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 706" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="26" y="16" width="278" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="54" cy="54" r="10" fill="#1E88E5"/><text x="70" y="64" text-anchor="start" font-size="29" font-weight="700" fill="#1F2937">jam 1: embun</text><rect x="320" y="16" width="269" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="348" cy="54" r="10" fill="#EF6C00"/><text x="364" y="64" text-anchor="start" font-size="29" font-weight="700" fill="#1F2937">jam 2: besar</text><rect x="605" y="16" width="269" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="633" cy="54" r="10" fill="#8D6E63"/><text x="649" y="64" text-anchor="start" font-size="29" font-weight="700" fill="#1F2937">jam 3: tetes</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="313" y="9" width="283" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M455 94 V112 H885 V315 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="455" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="315" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.10s"><rect x="30" y="140" width="730" height="50" fill="#00897B"/><text x="100" y="179" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Jam ke-</text><text x="465" y="179" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Kejadian di dalam stoples</text></g><g class="fx pop" style="animation-delay:0.35s"><rect x="30" y="190" width="730" height="50" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/><text x="100" y="229" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">0</text><text x="465" y="229" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Air hangat bening, tutup kering</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="30" y="240" width="730" height="50" fill="#fff" stroke="#00897B" stroke-width="1.5"/><text x="100" y="279" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">1</text><text x="465" y="279" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Dinding dan tutup mulai berembun</text></g><g class="fx pop" style="animation-delay:0.85s"><rect x="30" y="290" width="730" height="50" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/><text x="100" y="329" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">2</text><text x="465" y="329" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Titik air di tutup makin besar</text></g><g class="fx pop" style="animation-delay:1.10s"><rect x="30" y="340" width="730" height="50" fill="#fff" stroke="#00897B" stroke-width="1.5"/><text x="100" y="379" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">3</text><text x="465" y="379" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Titik air menetes ke dasar</text></g><g class="fx pop" style="animation-delay:1.35s"><rect x="30" y="390" width="730" height="50" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/><text x="100" y="429" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">4</text><text x="465" y="429" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Air di dasar stoples masih ada</text></g><g class="fx kedut" style="animation-delay:1.00s"><rect x="33" y="293" width="724" height="44" rx="10" fill="none" stroke="#E53935" stroke-width="6"/></g><g class="fx pop" style="animation-delay:1.30s"><circle cx="800" cy="315" r="19" fill="#E53935"/><text x="800" y="325" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">A</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="130" y="468" width="640" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="162" cy="497" r="18" fill="#E53935"/><path d="M155 490 L169 504 M169 490 L155 504" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="190" y="507" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">A: titik membesar = menguap</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="19" y="9" width="292" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M165 94 V112 H885 V265 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="165" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="265" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx kedut" style="animation-delay:0.30s"><rect x="33" y="243" width="724" height="44" rx="10" fill="none" stroke="#2E7D32" stroke-width="6"/></g><g class="fx pop" style="animation-delay:0.70s"><circle cx="800" cy="265" r="19" fill="#2E7D32"/><text x="800" y="275" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">B</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="598" y="9" width="283" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M740 94 V112 H885 V365 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="740" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="365" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx kedut" style="animation-delay:0.30s"><rect x="33" y="343" width="724" height="44" rx="10" fill="none" stroke="#2E7D32" stroke-width="6"/></g><g class="fx pop" style="animation-delay:0.70s"><circle cx="800" cy="365" r="19" fill="#2E7D32"/><text x="800" y="375" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">C</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="19" y="9" width="292" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M165 94 V112 H885 V265 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="165" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="265" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><circle cx="846" cy="265" r="19" fill="#E53935"/><text x="846" y="275" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">D</text></g><g class="fx pop" style="animation-delay:0.70s"><rect x="130" y="536" width="640" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="162" cy="565" r="18" fill="#E53935"/><path d="M155 558 L169 572 M169 558 L155 572" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="190" y="575" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">D: air merembes lewat kaca</text></g><g class="fx pop" style="animation-delay:1.50s"><rect x="130" y="614" width="640" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="166" cy="648" r="20.4" fill="#2E7D32"/><path d="M157 648 L164 656 L176 641" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="660" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">Jawaban benar: B dan C</text></g></g></svg>