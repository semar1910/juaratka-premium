><path class="garis" style="animation-delay:0.30s" d="M170 215 L729 215" stroke="#8D6E63" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:1.00s"><path d="M740 215 L724 223 L724 207 Z" fill="#8D6E63"/></g><text x="455" y="195" text-anchor="middle" font-size="28" font-weight="700" fill="#4E342E">pergi</text><path class="garis" style="animation-delay:0.90s" d="M740 275 L181 275" stroke="#8D6E63" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:1.60s"><path d="M170 275 L186 267 L186 283 Z" fill="#8D6E63"/></g><text x="455" y="322" text-anchor="middle" font-size="28" font-weight="700" fill="#4E342E">pulang</text><g class="fx pop" style="animation-delay:1.50s"><text class="fx sorot" style="animation-delay:2.10s" x="450" y="375" text-anchor="middle" font-size="32" font-weight="700" fill="#0D47A1">800 × 50 cm = 40.000 cm</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="150" y="400" width="600" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="182" cy="429" r="18" fill="#E53935"/><path d="M175 422 L189 436 M189 422 L175 436" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="210" y="439" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">800 langkah = 800 m</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="288" y="9" width="312" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M444 94 V112 H885 V575 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="444" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="575" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.10s"><rect x="90" y="520" width="102" height="54" rx="10" fill="#1E88E5" stroke="#1E88E5" stroke-width="3"/><text x="141" y="558" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">m</text></g><g class="fx pop" style="animation-delay:0.18s"><rect x="200" y="554" width="102" height="54" rx="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="251" y="592" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">dm</text></g><g class="fx pop" style="animation-delay:0.26s"><rect x="310" y="588" width="102" height="54" rx="10" fill="#1E88E5" stroke="#1E88E5" stroke-width="3"/><text x="361" y="626" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">cm</text></g><path class="garis" style="animation-delay:1.00s" d="M361 584 Q251 480 141 516" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:1.70s"><text x="251" y="496" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">÷ 100</text></g><g class="fx pop" style="animation-delay:1.40s"><text class="fx sorot" style="animation-delay:2.00s" x="680" y="575" text-anchor="middle" font-size="32" font-weight="700" fill="#BF360C">40.000 cm = 400 m</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="602" y="9" width="280" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M743 94 V112 H885 V724 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="743" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="724" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><text class="fx sorot" style="animation-delay:0.80s" x="450" y="672" text-anchor="middle" font-size="32" font-weight="700" fill="#4E342E">400 : 2 = 200 m</text></g><g class="fx pop" style="animation-delay:0.90s"><rect x="60" y="690" width="400" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="724" r="20.4" fill="#2E7D32"/><path d="M87 724 L94 732 L106 717" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="736" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">B: 200 m</text></g><g class="fx pop" style="animation-delay:1.50s"><rect x="480" y="690" width="400" height="68" rx="34" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="516" cy="724" r="20.4" fill="#E53935"/><path d="M508 716 L524 732 M524 716 L508 732" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="556" y="736" text-anchor="start" font-size="34" font-weight="700" fill="#B71C1C">C: 400 m</text></g></g></svg>