306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:1.08s" x1="520.0" y1="234" x2="520.0" y2="306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:1.14s" x1="660.0" y1="234" x2="660.0" y2="306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><path class="garis" style="animation-delay:1.50s" d="M103 322 V334 H237 V322" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:2.00s"><text class="fx sorot" style="animation-delay:2.60s" x="170" y="372" text-anchor="middle" font-size="32" font-weight="700" fill="#EF6C00">3/4 kg</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="40" y="410" width="420" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="439" r="18" fill="#E53935"/><path d="M65 432 L79 446 M79 432 L65 446" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="449" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">3 3/4 × 5 = 18 3/4 kg</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="627" y="9" width="257" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M756 94 V112 H885 V270 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="756" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="270" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="101.5" y="231.5" width="417.0" height="77" rx="12" fill="#8D6E63" fill-opacity=".85"/><g class="fx pop" style="animation-delay:0.90s"><text x="310" y="282" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">sudah</text></g><path class="garis" style="animation-delay:1.00s" d="M523 322 V334 H797 V322" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:1.50s"><text class="fx sorot" style="animation-delay:2.10s" x="660" y="372" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">2 × 3/4 = 1 1/2 kg</text></g><g class="fx pop" style="animation-delay:1.90s"><rect x="470" y="410" width="400" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="502" cy="439" r="18" fill="#E53935"/><path d="M495 432 L509 446 M509 432 L495 446" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="530" y="449" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">3 3/4 − 3/4 = 3 kg</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="627" y="9" width="257" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M756 94 V112 H885 V330 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="756" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="330" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M103 218 V206 H517 V218" fill="none" stroke="#8D6E63" stroke-width="5"/><g class="fx pop" style="animation-delay:0.80s"><text class="fx sorot" style="animation-delay:1.40s" x="310" y="192" text-anchor="middle" font-size="32" font-weight="700" fill="#8D6E63">sudah 2 1/4 kg</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="120" y="490" width="660" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="156" cy="524" r="20.4" fill="#2E7D32"/><path d="M147 524 L154 532 L166 517" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="