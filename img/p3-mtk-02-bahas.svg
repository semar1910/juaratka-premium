<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 804" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="38" y="16" width="190" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="66" cy="54" r="10" fill="#1E88E5"/><text x="82" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">3 tenda</text><rect x="244" y="16" width="224" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="272" cy="54" r="10" fill="#EF6C00"/><text x="288" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">150 kursi</text><rect x="484" y="16" width="377" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="512" cy="54" r="10" fill="#8D6E63"/><text x="528" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">bayar Rp2.000.000</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="31" y="9" width="204" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M133 94 V112 H885 V226 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="133" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="226" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="60" y="150" width="780" height="64" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="450" y="193" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">3 × Rp350.000 = Rp1.050.000</text></g><g class="fx pop" style="animation-delay:0.90s"><rect x="60" y="226" width="780" height="64" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="450" y="269" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">150 × Rp5.000 = Rp750.000</text></g><g class="fx pop" style="animation-delay:1.80s"><rect x="60" y="304" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="333" r="18" fill="#E53935"/><path d="M85 326 L99 340 M99 326 L85 340" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="343" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Rp350.000 + Rp5.000 = Rp355.000</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="237" y="9" width="238" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M356 94 V112 H885 V502 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="356" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="502" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.20s" x="60" y="470" width="780" height="64" rx="14" fill="#F5E6C8" stroke="#8B6B3E" stroke-width="3"/><rect class="fx kiri tumbuh" style="animation-delay:0.60s" x="61.5" y="471.5" width="406.5" height="61" rx="12" fill="#1E88E5" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.20s"><text x="265" y="514" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">tenda</text></g><rect class="fx kiri tumbuh" style="animation-delay:1.20s" x="471.0" y="471.5" width="289.5" height="61" rx="12" fill="#EF6C00" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.80s"><text x="616" y="514" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">kursi</text></g><path class="garis" style="animation-delay:1.80s" d="M63 458 V446 H759 V458" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:2.30s"><text class="fx sorot" style="animation-delay:2.90s" x="411" y="432" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">total sewa Rp1.800.000</text></g><g class="fx pop" style="animation-delay:2.60s"><rect x="60" y="552" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="581" r="18" fill="#E53935"/><path d="M85 574 L99 588 M99 574 L85 588" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="591" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Rp1.800.000 itu total sewa, bukan kembalian</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="477" y="9" width="391" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M673 94 V112 H885 V746 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="673" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="746" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="763.5" y="471.5" width="75.0" height="61" rx="12" fill="#2E7D32" fill-opacity=".85"/><g class="fx pop" style="animation-delay:0.90s"><rect x="60" y="630" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="450" y="675" text-anchor="middle" font-size="30" font-weight="700" fill="#1B5E20">Rp2.000.000 − Rp1.800.000 = Rp200.000</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="60" y="712" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="746" r="20.4" fill="#2E7D32"/><path d="M87 746 L94 754 L106 739" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="758" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">Jawaban C: Rp200.000,00</text></g></g></svg>