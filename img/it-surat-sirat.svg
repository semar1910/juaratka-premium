<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Tersurat atau tersirat?</text><rect x="30" y="60" width="250" height="136" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2" /><text x="155.0" y="88.0" font-size="16" font-weight="700" fill="#047857" text-anchor="middle" >Tersurat</text><text x="155.0" y="114.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >tertulis jelas</text><text x="155.0" y="136.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >di teks</text><text x="155.0" y="158.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >tinggal ditemukan</text><rect x="320" y="60" width="250" height="136" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" /><text x="445.0" y="88.0" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="middle" >Tersirat</text><text x="445.0" y="114.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >tidak ditulis</text><text x="445.0" y="136.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >langsung</text><text x="445.0" y="158.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >harus disimpulkan</text><text x="300.0" y="228.0" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle" >Materi ini: mencari yang tersurat</text>
