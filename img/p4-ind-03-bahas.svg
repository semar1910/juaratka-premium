unjuk"><rect class="fx cincin" x="390" y="9" width="371" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M576 94 V112 H885 V285 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="576" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="285" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="242" width="820" height="86" rx="20" fill="#FFEBEE" stroke="#E53935" stroke-width="3"/><circle cx="85" cy="285" r="27" fill="#FFCC80" stroke="#8D6E63" stroke-width="3"/><circle cx="75" cy="279" r="3" fill="#3E2723"/><circle cx="95" cy="279" r="3" fill="#3E2723"/><path d="M76 294 Q85 300 94 294" stroke="#3E2723" stroke-width="3" fill="none" stroke-linecap="round"/><text x="136" y="280" text-anchor="start" font-size="30" font-weight="700" fill="#263238">Laras</text><text x="136" y="314" text-anchor="start" font-size="28" font-weight="600" fill="#455A64">teks menceritakan sejarah letusan</text><circle cx="816" cy="285" r="24" fill="#E53935"/><path d="M806 275 L826 295 M826 275 L806 295" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="390" y="9" width="371" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M576 94 V112 H885 V387 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="576" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="387" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="344" width="820" height="86" rx="20" fill="#E8F5E9" stroke="