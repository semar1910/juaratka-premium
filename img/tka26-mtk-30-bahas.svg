<symbol id="cn" viewBox="0 0 24 40"><rect x="3" y="4" width="18" height="34" rx="4" fill="#EF5350" stroke="#B71C1C" stroke-width="1.5"/><rect x="6" y="1" width="12" height="4" rx="1" fill="#CFD8DC"/><path d="M3 18q9 6 18-3v6q-9 9-18 3z" fill="#fff"/></symbol>
