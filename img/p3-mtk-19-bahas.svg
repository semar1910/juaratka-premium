 class="garis" style="animation-delay:1.30s" d="M80 322 Q450 230 820 322" fill="none" stroke="#8E24AA" stroke-width="5"/><g class="fx pop" style="animation-delay:2.00s"><text x="450" y="246" text-anchor="middle" font-size="30" font-weight="700" fill="#4A148C">2 jam 30 menit</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="60" y="440" width="560" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="469" r="18" fill="#E53935"/><path d="M85 462 L99 476 M99 462 L85 476" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="479" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">hanya 2 jam, 30 menit lupa</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="249" y="9" width="353" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M425 94 V112 H885 V540 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="425" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="540" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><rect x="60" y="510" width="560" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="539" r="18" fill="#E53935"/><path d="M85 532 L99 546 M99 532 L85 546" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="549" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">30 menit = 0,3 jam</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="130" y="590" width="640" height="68" rx="34" fill="#F3E5F5" stroke="#8E24AA" stroke-width="4"/><text x="450" y="635" text-anchor="middle" font-size="30" font-weight="700" fill="#4A148C">30 menit = 1/2 jam → 2 1/2 jam</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="46" y="9" width="200" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M146 94 V112 H885 V704 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="146" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="704" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><rect x="150" y="680" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="714" r="20.4" fill="#2E7D32"/><path d="M177 714 L184 722 L196 707" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="726" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">150 : 2 1/2 = 60 km/jam</text></g></g></svg>