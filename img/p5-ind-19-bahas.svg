 class="fx kedut" style="animation-delay:0.90s" cx="872" cy="387" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="344" width="820" height="86" rx="20" fill="#FFEBEE" stroke="#E53935" stroke-width="3"/><circle cx="85" cy="387" r="27" fill="#FFCC80" stroke="#8D6E63" stroke-width="3"/><circle cx="75" cy="381" r="3" fill="#3E2723"/><circle cx="95" cy="381" r="3" fill="#3E2723"/><path d="M76 396 Q85 402 94 396" stroke="#3E2723" stroke-width="3" fill="none" stroke-linecap="round"/><text x="136" y="382" text-anchor="start" font-size="30" font-weight="700" fill="#263238">Intan</text><text x="136" y="416" text-anchor="start" font-size="28" font-weight="600" fill="#455A64">Ratih biarkan ibu sendirian</text><circle cx="816" cy="387" r="24" fill="#E53935"/><path d="M806 377 L826 397 M826 377 L806 397" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="fx pop" style="animation-delay:1.00s"><rect x="100" y="450" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="479" r="18" fill="#E53935"/><path d="M125 472 L139 486 M139 472 L125 486" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="489" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">itu kejadian awal, bukan akhir</text></g><g class="fx pop" style="animation-delay:1.80s"><rect x="100" y="530" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="564" r="20.4" fill="#2E7D32"/><path d="M127 564 L134 572 L146 557" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="576" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">hanya Wulan yang sesuai</text></g></g></svg>