</g>
<g id="tahap4">
<g class="penunjuk"><rect class="fx cincin" x="303" y="5" width="294" height="106" rx="40" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 450 112 V138 H885 V566 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="450" cy="112" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="566" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="fx drop" style="animation-delay:0.2s"><rect x="50" y="512" width="800" height="108" rx="26" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="100" cy="566" r="28" fill="#2E7D32"/><text x="100" y="577" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">4</text><text x="150" y="552" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#455A64">Cocokkan pilihan</text><text x="150" y="598" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B5E20">B dan C cocok → jawaban</text></g>
<g class="fx pop" style="animation-delay:0.8s"><circle cx="800" cy="566" r="28" fill="#2E7D32"/><path d="M786 566 L796 577 L815 555" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</svg>