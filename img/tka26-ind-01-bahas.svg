<g class="fx drop" style="animation-delay:0.2s"><rect x="50" y="394" width="800" height="108" rx="26" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/><circle cx="100" cy="448" r="28" fill="#8D6E63"/><text x="100" y="459" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="#fff">3</text><text x="150" y="434" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#455A64">Uji pilihan A</text><text x="150" y="480" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" fill="#5D4037">bertentangan → A salah</text></g>
