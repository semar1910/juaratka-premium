<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Poppins, Arial, sans-serif">
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
  <rect class="fx pop" x="10" y="16" width="230" height="70" rx="35" fill="#1E88E5"/>
  <text class="muncul" x="125" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">tutup mata</text>
  <rect class="fx pop" style="animation-delay:.15s" x="252" y="16" width="250" height="70" rx="35" fill="#EF6C00"/>
  <text class="muncul" style="animation-delay:.15s" x="377" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">harus peduli</text>
  <rect class="fx pop" style="animation-delay:.3s" x="514" y="16" width="376" height="70" rx="35" fill="#8D6E63"/>
  <text class="muncul" style="animation-delay:.3s" x="702" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">sampah lingkungan</text>
</g>

<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="3" y="9" width="244" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 125 94 V160 H885 V400 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="125" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="400" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="muncul" x="40" y="190" width="820" height="420" rx="28" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
  <text class="muncul" x="450" y="242" text-anchor="middle" font-size="28" fill="#1565C0">Langkah 1: Cari ungkapan</text>
  <text class="fx pop" style="animation-delay:.3s" x="450" y="350" text-anchor="middle" font-size="54" font-weight="700" fill="#1565C0">tutup mata</text>
  <rect class="fx tumbuh" style="animation-delay:.6s" x="250" y="372" width="400" height="8" rx="4" fill="#1E88E5"/>
  <text class="muncul" style="animation-delay:1s" x="450" y="448" text-anchor="middle" font-size="36" font-weight="700" fill="#0D47A1">ada di kalimat Salma</text>
  <text class="muncul" style="animation-delay:1.5s" x="450" y="530" text-anchor="middle" font-size="28" fill="#555">“nggak bisa terus tutup mata”</text>
</g>

<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="245" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 377 94 V160 H885 V400 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="377" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="400" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="muncul" x="40" y="190" width="820" height="420" rx="28" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
  <text class="muncul" x="450" y="242" text-anchor="middle" font-size="28" fill="#BF360C">Langkah 2: Cari lawannya</text>
  <rect class="drop" style="animation-delay:.2s" x="60" y="265" width="320" height="100" rx="20" fill="#fff" stroke="#EF6C00" stroke-width="4"/>
  <text class="drop" style="animation-delay:.2s" x="220" y="329" text-anchor="middle" font-size="36" font-weight="700" fill="#BF360C">tutup mata</text>
  <rect class="drop" style="animation-delay:.5s" x="520" y="265" width="320" height="100" rx="20" fill="#fff" stroke="#EF6C00" stroke-width="4"/>
  <text class="drop" style="animation-delay:.5s" x="680" y="329" text-anchor="middle" font-size="36" font-weight="700" fill="#BF360C">harus peduli</text>
  <g class="muncul" style="animation-delay:.9s">
    <text x="450" y="296" text-anchor="middle" font-size="28" fill="#BF360C">lawan</text>
    <line x1="413" y1="322" x2="487" y2="322" stroke="#EF6C00" stroke-width="5"/>
    <polygon points="395,322 413,310 413,334" fill="#EF6C00"/>
    <polygon points="505,322 487,310 487,334" fill="#EF6C00"/>
  </g>
  <text class="fx pop" style="animation-delay:1.3s" x="450" y="470" text-anchor="middle" font-size="54" font-weight="700" fill="#E65100">Tidak peduli</text>
  <text class="muncul" style="animation-delay:1.7s" x="450" y="528" text-anchor="middle" font-size="28" fill="#BF360C">tutup mata lawan peduli</text>
  <text class="muncul" style="animation-delay:2s" x="450" y="583" text-anchor="middle" font-size="28" fill="#555">“Kita harus peduli”</text>
</g>

<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="507" y="9" width="390" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 702 94 V160 H885 V400 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="702" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="400" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="muncul" x="40" y="190" width="820" height="420" rx="28" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/>
  <text class="muncul" x="450" y="232" text-anchor="middle" font-size="28" fill="#4E342E">Langkah 3: Cocokkan pilihan</text>

  <g class="drop" style="animation-delay:.2s">
    <rect x="70" y="245" width="720" height="58" rx="16" fill="#E8F5E9" stroke="#43A047" stroke-width="4"/>
    <circle cx="105" cy="274" r="22" fill="#43A047"/>
    <text x="105" y="285" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">A</text>
    <text x="145" y="285" font-size="28" fill="#1B5E20">mengabaikan masalah sampah</text>
    <circle cx="755" cy="274" r="20" fill="#43A047"/>
    <polyline points="745,274 752,282 766,266" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="drop" style="animation-delay:.6s">
    <rect x="70" y="313" width="720" height="58" rx="16" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="4"/>
    <circle cx="105" cy="342" r="22" fill="#9E9E9E"/>
    <text x="105" y="353" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">B</text>
    <text x="145" y="353" font-size="28" fill="#424242">melupakan isu: terlalu luas</text>
    <circle cx="755" cy="342" r="20" fill="#E53935"/>
    <line x1="746" y1="333" x2="764" y2="351" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="764" y1="333" x2="746" y2="351" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="drop" style="animation-delay:1s">
    <rect x="70" y="381" width="720" height="58" rx="16" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="4"/>
    <circle cx="105" cy="410" r="22" fill="#9E9E9E"/>
    <text x="105" y="421" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">C</text>
    <text x="145" y="421" font-size="28" fill="#424242">hanya akibat</text>
    <circle cx="755" cy="410" r="20" fill="#E53935"/>
    <line x1="746" y1="401" x2="764" y2="419" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="764" y1="401" x2="746" y2="419" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="drop" style="animation-delay:1.4s">
    <rect x="70" y="449" width="720" height="58" rx="16" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="4"/>
    <circle cx="105" cy="478" r="22" fill="#9E9E9E"/>
    <text x="105" y="489" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">D</text>
    <text x="145" y="489" font-size="28" fill="#424242">hanya akibat</text>
    <circle cx="755" cy="478" r="20" fill="#E53935"/>
    <line x1="746" y1="469" x2="764" y2="487" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line x1="764" y1="469" x2="746" y2="487" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text class="fx pop" style="animation-delay:1.9s" x="450" y="573" text-anchor="middle" font-size="48" font-weight="700" fill="#2E7D32">Jawaban A</text>
</g>
</svg>
