-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="549" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">C: di Q, jalannya lebih jauh</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="329" y="9" width="243" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M451 94 V112 H885 V290 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="451" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="290" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="muncul" style="animation-delay:0.2s" d="M40 250 H860" stroke="#EF6C00" stroke-width="4" stroke-dasharray="10 8" fill="none"/><g class="fx pop" style="animation-delay:0.50s"><text x="450" y="236" text-anchor="middle" font-size="30" font-weight="700" fill="#EF6C00">tinggi sama</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="60" y="580" width="740" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="609" r="18" fill="#E53935"/><path d="M85 602 L99 616 M99 602 L85 616" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="619" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">D: tinggi sama, tenaga sama</text></g></g><g id="tahap5"><g class="penunjuk"><rect class="fx cincin" x="329" y="9" width="243" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M451 94 V112 H885 V290 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="451" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="290" r="12" fill="#E53935" stroke="#fff