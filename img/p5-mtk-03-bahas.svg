-delay:0.80s"><text x="790" y="308" text-anchor="start" font-size="34" font-weight="700" fill="#1E88E5">× 2</text></g><g class="muncul" style="animation-delay:0.90s"><rect x="640" y="330" width="25" height="66" fill="#EF6C00" fill-opacity="0.65" stroke="#546E7A" stroke-width="3"/><rect x="665" y="330" width="25" height="66" fill="#EF6C00" fill-opacity="0.65" stroke="#546E7A" stroke-width="3"/><rect x="690" y="330" width="25" height="66" fill="#EF6C00" fill-opacity="0.65" stroke="#546E7A" stroke-width="3"/><rect x="715" y="330" width="25" height="66" fill="#EF6C00" fill-opacity="0.65" stroke="#546E7A" stroke-width="3"/><rect x="740" y="330" width="25" height="66" fill="#EF6C00" fill-opacity="0.65" stroke="#546E7A" stroke-width="3"/><rect x="765" y="330" width="25" height="66" fill="#EF6C00" fill-opacity="0.65" stroke="#546E7A" stroke-width="3"/><rect x="790" y="330" width="25" height="66" fill="#fff" fill-opacity="1" stroke="#546E7A" stroke-width="3"/><rect x="815" y="330" width="25" height="66" fill="#fff" fill-opacity="1" stroke="#546E7A" stroke-width="3"/></g><g class="fx pop" style="animation-delay:1.60s"><text class="fx sorot" style="animation-delay:2.20s" x="740" y="425" text-anchor="middle" font-size="34" font-weight="700" fill="#2E7D32">6/8</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="150" y="590" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="624" r="20.4" fill="#2E7D32"/><path d="M177 624 L184 632 L196 617" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="636" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">jawaban: B, S, B</text></g></g></svg>