<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<!-- Pita Diketahui -->
<g id="tahap0">
  <g class="fx pop">
    <rect x="20" y="16" width="300" height="70" rx="35" fill="#1E88E5"/>
    <text x="170" y="61" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">sampah dikelola</text>
  </g>
  <g class="fx pop" style="animation-delay:.15s">
    <rect x="345" y="16" width="290" height="70" rx="35" fill="#EF6C00"/>
    <text x="490" y="61" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">sehat, nyaman</text>
  </g>
  <g class="fx pop" style="animation-delay:.3s">
    <rect x="660" y="16" width="220" height="70" rx="35" fill="#8D6E63"/>
    <text x="770" y="61" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">air &amp; udara</text>
  </g>
</g>

<!-- Tahap 1: cari kata kunci -->
<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="13" y="9" width="314" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 170 94 V108 H885 V195 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="170" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="195" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="drop">
    <rect x="38" y="130" width="824" height="130" rx="26" fill="#fff" stroke="#1E88E5" stroke-width="5"/>
    <text x="450" y="162" text-anchor="middle" font-size="28" fill="#607D8B">Langkah 1 · Cari kata kunci</text>
<g class="muncul" style="animation-delay:.35s"><text x="160" y="212" font-size="40" font-weight="700" fill="#263238">sampah</text><path d="M 352 198 H 412 M 396 185 L 412 198 L 396 211" fill="none" stroke="#1E88E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="437" y="212" font-size="40" font-weight="700" fill="#1E88E5">kalimat sampah</text></g>
    <text class="muncul" style="animation-delay:.7s" x="450" y="250" text-anchor="middle" font-size="28" fill="#455A64">“Pengelolaan sampah dilakukan dengan baik”</text>
  </g>
</g>

<!-- Tahap 2: hubungkan bukti -->
<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="338" y="9" width="304" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 490 94 V108 H885 V345 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="490" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="345" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="drop">
    <rect x="38" y="280" width="824" height="130" rx="26" fill="#fff" stroke="#EF6C00" stroke-width="5"/>
    <text x="450" y="312" text-anchor="middle" font-size="28" fill="#607D8B">Langkah 2 · Hubungkan bukti</text>
<g class="muncul" style="animation-delay:.35s"><text x="145" y="362" font-size="40" font-weight="700" fill="#263238">sampah baik</text><path d="M 430 348 H 490 M 474 335 L 490 348 L 474 361" fill="none" stroke="#EF6C00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="362" font-size="40" font-weight="700" fill="#EF6C00">kota bersih</text></g>
    <text class="muncul" style="animation-delay:.7s" x="450" y="400" text-anchor="middle" font-size="28" fill="#455A64">“kota menjadi sehat, nyaman”</text>
  </g>
</g>

<!-- Tahap 3: cocokkan pilihan -->
<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="653" y="9" width="234" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 770 94 V108 H885 V495 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="770" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="495" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="drop">
    <rect x="38" y="430" width="824" height="130" rx="26" fill="#fff" stroke="#8D6E63" stroke-width="5"/>
    <text x="410" y="462" text-anchor="middle" font-size="28" fill="#607D8B">Langkah 3 · Cocokkan pilihan</text>
<g class="muncul" style="animation-delay:.35s"><text x="150" y="512" font-size="40" font-weight="700" fill="#263238">cocok</text><path d="M 275 498 H 335 M 319 485 L 335 498 L 319 511" fill="none" stroke="#43A047" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="512" font-size="40" font-weight="700" fill="#43A047">kota bersih</text></g>
    <text class="muncul" style="animation-delay:.7s" x="410" y="550" text-anchor="middle" font-size="28" fill="#455A64">B air dan C udara: ciri lain</text>
  </g>
  <g class="fx pop" style="animation-delay:.9s">
    <circle cx="790" cy="495" r="42" fill="#43A047"/>
    <text x="790" y="513" text-anchor="middle" font-size="50" font-weight="700" fill="#fff">A</text>
  </g>
</g>
</svg>
