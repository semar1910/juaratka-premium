 y="200" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">4</text></g><g class="drop" style="animation-delay:0.40s"><rect x="386" y="305" width="128" height="95" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="450" y="295" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">2</text></g><g class="drop" style="animation-delay:0.50s"><rect x="586" y="400" width="128" height="0" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="650" y="390" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">0</text></g><text x="750" y="196" text-anchor="end" font-size="28" font-weight="600" fill="#37474F">paku yang naik</text><text x="450" y="482" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">tebal tumpukan kertas</text><g class="fx pop" style="animation-delay:1.20s"><text class="fx sorot" style="animation-delay:1.80s" x="450" y="540" text-anchor="middle" font-size="30" font-weight="700" fill="#EF6C00">makin tebal, makin sedikit</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="633" y="9" width="252" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M759 94 V112 H885 V589 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="759" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="589" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx kedut" style="animation-delay:0.30s"><rect x="186" y="210" width="128" height="190" rx="6" fill="#2E7D32" fill-opacity=".55" stroke="#2E7D32" stroke-width="5"/></g><g class="fx kedut" style="animation-delay:0.50s"><rect x="386" y="305" width="128" height="95" rx="6" fill="#2E7D32" fill-opacity=".55" stroke="#2E7D32" stroke-width="5"/></g><g class="fx pop" style="animation-delay:1.20s"><rect x="