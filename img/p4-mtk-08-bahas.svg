"28" font-weight="600" fill="#B71C1C">1 1/2 − 1 1/4 = 1/4 (hanya satu ruas)</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="56" y="9" width="383" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M247 94 V112 H885 V560 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="247" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="560" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><line class="muncul" style="animation-delay:0.10s" x1="650" y1="230" x2="650" y2="434" stroke="#455A64" stroke-width="3" stroke-dasharray="8 6"/><path class="garis" style="animation-delay:0.40s" d="M653 218 V206 H807 V218" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:0.90s"><text class="fx sorot" style="animation-delay:1.50s" x="730" y="192" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">selisih 1/2 km</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="90" y="540" width="720" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="126" cy="574" r="20.4" fill="#2E7D32"/><path d="M117 574 L124 582 L136 567" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="586" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">2 1/4 − 1 3/4 = 1/2 km (B)</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="90" y="622" width="720" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="122" cy="651" r="18" fill="#E53935"/><path d="M115 644 L129 658 M129 644 L115 658" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="150" y="661" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">2 1/4 − 1 3/4 ≠ 1 1/2 (tertukar)</text></g></g></svg>