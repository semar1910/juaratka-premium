<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 813" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="139" y="16" width="235" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="167" cy="54" r="10" fill="#1E88E5"/><text x="183" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">2 kg 400 g</text><rect x="390" y="16" width="189" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="418" cy="54" r="10" fill="#EF6C00"/><text x="434" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">1.850 g</text><rect x="595" y="16" width="165" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="623" cy="54" r="10" fill="#8D6E63"/><text x="639" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">3,2 kg</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="383" y="9" width="203" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M485 94 V112 H885 V250 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="485" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="250" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="muncul" style="animation-delay:0.10s"><text x="60" y="175" text-anchor="start" font-size="28" font-weight="700" fill="#455A64">baju</text></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="61.5" y="186.5" width="447.9" height="49" rx="10" fill="#1E88E5" fill-opacity=".85"/><g class="fx pop" style="animation-delay:0.80s"><text x="285" y="222" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">2 kg 400 g = 2.400 g</text></g><rect class="fx kiri tumbuh" style="animation-delay:1.20s" x="512.4" y="186.5" width="131.1" height="49" rx="10" fill="#2E7D32" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.70s"><text x="578" y="222" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">550 g</text></g><g class="muncul" style="animation-delay:0.10s"><text x="60" y="275" text-anchor="start" font-size="28" font-weight="700" fill="#455A64">buku</text></g><rect class="fx kiri tumbuh" style="animation-delay:0.80s" x="61.5" y="286.5" width="447.9" height="49" rx="10" fill="#EF6C00" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.30s"><text x="285" y="322" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">1.850 g</text></g><g class="fx pop" style="animation-delay:1.90s"><rect x="110" y="455" width="680" height="60" rx="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="142" cy="485" r="18.0" fill="#2E7D32"/><path d="M134 485 L140 492 L151 479" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="497" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">1: buku lebih ringan 550 g</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="588" y="9" width="179" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M678 94 V112 H885 V410 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="678" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="410" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="muncul" style="animation-delay:0.10s"><text x="60" y="375" text-anchor="start" font-size="28" font-weight="700" fill="#455A64">sepatu</text></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="61.5" y="386.5" width="582.0" height="49" rx="10" fill="#8D6E63" fill-opacity=".85"/><g class="fx pop" style="animation-delay:0.80s"><text x="352" y="422" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">3,2 kg = 3.200 g</text></g><rect class="fx kiri tumbuh" style="animation-delay:1.20s" x="646.5" y="386.5" width="192.0" height="49" rx="10" fill="#2E7D32" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.70s"><text x="742" y="422" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">800 g</text></g><g class="fx pop" style="animation-delay:1.50s"><rect x="110" y="525" width="680" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="142" cy="554" r="18" fill="#E53935"/><path d="M135 547 L149 561 M149 547 L135 561" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="170" y="564" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">bukan 1.200 g: 3.200 − 2.400 = 800</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="110" y="593" width="680" height="60" rx="30" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="142" cy="623" r="18.0" fill="#E53935"/><path d="M135 616 L149 630 M149 616 L135 630" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="178" y="635" text-anchor="start" font-size="32" font-weight="700" fill="#B71C1C">2: selisih 800 g, bukan 1.200 g</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="132" y="9" width="249" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M257 94 V112 H885 V640 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="257" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="640" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="110" y="661" width="680" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="142" cy="690" r="18" fill="#E53935"/><path d="M135 683 L149 697 M149 683 L135 697" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="170" y="700" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">kg saja: 2 + 1 + 3 = 6 (lupa gram)</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="110" y="729" width="680" height="60" rx="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="142" cy="759" r="18.0" fill="#2E7D32"/><path d="M134 759 L140 766 L151 753" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="771" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">3: 7.450 g = 7,45 kg &gt; 7 kg</text></g></g></svg>