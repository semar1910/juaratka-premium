 font-weight="700" fill="#0D47A1">1/2 × 8 × 2 = 8 m²</text></g><g class="fx pop" style="animation-delay:1.80s"><text x="420" y="330" text-anchor="start" font-size="30" font-weight="700" fill="#0D47A1">24 + 8 = 32 m²</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="50" y="385" width="350" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="82" cy="414" r="18" fill="#E53935"/><path d="M75 407 L89 421 M89 407 L75 421" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="110" y="424" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">tanpa 1/2: 16 m²</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="437" y="9" width="165" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M520 94 V112 H885 V377 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="520" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="377" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="196.0" y="278" width="36" height="72" fill="#FFAB91" stroke="#E64A19" stroke-width="4"/></g><g class="fx pop" style="animation-delay:0.80s"><text x="420" y="377" text-anchor="start" font-size="30" font-weight="700" fill="#BF360C">pintu: 1 × 2 = 2 m²</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="604" y="9" width="233" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M720 94 V112 H885 V424 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="720" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="424" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="97.0" y="263.6" width="72" height="36" fill="#BCAAA4" stroke="#6D4C41" stroke-width="4"/><rect x="259.0" y="263.6" width="72" height="36" fill="#BCAAA4" stroke="#6D4C41" stroke-width="4"/></g><g class="fx pop" style="animation-delay:0.80s"><text x="420" y="424" text-anchor="start" font-size="30" font-weight="700" fill="#4E342E">jendela: 2 × 2 = 4 m²</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="46" y="455" width="384" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="78" cy="484" r="18" fill="#E53935"/><path d="M71 477 L85 491 M85 477 L71 491" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="106" y="494" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">1 jendela saja: 2 m²</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="63" y="9" width="372" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M249 94 V112 H885 V574 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="249" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="574" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="130" y="540" width="640" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="166" cy="574" r="20.4" fill="#2E7D32"/><path d="M157 574 L164 582 L176 567" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="586" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">32 − 2 − 4 = 26 m²</text></g></g></svg>