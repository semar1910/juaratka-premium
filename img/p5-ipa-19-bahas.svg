<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 748" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="27" y="16" width="316" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="55" cy="54" r="10" fill="#1E88E5"/><text x="71" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">X gerigi, Y rata</text><rect x="359" y="16" width="244" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="387" cy="54" r="10" fill="#EF6C00"/><text x="403" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">6 N dan 2 N</text><rect x="619" y="16" width="254" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="647" cy="54" r="10" fill="#8D6E63"/><text x="663" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">sama berat</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="352" y="9" width="258" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M481 94 V112 H885 V272 H460" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="481" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="460" cy="272" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect x="30" y="340" width="840" height="36" rx="10" fill="#BBDEFB"/><path d="M30 340 H870" stroke="#64B5F6" stroke-width="3" fill="none"/><ellipse cx="110" cy="358" rx="22" ry="5" fill="#E3F2FD"/><ellipse cx="330" cy="358" rx="22" ry="5" fill="#E3F2FD"/><ellipse cx="560" cy="358" rx="22" ry="5" fill="#E3F2FD"/><ellipse cx="810" cy="358" rx="22" ry="5" fill="#E3F2FD"/><rect x="60" y="244" width="220" height="56" rx="26" fill="#ECEFF1" stroke="#546E7A" stroke-width="4"/><rect x="40" y="296" width="260" height="28" rx="10" fill="#455A64"/><path d="M44 322 L54 340 L64 322 L74 340 L84 322 L94 340 L104 322 L114 340 L124 322 L134 340 L144 322 L154 340 L164 322 L174 340 L184 322 L194 340 L204 322 L214 340 L224 322 L234 340 L244 322 L254 340 L264 322 L274 340 L284 322 L294 340 L304 322 Z" fill="#263238" stroke="#263238" stroke-width="2" stroke-linejoin="round"/><rect x="500" y="244" width="220" height="56" rx="26" fill="#ECEFF1" stroke="#546E7A" stroke-width="4"/><rect x="480" y="296" width="260" height="28" rx="10" fill="#455A64"/><rect x="480" y="320" width="260" height="20" rx="6" fill="#455A64"/><text x="170" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">Sepatu X: bergerigi</text><text x="610" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">Sepatu Y: rata</text><path d="M300 272 L409 272" stroke="#EF6C00" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M420 272 L404 280 L404 264 Z" fill="#EF6C00"/><text x="360" y="240" text-anchor="middle" font-size="28" font-weight="700" fill="#BF360C">tarik 6 N</text><path d="M740 272 L769 272" stroke="#EF6C00" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M780 272 L764 280 L764 264 Z" fill="#EF6C00"/><text x="760" y="240" text-anchor="middle" font-size="28" font-weight="700" fill="#BF360C">tarik 2 N</text><path d="M300 358 L191 358" stroke="#E53935" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M180 358 L196 350 L196 366 Z" fill="#E53935"/><text x="240" y="414" text-anchor="middle" font-size="28" font-weight="700" fill="#B71C1C">gesek X</text><path d="M740 358 L711 358" stroke="#E53935" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M700 358 L716 350 L716 366 Z" fill="#E53935"/><text x="720" y="414" text-anchor="middle" font-size="28" font-weight="700" fill="#B71C1C">gesek Y</text><text x="450" y="460" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">lantai basah</text><g class="fx pop" style="animation-delay:1.00s"><rect x="100" y="500" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="534" r="20.4" fill="#2E7D32"/><path d="M127 534 L134 542 L146 527" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="545" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">1: gerigi, gesek lebih besar</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="352" y="9" width="258" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M481 94 V112 H885 V272 H840" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="481" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="840" cy="272" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx kedut" style="animation-delay:0.20s"><rect x="690" y="334" width="100" height="48" rx="12" fill="none" stroke="#E53935" stroke-width="4" stroke-dasharray="9 6"/></g><g class="fx pop" style="animation-delay:0.90s"><rect x="60" y="578" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="607" r="18" fill="#E53935"/><path d="M85 600 L99 614 M99 600 L85 614" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="617" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">2: alas rata = tanpa gaya gesek</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="20" y="9" width="330" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M185 94 V112 H885 V344 H240" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="185" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="240" cy="344" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx kedut" style="animation-delay:0.20s"><rect x="170" y="334" width="140" height="48" rx="12" fill="none" stroke="#2E7D32" stroke-width="4" stroke-dasharray="9 6"/></g><g class="fx pop" style="animation-delay:1.00s"><rect x="100" y="656" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="690" r="20.4" fill="#2E7D32"/><path d="M127 690 L134 698 L146 683" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="701" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">3: gesek ke kiri, melawan tarikan</text></g></g></svg>