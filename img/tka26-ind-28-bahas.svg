  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="350" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g><g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="290" width="800" height="120" rx="24" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
  <text x="70" y="328" font-size="28" font-weight="600" fill="#EF6C00">Temukan kesukaan</text>
  <text x="815" y="328" text-anchor="end" font-size="28" fill="#374151">“suka sekali menggambar”</text>
  <text class="muncul" style="animation-delay:0.5s" x="70" y="382" font-size="44" font-weight="700" fill="#111827">suka menggambar = Lianne</text></g></g>
