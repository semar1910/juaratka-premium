<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0"><rect x="30" y="16" width="250" height="70" rx="35" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/><text x="155.0" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">Namaku Lianne</text><rect x="305" y="16" width="290" height="70" rx="35" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/><text x="450.0" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">Suka menggambar</text><rect x="620" y="16" width="250" height="70" rx="35" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/><text x="745.0" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">Teman-temanku</text></g>
<g id="tahap1"><g class="penunjuk">
  <rect class="fx cincin" x="23" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 155 94 V124 H885 V210 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="155" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="210" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g><g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="150" width="800" height="120" rx="24" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
  <text x="70" y="188" font-size="28" font-weight="600" fill="#1E88E5">Cari pencerita</text>
  <text x="815" y="188" text-anchor="end" font-size="28" fill="#374151">“Namaku Lianne”</text>
  <text class="muncul" style="animation-delay:0.5s" x="70" y="242" font-size="44" font-weight="700" fill="#111827">kata aku → Lianne</text></g></g>
<g id="tahap2"><g class="penunjuk">
  <rect class="fx cincin" x="298" y="9" width="304" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
