  <text x="727" y="474" text-anchor="middle" font-size="30" font-weight="700" fill="#111827">Amber</text>
  <text x="727" y="512" text-anchor="middle" font-size="28" fill="#374151">bernyanyi</text>
  <path class="garis" style="animation-delay:1.2000000000000002s" d="M800 444 L826 470 M826 444 L800 470" stroke="#E53935" stroke-width="6" stroke-linecap="round" fill="none"/></g><g class="fx pop" style="animation-delay:1.3s"><rect x="40" y="548" width="805" height="76" rx="24" fill="#E8F5E9" stroke="#43A047" stroke-width="4"/>
  <text x="442" y="598" text-anchor="middle" font-size="40" font-weight="700" fill="#1B5E20">Jawaban C: Lianne</text></g></g>
