<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 562" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="31" y="16" width="185" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="59" cy="54" r="10" fill="#1E88E5"/><text x="75" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">nilai 90</text><rect x="232" y="16" width="310" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="260" cy="54" r="10" fill="#EF6C00"/><text x="276" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">mengaku jujur</text><rect x="558" y="16" width="311" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="586" cy="54" r="10" fill="#8D6E63"/><text x="602" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">belajar sendiri</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="551" y="9" width="325" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M714 94 V112 H872 V180" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="714" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="180" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="140" width="820" height="86" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="68" y="178" text-anchor="start" font-size="30" font-weight="700" fill="#263238">Gita</text><text x="68" y="212" text-anchor="start" font-size="28" font-weight="600" fill="#455A64">mengerjakan sendiri, tidak menyalin</text><circle cx="816" cy="183" r="24" fill="#2E7D32"/><path d="M805 183 L814 192 L828 175" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g id="tahap2"><g class="penunjuk"><re