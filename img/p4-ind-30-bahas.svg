 d="M805 387 L814 396 L828 379" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fx pop" style="animation-delay:1.00s"><rect x="100" y="470" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="504" r="20.4" fill="#2E7D32"/><path d="M127 504 L134 512 L146 497" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="515" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">jawaban: Benar, Salah, Benar</text></g></g></svg>