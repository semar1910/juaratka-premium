-delay:2.50s" x="730" y="435" text-anchor="middle" font-size="34" font-weight="700" fill="#8D6E63">= 300 cm</text></g><g class="fx pop" style="animation-delay:2.60s"><rect x="572" y="455" width="312" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="604" cy="484" r="18" fill="#E53935"/><path d="M597 477 L611 491 M611 477 L597 491" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="632" y="494" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">90 + 60 = 150</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="645" y="9" width="231" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M761 94 V112 H885 V570 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="761" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="570" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.20s" x="80" y="570" width="740" height="60" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><g class="fx pop" style="animation-delay:0.80s"><text class="fx sorot" style="animation-delay:1.40s" x="450" y="556" text-anchor="middle" font-size="32" font-weight="700" fill="#BF360C">4 m = 400 cm</text></g><rect class="fx kiri tumbuh" style="animation-delay:1.40s" x="81.5" y="571.5" width="552.0" height="57" rx="12" fill="#8D6E63" fill-opacity=".85"/><g class="fx pop" style="animation-delay:2.00s"><text x="358" y="611" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">keliling 300</text></g><path class="garis" style="animation-delay:1.60s" d="M638 642 V654 H817 V642" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:2.10s"><text class="fx sorot" style="animation-delay:2.70s" x="728" y="692" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">sisa 100 cm</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="80" y="665" width="500" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="112" cy="694" r="18" fill="#E53935"/><path d="M105 687 L119 701 M119 687 L105 701" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="140" y="704" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">300 − 4 = 296 cm</text></g><g class="fx pop" style="animation-delay:2.90s"><rect x="130" y="745" width="640" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="166" cy="779" r="20.4" fill="#2E7D32"/><path d="M157 779 L164 787 L176 772" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="791" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">sisa renda = 100 cm</text></g></g></svg>