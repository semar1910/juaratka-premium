<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
 <g id="tahap0">
  <rect x="15" y="16" width="280" height="70" rx="35" fill="#1E88E5"/>
  <text x="155" y="62" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">Harus peduli</text>
  <rect x="310" y="16" width="280" height="70" rx="35" fill="#EF6C00"/>
  <text x="450" y="62" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">Hal kecil</text>
  <rect x="605" y="16" width="280" height="70" rx="35" fill="#8D6E63"/>
  <text x="745" y="62" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">Tinggal buang</text>
 </g>
 <g id="tahap1">
  <g class="penunjuk">
   <rect class="fx cincin" x="8" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
   <path class="alir" d="M155 94 V112" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
   <circle class="fx pop" cx="155" cy="94" r="9" fill="#E53935"/>
   <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="155" cy="112" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
   <rect class="muncul" x="15" y="112" width="420" height="62" rx="18" fill="#263238"/>
   <text class="muncul" x="225" y="154" text-anchor="middle" font-size="32" font-weight="700" fill="#FFFFFF">Pilih nilai moral</text>
   <text class="muncul" x="470" y="154" font-size="28" fill="#455A64" style="animation-delay:0.2s">Jawaban lebih dari satu</text>
   <g class="muncul" style="animation-delay:0.3s">
   <rect x="15" y="200" width="420" height="190" rx="24" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="4"/>
   <circle cx="65" cy="255" r="30" fill="#546E7A"/>
   <text x="65" y="267" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">B</text>
   <text x="100" y="266" font-size="28" font-weight="700" fill="#263238">Peduli lingkungan</text>
   </g>
   <g class="muncul" style="animation-delay:0.44999999999999996s">
   <rect x="465" y="200" width="420" height="190" rx="24" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="4"/>
   <circle cx="515" cy="255" r="30" fill="#546E7A"/>
   <text x="515" y="267" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">C</text>
   <text x="550" y="266" font-size="28" font-weight="700" fill="#263238">Langkah kecil</text>
   </g>
   <g class="muncul" style="animation-delay:0.6s">
   <rect x="15" y="410" width="420" height="190" rx="24" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="4"/>
   <circle cx="65" cy="465" r="30" fill="#546E7A"/>
   <text x="65" y="477" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">A</text>
   <text x="100" y="476" font-size="28" font-weight="700" fill="#263238">Bebas memilih</text>
   </g>
   <g class="muncul" style="animation-delay:0.75s">
   <rect x="465" y="410" width="420" height="190" rx="24" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="4"/>
   <circle cx="515" cy="465" r="30" fill="#546E7A"/>
   <text x="515" y="477" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">D</text>
   <text x="550" y="476" font-size="28" font-weight="700" fill="#263238">Beli kemasan</text>
   </g>
 </g>
 <g id="tahap2">
  <g class="penunjuk">
   <rect class="fx cincin" x="8" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
   <path class="alir" d="M15 51 H5 V295 H15" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
   <circle class="fx pop" cx="15" cy="51" r="9" fill="#E53935"/>
   <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="15" cy="295" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
   <rect class="muncul" x="15" y="200" width="420" height="190" rx="24" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="5" style="animation-delay:0.2s"/>
   <text class="muncul" x="45" y="318" font-size="28" fill="#37474F" style="animation-delay:0.4s">“Kita harus peduli”</text>
   <g class="fx pop" style="animation-delay:0.7s"><path d="M47 358 L59 370 L81 342" fill="none" stroke="#2E7D32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="100" y="370" font-size="32" font-weight="700" fill="#2E7D32">Benar</text></g>
 </g>
 <g id="tahap3">
  <g class="penunjuk">
   <rect class="fx cincin" x="303" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
   <path class="alir" d="M450 94 V295 H463" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
   <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
   <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="465" cy="295" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
   <rect class="muncul" x="465" y="200" width="420" height="190" rx="24" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="5" style="animation-delay:0.2s"/>
   <text class="muncul" x="495" y="318" font-size="28" fill="#37474F" style="animation-delay:0.4s">“Mulai dari hal kecil”</text>
   <g class="fx pop" style="animation-delay:0.7s"><path d="M497 358 L509 370 L531 342" fill="none" stroke="#2E7D32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="550" y="370" font-size="32" font-weight="700" fill="#2E7D32">Benar</text></g>
 </g>
 <g id="tahap4">
  <g class="penunjuk">
   <rect class="fx cincin" x="598" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
   <path class="alir" d="M885 51 H895 V505 H887" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
   <circle class="fx pop" cx="885" cy="51" r="9" fill="#E53935"/>
   <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="885" cy="505" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
   <rect class="muncul" x="465" y="410" width="420" height="190" rx="24" fill="#C62828" fill-opacity="0.12" stroke="#C62828" stroke-width="5" style="animation-delay:0.2s"/>
   <text class="muncul" x="495" y="528" font-size="28" fill="#37474F" style="animation-delay:0.4s">Tinggal buang = Alvin</text>
   <g class="fx pop" style="animation-delay:0.7s"><path d="M499 554 L527 582 M527 554 L499 582" fill="none" stroke="#C62828" stroke-width="8" stroke-linecap="round"/>
   <text x="550" y="580" font-size="32" font-weight="700" fill="#C62828">Salah</text></g>
   <rect class="muncul" x="15" y="410" width="420" height="190" rx="24" fill="#C62828" fill-opacity="0.12" stroke="#C62828" stroke-width="5" style="animation-delay:1.0s"/>
   <text class="muncul" x="45" y="528" font-size="28" fill="#37474F" style="animation-delay:1.2s">Salma meluruskan Alvin</text>
   <g class="fx pop" style="animation-delay:1.5s"><path d="M49 554 L77 582 M77 554 L49 582" fill="none" stroke="#C62828" stroke-width="8" stroke-linecap="round"/>
   <text x="100" y="580" font-size="32" font-weight="700" fill="#C62828">Salah</text></g>
 </g>
 <g id="tahap5">
