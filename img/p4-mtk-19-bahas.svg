42E">80 m</text></g><path class="muncul" style="animation-delay:1.30s" d="M270 200 L630 200 L630 440 L270 440 Z" fill="none" stroke="#E53935" stroke-width="7" stroke-linejoin="round"/><g class="fx pop" style="animation-delay:2.00s"><text x="450" y="331" text-anchor="middle" font-size="30" font-weight="700" fill="#4E342E">1 putaran = 400 m</text></g><g class="fx pop" style="animation-delay:2.60s"><rect x="190" y="490" width="520" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="222" cy="519" r="18" fill="#E53935"/><path d="M215 512 L229 526 M229 512 L215 526" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="250" y="529" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">panjang + lebar = 200 m saja</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="64" y="9" width="242" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M185 94 V112 H885 V590 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="185" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="590" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="66" y="560" width="180" height="56" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="156" y="599" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">400 m</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="262" y="560" width="180" height="56" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="352" y="599" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">400 m</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="458" y="560" width="180" height="56" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="548" y="599" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">400 m</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="654" y="560" width="180" height="56" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="744" y="599" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">400 m</text></g><g class="fx pop" style="animation-delay:1.90s"><text class="fx sorot" style="animation-delay:2.50s" x="450" y="674" text-anchor="middle" font-size="34" font-weight="700" fill="#1E88E5">4 × 400 = 1.600 m</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="308" y="9" width="227" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M421 94 V112 H885 V734 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="421" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="734" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="130" y="700" width="640" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="166" cy="734" r="20.4" fill="#2E7D32"/><path d="M157 734 L164 742 L176 727" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="206" y="746" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">1.600 ÷ 16 = 100 m/menit</text></g></g></svg>