<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
<g class="fx pop" style="animation-delay:0.0s"><rect x="10" y="16" width="270" height="70" rx="35" fill="#1E88E5"/><text x="145" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Yunus kesal</text></g>
<g class="fx pop" style="animation-delay:0.2s"><rect x="315" y="16" width="270" height="70" rx="35" fill="#EF6C00"/><text x="450" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Ikut melaut</text></g>
<g class="fx pop" style="animation-delay:0.4s"><rect x="620" y="16" width="270" height="70" rx="35" fill="#8D6E63"/><text x="755" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Melaut sendiri</text></g>
</g>
<g id="tahap1">
<g class="penunjuk"><rect class="fx cincin" x="3" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 145 94 V130 H885 V245 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="145" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="245" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="170" width="810" height="150" rx="22" fill="#FFF8EC" stroke="#C62828" stroke-width="4"/><text x="64" y="208" font-size="28" fill="#5D4037">1 · Johan: baik hati?</text><text x="64" y="260" font-size="38" font-weight="700" fill="#263238">Kesal &amp; tegas</text><text x="517" y="260" text-anchor="middle" font-size="40" font-weight="700" fill="#263238">→</text><text x="64" y="302" font-size="28" fill="#6D4C41">“Yunus sampai kesal”</text></g>
<g class="fx pop" style="animation-delay:0.9s"><rect x="545" y="218" width="285" height="58" rx="29" fill="#C62828"/><text x="687" y="258" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Tidak Sesuai</text></g>
</g>
<g id="tahap2">
<g class="penunjuk"><rect class="fx cincin" x="308" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><rect class="fx cincin" x="613" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 450 94 V130 H885 V407 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="407" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="332" width="810" height="150" rx="22" fill="#FFF8EC" stroke="#2E7D32" stroke-width="4"/><text x="64" y="370" font-size="28" fill="#5D4037">2 · Simon: menemani</text><text x="64" y="422" font-size="38" font-weight="700" fill="#263238">Ikut, lalu sendiri</text><text x="517" y="422" text-anchor="middle" font-size="40" font-weight="700" fill="#263238">→</text><text x="64" y="464" font-size="28" fill="#6D4C41">“melaut dengan perahunya sendiri”</text></g>
<g class="fx pop" style="animation-delay:0.9s"><rect x="545" y="380" width="285" height="58" rx="29" fill="#2E7D32"/><text x="687" y="420" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Sesuai</text></g>
</g>
<g id="tahap3">
<g class="penunjuk"><rect class="fx cincin" x="3" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 145 94 V130 H885 V569 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="145" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="569" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="494" width="810" height="150" rx="22" fill="#FFF8EC" stroke="#2E7D32" stroke-width="4"/><text x="64" y="532" font-size="28" fill="#5D4037">3 · Maria: teguran</text><text x="64" y="584" font-size="38" font-weight="700" fill="#263238">Teguran keras</text><text x="517" y="584" text-anchor="middle" font-size="40" font-weight="700" fill="#263238">→</text><text x="64" y="626" font-size="28" fill="#6D4C41">“Orang kampung juga malas denganmu”</text></g>
<g class="fx pop" style="animation-delay:0.9s"><rect x="545" y="542" width="285" height="58" rx="29" fill="#2E7D32"/><text x="687" y="582" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Sesuai</text></g>
</g>
</svg>