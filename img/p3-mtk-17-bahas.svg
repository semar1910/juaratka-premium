oke-width="2.5" stroke-dasharray="8 6"/><circle cx="222" cy="547" r="18" fill="#E53935"/><path d="M215 540 L229 554 M229 540 L215 554" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="250" y="557" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Keliru: 140 + 60 = 200 m</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="505" y="9" width="242" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M626 94 V112 H885 V650 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="626" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="650" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="130" y="598" width="200" height="58" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="230" y="638" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">400 m</text></g><g class="fx pop" style="animation-delay:0.50s"><text x="350" y="638" text-anchor="middle" font-size="34" font-weight="700" fill="#607D8B">+</text></g><g class="fx pop" style="animation-delay:0.80s"><rect x="370" y="598" width="200" height="58" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="470" y="638" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">400 m</text></g><g class="fx pop" style="animation-delay:1.10s"><text x="590" y="638" text-anchor="middle" font-size="34" font-weight="700" fill="#607D8B">+</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="610" y="598" width="200" height="58" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="710" y="638" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">400 m</text></g><g class="fx pop" style="animation-delay:2.00s"><rect x="150" y="676" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="710" r="20.4" fill="#2E7D32"/><path d="M177 710 L184 718 L196 703" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="722" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">3 × 400 = 1.200 m</text></g></g></svg>