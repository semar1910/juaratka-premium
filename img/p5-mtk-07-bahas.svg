 text-anchor="middle" font-size="32" font-weight="700" fill="#fff">1/4 = 25%</text></g><text x="90" y="386" text-anchor="start" font-size="30" font-weight="700" fill="#0D47A1">Toko B</text><rect class="fx kiri tumbuh" style="animation-delay:0.20s" x="90" y="400" width="720" height="60" rx="14" fill="#F5E6C8" stroke="#8B6B3E" stroke-width="3"/><rect class="fx kiri tumbuh" style="animation-delay:1.30s" x="91.5" y="401.5" width="213.0" height="57" rx="12" fill="#1E88E5" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.90s"><text x="198" y="442" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">30%</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="60" y="560" width="780" height="54" rx="27" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="89" cy="587" r="16.2" fill="#2E7D32"/><path d="M82 587 L87 593 L97 581" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="597" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">1 Benar: 30% lebih besar dari 25%</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="474" y="9" width="320" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M634 94 V112 H885 V340 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="634" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="340" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M93 272 V284 H267 V272" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:0.80s"><text class="fx sorot" style="animation-delay:1.40s" x="180" y="322" text-anchor="middle" font-size="32" font-weight="700" fill="#EF6C00">potong 30.000</text></g><g class="fx pop" 