<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" font-family="Poppins, Inter, Arial, sans-serif">
<rect width="600" height="330" fill="#fff"/>
<text x="300.0" y="34" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >1 hektar = 10.000 m²</text><rect x="60" y="70" width="220" height="220" rx="4" fill="#86EFAC" stroke="#047857" stroke-width="3" fill-opacity="0.45"/><rect x="140.0" y="150.0" width="60" height="60" fill="none" stroke="#fff" stroke-width="2.5"/><line x1="60" y1="180.0" x2="280" y2="180.0" stroke="#fff" stroke-width="2.5"/><text x="170.0" y="316" font-size="15" font-weight="700" fill="#6B7280" text-anchor="middle" >100 m</text><text x="48" y="185.0" font-size="15" font-weight="700" fill="#6B7280" text-anchor="end" transform="rotate(-90 48 180.0)">100 m</text><text x="170.0" y="60" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle" >kira-kira 1 lapangan sepak bola</text><rect x="320" y="76" width="250" height="50" rx="10" fill="#DBEAFE" stroke="none" stroke-width="0" /><text x="445" y="108" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle" >100 m × 100 m = 10.000 m²</text><text x="320" y="154" font-size="16" font-weight="700" fill="#065F46" text-anchor="start" >2,5 ha = 25.000 m²</text><text x="320" y="184" font-size="16" font-weight="700" fill="#111827" text-anchor="start" >1 are = 100 m²</text><rect x="320" y="214" width="250" height="74" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" /><text x="445" y="240" font-size="15" font-weight="700" fill="#B91C1C" text-anchor="middle" >Hati-hati!</text><text x="445" y="262" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle" >Pilihan jawaban sering berisi</text><text x="445" y="280" font-size="13" font-weight="600" fill="#7F1D1D" text-anchor="middle" >luas bagian yang lain</text>
