="animation-delay:.4s"/><line class="garis" x1="140" y1="324" x2="140" y2="436" stroke="#8D6E63" stroke-width="10" stroke-linecap="round" style="animation-delay:.9s"/><text class="fx pop" style="animation-delay:1.4s" x="108" y="506" text-anchor="end" font-size="44" font-family="Poppins, sans-serif" font-weight="700" fill="#00796B">6 m</text><text class="fx pop" style="animation-delay:1.1s" x="336" y="392" text-anchor="middle" font-size="44" font-family="Poppins, sans-serif" font-weight="700" fill="#263238"><tspan fill="#EF6C00">4</tspan> + <tspan fill="#8D6E63">2</tspan> = <tspan fill="#00796B">6 m</tspan></text><g class="penunjuk"><rect class="fx cincin" x="313" y="9" width="274" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M450 94 V122 H885 V552 H845" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="845" cy="552" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="penunjuk"><rect class="fx cincin" x="613" y="9" width="274" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M750 94 V138 H866 V392 H706" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="750" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="706" cy="392" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g></g>
