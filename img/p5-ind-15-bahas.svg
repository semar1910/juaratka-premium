<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 712" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="31" y="16" width="253" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="59" cy="54" r="10" fill="#1E88E5"/><text x="75" y="64" text-anchor="start" font-size="28" font-weight="700" fill="#1F2937">Ayah sendiri</text><rect x="300" y="16" width="302" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="328" cy="54" r="10" fill="#EF6C00"/><text x="344" y="64" text-anchor="start" font-size="28" font-weight="700" fill="#1F2937">bantuan datang</text><rect x="618" y="16" width="252" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="646" cy="54" r="10" fill="#8D6E63"/><text x="662" y="64" text-anchor="start" font-size="28" font-weight="700" fill="#1F2937">pesan Kakek</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="24" y="9" width="267" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M157 94 V112 H450 V146" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="157" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="146" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="150" width="700" height="66" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><rect x="40" y="150" width="12" height="66" rx="6" fill="#1E88E5"/><text x="68" y="193" text-anchor="start" font-size="28" font-weight="600" fill="#0D47A1">“Ayah mencoba sendiri, gagal.”</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="293" y="9" width="316" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M451 94 V112 H885 V330 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="451" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="330" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="234" width="700" height="66" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><rect x="40" y="234" width="12" height="66" rx="6" fill="#EF6C00"/><text x="68" y="277" text-anchor="start" font-size="28" font-weight="600" fill="#BF360C">“Paman dan tetangga datang.”</text></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="318" width="700" height="66" rx="14" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/><rect x="40" y="318" width="12" height="66" rx="6" fill="#8D6E63"/><text x="68" y="361" text-anchor="start" font-size="28" font-weight="600" fill="#4E342E">“Jalur melaju bila kerja sama.”</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="60" y="540" width="740" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="569" r="18" fill="#E53935"/><path d="M85 562 L99 576 M99 562 L85 576" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="579" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">bekerja sendiri: tidak berhasil</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="611" y="9" width="266" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M743 94 V112 H885 V640 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="743" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="640" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.20s" d="M740 183 H790 V466 H820" fill="none" stroke="#90A4AE" stroke-width="4"/><path class="garis" style="animation-delay:0.20s" d="M740 267 H790 V466 H820" fill="none" stroke="#90A4AE" stroke-width="4"/><path class="garis" style="animation-delay:0.20s" d="M740 351 H790 V466 H820" fill="none" stroke="#90A4AE" stroke-width="4"/><g class="fx pop" style="animation-delay:1.00s"><rect x="40" y="432" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="430" y="478" text-anchor="middle" font-size="32" font-weight="700" fill="#1B5E20">Minta bantuan, kerja bersama</text></g><g class="fx pop" style="animation-delay:0.80s"><rect x="60" y="620" width="740" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="654" r="20.4" fill="#2E7D32"/><path d="M87 654 L94 662 L106 647" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="666" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">C: minta teman membantu</text></g></g></svg>