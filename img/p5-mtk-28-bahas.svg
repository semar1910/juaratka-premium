ght="600" fill="#0D47A1">40</text></g><g class="drop" style="animation-delay:0.40s"><rect x="260" y="212" width="92" height="98" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="306" y="202" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">30</text></g><g class="drop" style="animation-delay:0.50s"><rect x="404" y="229" width="92" height="81" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="450" y="219" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">25</text></g><g class="drop" style="animation-delay:0.60s"><rect x="548" y="245" width="92" height="65" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="594" y="235" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">20</text></g><g class="drop" style="animation-delay:0.70s"><rect x="692" y="278" width="92" height="32" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="738" y="268" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">10</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="90" y="372" width="720" height="58" rx="29" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="121" cy="401" r="17.4" fill="#2E7D32"/><path d="M113 401 L119 408 L130 395" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="156" y="411" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">A: 20 × 2 = 40 (Pramuka)</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="89" y="9" width="374" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M276 94 V112 H885 V400 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="276" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="400" r="12" fill="#E5