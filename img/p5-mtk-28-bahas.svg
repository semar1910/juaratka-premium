35" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="90" y="570" width="720" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="122" cy="599" r="18" fill="#E53935"/><path d="M115 592 L129 606 M129 592 L115 606" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="150" y="609" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">D: 20 + 10 = 30 = Futsal, bukan lebih</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="90" y="646" width="720" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="126" cy="680" r="20.4" fill="#2E7D32"/><path d="M117 680 L124 688 L136 673" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="692" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">Jawaban: A dan C</text></g></g></svg>