<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 636" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="40" y="16" width="282" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="68" cy="54" r="10" fill="#1E88E5"/><text x="84" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">keindahannya</text><rect x="337" y="16" width="216" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="365" cy="54" r="10" fill="#EF6C00"/><text x="381" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">berharga</text><rect x="569" y="16" width="291" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="597" cy="54" r="10" fill="#8D6E63"/><text x="613" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">permata desa</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="562" y="9" width="305" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M715 94 V112 H885 V255 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="715" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="255" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="250" y="134" width="400" height="66" rx="16" fill="#F3E5F5" stroke="#8E24AA" stroke-width="3"/><text x="450" y="179" text-anchor="middle" font-size="32" font-weight="700" fill="#4A148C">“permata desa”</text></g><g class="fx pop" style="animation-delay:0.40s"><rect x="40" y="226" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="255" r="18" fill="#E53935"/><path d="M65 248 L79 262 M79 248 L65 262" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="265" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">A: batu permata di pasir pantai</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="33" y="9" width="296" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M180 94 V112 H885 V332 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="180" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="332" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><rect x="40" y="298" width="820" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="76" cy="332" r="20.4" fill="#2E7D32"/><path d="M67 332 L74 340 L86 325" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="343" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">B: sangat indah dipandang</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="562" y="9" width="305" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M715 94 V112 H885 V409 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="715" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="409" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><rect x="40" y="380" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="409" r="18" fill="#E53935"/><path d="M65 402 L79 416 M79 402 L65 416" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="419" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">C: keras dan bulat seperti batu</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="330" y="9" width="230" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M445 94 V112 H885 V486 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="445" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="486" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><rect x="40" y="452" width="820" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="76" cy="486" r="20.4" fill="#2E7D32"/><path d="M67 486 L74 494 L86 479" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="497" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">D: berharga dan dijaga warga</text></g><g class="fx pop" style="animation-delay:0.90s"><rect x="150" y="544" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="578" r="20.4" fill="#2E7D32"/><path d="M177 578 L184 586 L196 571" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="590" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">Jawaban: B dan D</text></g></g></svg>