<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
  <g class="fx pop" style="animation-delay:0.00s"><rect x="15" y="16" width="270" height="70" rx="35" fill="#1E88E5"/><text x="150" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">senang sekali</text></g>
  <g class="fx pop" style="animation-delay:0.25s"><rect x="315" y="16" width="270" height="70" rx="35" fill="#EF6C00"/><text x="450" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">langit cerah</text></g>
  <g class="fx pop" style="animation-delay:0.50s"><rect x="615" y="16" width="270" height="70" rx="35" fill="#8D6E63"/><text x="750" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">diajak ayah</text></g>
</g>
<g id="tahap1">
  <rect class="fx pop" x="40" y="190" width="822" height="150" rx="24" fill="#E3F2FD" stroke="#1E88E5" stroke-width="5"/>
  <g class="fx pop" style="animation-delay:0.15s"><circle cx="97" cy="265" r="38" fill="#1E88E5"/><text x="97" y="279" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">A</text></g>
  <g class="muncul" style="animation-delay:0.35s">
    <text x="500" y="228" text-anchor="middle" font-size="28" fill="#546E7A">Langkah 1 · Cari petunjuk</text>
    <text x="500" y="278" text-anchor="middle" font-size="38" font-weight="700" fill="#263238">senang sekali: A benar</text>
    <text x="500" y="322" text-anchor="middle" font-size="28" fill="#37474F">“senang sekali … dengan ayah”</text>
  </g>
  <g class="penunjuk">
    <rect class="fx cincin" x="8" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 150 94 V160 H885 V265 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="265" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
</g>
<g id="tahap2">
  <rect class="fx pop" x="40" y="350" width="822" height="150" rx="24" fill="#EFEBE9" stroke="#8D6E63" stroke-width="5"/>
  <g class="fx pop" style="animation-delay:0.15s"><circle cx="97" cy="425" r="38" fill="#8D6E63"/><text x="97" y="439" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">B</text></g>
  <g class="muncul" style="animation-delay:0.35s">
    <text x="500" y="388" text-anchor="middle" font-size="28" fill="#546E7A">Langkah 2 · Periksa pengecoh</text>
    <text x="500" y="438" text-anchor="middle" font-size="38" font-weight="700" fill="#263238">tidak ada bukti: B salah</text>
    <text x="500" y="482" text-anchor="middle" font-size="28" fill="#37474F">“Ayah akan mengajakku melihat hujan meteor”</text>
  </g>
  <g class="penunjuk">
    <rect class="fx cincin" x="608" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 750 94 V160 H885 V425 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="750" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="425" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
</g>
<g id="tahap3">
  <rect class="fx pop" x="40" y="510" width="822" height="150" rx="24" fill="#FFF3E0" stroke="#EF6C00" stroke-width="5"/>
  <g class="fx pop" style="animation-delay:0.15s"><circle cx="97" cy="585" r="38" fill="#EF6C00"/><text x="97" y="599" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">C</text></g>
  <g class="muncul" style="animation-delay:0.35s">
    <text x="500" y="548" text-anchor="middle" font-size="28" fill="#546E7A">Langkah 3 · Hubungkan bukti</text>
    <text x="500" y="598" text-anchor="middle" font-size="38" font-weight="700" fill="#263238">berdoa, cerah: A dan C</text>
    <text x="500" y="642" text-anchor="middle" font-size="28" fill="#37474F">“berdoa supaya hari itu tidak hujan”</text>
  </g>
  <g class="penunjuk">
    <rect class="fx cincin" x="308" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 450 94 V160 H885 V585 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="585" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
</g>
</svg>