<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
<g class="fx pop" style="animation-delay:0.00s"><rect x="20" y="15" width="290" height="72" rx="36" fill="#1E88E5"/><text x="165" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Pengaruh budaya</text></g>
<g class="fx pop" style="animation-delay:0.20s"><rect x="340" y="15" width="260" height="72" rx="36" fill="#EF6C00"/><text x="470" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Nama berbeda</text></g>
<g class="fx pop" style="animation-delay:0.40s"><rect x="630" y="15" width="250" height="72" rx="36" fill="#8D6E63"/><text x="755" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Bisa jadi</text></g>
</g>
<g id="tahap1">
<g class="penunjuk"><rect class="fx cincin" x="8" y="9" width="884" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="fx muncul" style="animation-delay:0.2s"><rect x="40" y="190" width="822" height="410" rx="28" fill="#FFF8EC" stroke="#CBB89A" stroke-width="3"/>
<text x="451" y="250" text-anchor="middle" font-size="28" fill="#6D5A45">Langkah 1: Pahami soal</text>
<text x="451" y="326" text-anchor="middle" font-size="40" font-weight="700" fill="#222">kata kunci: unik</text>
<path d="M451 345 V366 M437 354 L451 368 L465 354" fill="none" stroke="#6D5A45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="171" y="378" width="560" height="76" rx="38" fill="#1565C0"/><text x="451" y="431" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">Cek tiap pilihan</text>
<rect x="90" y="486" width="722" height="86" rx="20" fill="#fff" stroke="#E0D2B8" stroke-width="3"/><text x="451" y="540" text-anchor="middle" font-size="28" font-style="italic" fill="#333">“makanan unik yang banyak disukai”</text></g>
</g>
<g id="tahap2">
<g class="penunjuk">
<rect class="fx cincin" x="623" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<path class="alir" d="M 755 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="fx pop" cx="755" cy="94" r="9" fill="#E53935"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<g class="fx muncul" style="animation-delay:0.2s"><rect x="40" y="190" width="822" height="410" rx="28" fill="#FFF8EC" stroke="#CBB89A" stroke-width="3"/>
<text x="451" y="250" text-anchor="middle" font-size="28" fill="#6D5A45">Langkah 2: Periksa pilihan A</text>
<text x="451" y="326" text-anchor="middle" font-size="40" font-weight="700" fill="#222">bisa jadi, bukan sama</text>
<path d="M451 345 V366 M437 354 L451 368 L465 354" fill="none" stroke="#6D5A45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="171" y="378" width="560" height="76" rx="38" fill="#C62828"/><text x="451" y="431" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">A salah</text>
<rect x="90" y="486" width="722" height="86" rx="20" fill="#fff" stroke="#E0D2B8" stroke-width="3"/><text x="451" y="540" text-anchor="middle" font-size="28" font-style="italic" fill="#333">“bisa jadi ikut mempengaruhi”</text></g>
</g>
<g id="tahap3">
<g class="penunjuk">
<rect class="fx cincin" x="13" y="9" width="304" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<path class="alir" d="M 165 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="fx pop" cx="165" cy="94" r="9" fill="#E53935"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<g class="fx muncul" style="animation-delay:0.2s"><rect x="40" y="190" width="822" height="410" rx="28" fill="#FFF8EC" stroke="#CBB89A" stroke-width="3"/>
<text x="451" y="250" text-anchor="middle" font-size="28" fill="#6D5A45">Langkah 3: Periksa pilihan B</text>
<text x="451" y="326" text-anchor="middle" font-size="40" font-weight="700" fill="#222">pengaruh berbagai budaya</text>
<path d="M451 345 V366 M437 354 L451 368 L465 354" fill="none" stroke="#6D5A45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="171" y="378" width="560" height="76" rx="38" fill="#2E7D32"/><text x="451" y="431" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">B benar</text>
<rect x="90" y="486" width="722" height="86" rx="20" fill="#fff" stroke="#E0D2B8" stroke-width="3"/><text x="451" y="540" text-anchor="middle" font-size="28" font-style="italic" fill="#333">“pengaruh dari berbagai budaya”</text></g>
</g>
<g id="tahap4">
<g class="penunjuk">
<rect class="fx cincin" x="333" y="9" width="274" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<path class="alir" d="M 470 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="fx pop" cx="470" cy="94" r="9" fill="#E53935"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<g class="fx muncul" style="animation-delay:0.2s"><rect x="40" y="190" width="822" height="410" rx="28" fill="#FFF8EC" stroke="#CBB89A" stroke-width="3"/>
<text x="451" y="250" text-anchor="middle" font-size="28" fill="#6D5A45">Langkah 4: Periksa pilihan C</text>
<text x="451" y="326" text-anchor="middle" font-size="40" font-weight="700" fill="#222">nama berbeda tiap daerah</text>
<path d="M451 345 V366 M437 354 L451 368 L465 354" fill="none" stroke="#6D5A45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="171" y="378" width="560" height="76" rx="38" fill="#2E7D32"/><text x="451" y="431" text-anchor="middle" font-size="40" font-weight="700" fill="#fff">Jawaban B dan C</text>
<rect x="90" y="486" width="722" height="86" rx="20" fill="#fff" stroke="#E0D2B8" stroke-width="3"/><text x="451" y="540" text-anchor="middle" font-size="28" font-style="italic" fill="#333">“ote-ote, bala-bala, badak”</text></g>
</g>
</svg>