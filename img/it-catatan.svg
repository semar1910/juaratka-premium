<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Jawabannya tertulis jelas</text><rect x="60" y="62" width="240" height="200" rx="6" fill="#FEF9C3" stroke="#B45309" stroke-width="2" /><circle cx="180" cy="62" r="8" fill="#EF4444"/><text x="180.0" y="110.0" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" >Ibu ke pasar</text><text x="180.0" y="138.0" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" >jam 9–11.</text><text x="180.0" y="180.0" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" >Makan siang</text><text x="180.0" y="204.0" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" >ada di meja.</text><rect x="68" y="90" width="224" height="60" rx="8" fill="none" stroke="#2563EB" stroke-width="3" /><rect x="340" y="90" width="220" height="70" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="450.0" y="120.0" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle" >"Ibu ke mana?"</text><text x="450.0" y="144.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >Jawab: ke pasar</text><rect x="340" y="180" width="220" height="60" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2" /><text x="450.0" y="206.0" font-size="15" font-weight="700" fill="#047857" text-anchor="middle" >informasi</text><text x="450.0" y="226.0" font-size="15" font-weight="700" fill="#047857" text-anchor="middle" >tersurat</text>
</svg>
