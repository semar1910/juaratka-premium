<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Poppins, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<defs>
<g id="dasar">
<line x1="40" y1="430" x2="560" y2="430" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
<line x1="300" y1="430" x2="443.4" y2="225.2" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
<circle cx="40" cy="430" r="9" fill="#37474F"/><circle cx="300" cy="430" r="9" fill="#37474F"/>
<circle cx="560" cy="430" r="9" fill="#37474F"/><circle cx="443.4" cy="225.2" r="9" fill="#37474F"/>
<g font-size="28" font-weight="700" fill="#263238" text-anchor="middle">
<text x="40" y="478">A</text><text x="300" y="478">O</text><text x="560" y="478">B</text><text x="462" y="214">C</text>
</g>
</g>
</defs>

<g id="tahap0" class="kini">
<rect width="900" height="600" fill="#FFF8EC"/>
<g class="fx pop"><rect x="20" y="16" width="410" height="70" rx="35" fill="#1E88E5"/>
<text x="225" y="62" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Garis AOB lurus = 180°</text></g>
<g class="fx pop" style="animation-delay:.2s"><rect x="470" y="16" width="410" height="70" rx="35" fill="#EF6C00"/>
<text x="675" y="62" font-size="27" font-weight="700" fill="#fff" text-anchor="middle">Sudut AOC = 125°</text></g>
</g>

<g id="tahap1" class="kini">
<use href="#dasar"/>
<path class="garis" style="animation-delay:.3s" d="M 410 430 A 110 110 0 0 0 190 430" fill="none" stroke="#1E88E5" stroke-width="8" stroke-linecap="round"/>
<text class="muncul" style="animation-delay:1.2s" x="300" y="300" font-size="40" font-weight="700" fill="#1E88E5" text-anchor="middle">180°</text>
<text class="muncul" style="animation-delay:1.8s" x="300" y="560" font-size="32" font-weight="700" fill="#263238" text-anchor="middle">AOC + BOC = 180°</text>
<g class="fx pop" style="animation-delay:2.2s"><rect x="600" y="370" width="262" height="100" rx="20" fill="#E3F2FD" stroke="#1E88E5" stroke-width="5"/>
<text x="731" y="438" font-size="50" font-weight="700" fill="#1E88E5" text-anchor="middle">180°</text></g>
<g class="penunjuk">
  <rect class="fx cincin" x="13" y="9" width="424" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 225 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="225" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
</g>

<g id="tahap2" class="kini">
<use href="#dasar"/>
<path class="garis" style="animation-delay:.3s" d="M 215 430 A 85 85 0 0 1 348.8 360.4" fill="none" stroke="#EF6C00" stroke-width="8" stroke-linecap="round"/>
<text class="muncul" style="animation-delay:.9s" x="242" y="322" font-size="30" font-weight="700" fill="#EF6C00" text-anchor="middle">125°</text>
<path class="garis" style="animation-delay:1.4s" d="M 360 430 A 60 60 0 0 0 334.4 380.8" fill="none" stroke="#2E7D32" stroke-width="8" stroke-linecap="round"/>
<text class="muncul" style="animation-delay:1.9s" x="372" y="404" font-size="30" font-weight="700" fill="#2E7D32">x</text>
<text class="muncul" style="animation-delay:2.0s" x="300" y="560" font-size="32" font-weight="700" fill="#263238" text-anchor="middle">180° − 125° = 55°</text>
<g class="fx pop" style="animation-delay:2.4s"><rect x="600" y="370" width="262" height="100" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="5"/>
<text x="731" y="438" font-size="50" font-weight="700" fill="#2E7D32" text-anchor="middle">55°</text></g>
<g class="penunjuk">
  <rect class="fx cincin" x="463" y="9" width="424" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 675 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="675" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
</g>
</svg>
