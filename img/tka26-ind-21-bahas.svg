<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
<g class="fx drop" style="animation-delay:0.0s"><rect x="10" y="16" width="250" height="70" rx="35" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/><text x="135" y="62" text-anchor="middle" font-size="30" font-weight="600" fill="#1565C0">memaksa hp</text></g>
<g class="fx drop" style="animation-delay:0.15s"><rect x="280" y="16" width="340" height="70" rx="35" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/><text x="450" y="62" text-anchor="middle" font-size="30" font-weight="600" fill="#BF360C">keadaan ayah ibu</text></g>
<g class="fx drop" style="animation-delay:0.3s"><rect x="640" y="16" width="250" height="70" rx="35" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/><text x="765" y="62" text-anchor="middle" font-size="30" font-weight="600" fill="#5D4037">minta buku</text></g>
</g>
<g id="tahap1">
<g class="penunjuk">
<rect class="fx cincin" x="3" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<path class="alir" d="M 135 94 V140 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="fx pop" cx="135" cy="94" r="9" fill="#E53935"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="muncul" x="40" y="190" width="822" height="370" rx="28" fill="#fff" stroke="#1E88E5" stroke-width="5"/>
<text class="muncul" x="451" y="240" text-anchor="middle" font-size="28" fill="#78909C">Cari masalah awal</text>
<text class="muncul" style="animation-delay:0.3s" x="451" y="310" text-anchor="middle" font-size="38" font-weight="600" fill="#37474F">Rara memaksa minta hp</text>
<path class="garis" style="animation-delay:0.6s" d="M451 330 V362 M437 348 L451 364 L465 348" fill="none" stroke="#1E88E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="fx pop" style="animation-delay:0.9s" x="451" y="425" text-anchor="middle" font-size="46" font-weight="700" fill="#1565C0">Awalnya memaksa</text>
<text class="muncul" style="animation-delay:1.4s" x="451" y="500" text-anchor="middle" font-size="28" font-style="italic" fill="#546E7A">&quot;Pokoknya Rara mau hp sebelum ruwatan&quot;</text>
</g>
<g id="tahap2">
<g class="penunjuk">
<rect class="fx cincin" x="273" y="9" width="354" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<path class="alir" d="M 450 94 V140 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="muncul" x="40" y="190" width="822" height="370" rx="28" fill="#fff" stroke="#EF6C00" stroke-width="5"/>
<text class="muncul" x="451" y="240" text-anchor="middle" font-size="28" fill="#78909C">Pahami keadaan</text>
<text class="muncul" style="animation-delay:0.3s" x="451" y="310" text-anchor="middle" font-size="38" font-weight="600" fill="#37474F">pedagang kecil, penjaga vila</text>
<path class="garis" style="animation-delay:0.6s" d="M451 330 V362 M437 348 L451 364 L465 348" fill="none" stroke="#EF6C00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="fx pop" style="animation-delay:0.9s" x="451" y="425" text-anchor="middle" font-size="46" font-weight="700" fill="#BF360C">Rara sadar keadaan</text>
<text class="muncul" style="animation-delay:1.4s" x="451" y="500" text-anchor="middle" font-size="28" font-style="italic" fill="#546E7A">&quot;Rara sadar, dirinya tidak kaya&quot;</text>
</g>
<g id="tahap3">
<g class="penunjuk">
<rect class="fx cincin" x="633" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<path class="alir" d="M 765 94 V140 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="fx pop" cx="765" cy="94" r="9" fill="#E53935"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="muncul" x="40" y="190" width="822" height="370" rx="28" fill="#fff" stroke="#8D6E63" stroke-width="5"/>
<text class="muncul" x="451" y="240" text-anchor="middle" font-size="28" fill="#78909C">Lihat permintaan akhir</text>
<text class="muncul" style="animation-delay:0.3s" x="451" y="310" text-anchor="middle" font-size="38" font-weight="600" fill="#37474F">hanya minta buku cerita</text>
<path class="garis" style="animation-delay:0.6s" d="M451 330 V362 M437 348 L451 364 L465 348" fill="none" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text class="fx pop" style="animation-delay:0.9s" x="451" y="425" text-anchor="middle" font-size="46" font-weight="700" fill="#5D4037">Menyesuaikan keadaan</text>
<text class="muncul" style="animation-delay:1.4s" x="451" y="500" text-anchor="middle" font-size="28" font-style="italic" fill="#546E7A">&quot;hanya meminta dibelikan buku cerita&quot;</text>
</g>
<g id="tahap4">
<g class="penunjuk">
<rect class="fx cincin" x="3" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
<path class="alir" d="M 135 94 V140 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
<circle class="fx pop" cx="135" cy="94" r="9" fill="#E53935"/>
<g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="muncul" x="40" y="190" width="822" height="370" rx="28" fill="#fff" stroke="#43A047" stroke-width="5"/>
<text class="muncul" x="451" y="240" text-anchor="middle" font-size="28" fill="#78909C">Cocokkan pilihan</text>
<g class="fx pop" style="animation-delay:0.3s"><circle cx="100" cy="293" r="28" fill="#43A047"/><path d="M88 293 L98 303 L114 283" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="muncul" style="animation-delay:0.4s" x="150" y="305" font-size="38" font-weight="600" fill="#37474F">A. Bertanya soal uang</text>
<g class="fx pop" style="animation-delay:0.8s"><circle cx="100" cy="368" r="28" fill="#E53935"/><path d="M90 358 L110 378 M110 358 L90 378" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>
<text class="muncul" style="animation-delay:0.9s" x="150" y="380" font-size="38" font-weight="600" fill="#37474F">B. Meminta langsung</text>
<g class="fx pop" style="animation-delay:1.3s"><circle cx="100" cy="443" r="28" fill="#43A047"/><path d="M88 443 L98 453 L114 433" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="muncul" style="animation-delay:1.4000000000000001s" x="150" y="455" font-size="38" font-weight="600" fill="#37474F">C. Memikirkan perlu</text>
<text class="fx pop" style="animation-delay:2.0s" x="451" y="535" text-anchor="middle" font-size="44" font-weight="700" fill="#2E7D32">Jawaban: A dan C</text>
</g>
</svg>
