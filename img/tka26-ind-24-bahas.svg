<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif">
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
  <g class="fx drop">
    <rect x="10" y="13" width="280" height="76" rx="38" fill="#1E88E5"/>
    <text x="150" y="62" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Belajar bareng</text>
  </g>
  <g class="fx drop" style="animation-delay:0.15s">
    <rect x="310" y="13" width="280" height="76" rx="38" fill="#EF6C00"/>
    <text x="450" y="62" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Yakin, main bola</text>
  </g>
  <g class="fx drop" style="animation-delay:0.3s">
    <rect x="610" y="13" width="280" height="76" rx="38" fill="#8D6E63"/>
    <text x="750" y="62" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Makin susah</text>
  </g>
</g>

<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="3" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 150 94 V160 H885 V405 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="405" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="fx pop" x="38" y="190" width="824" height="430" rx="28" fill="#fff" stroke="#1E88E5" stroke-width="6"/>
  <text class="muncul" style="animation-delay:0.2s" x="450" y="255" font-size="28" fill="#607D8B" text-anchor="middle">Langkah 1 · Pernyataan 1</text>
  <text class="muncul" style="animation-delay:0.4s" x="450" y="340" font-size="40" font-weight="700" fill="#1E88E5" text-anchor="middle">belajar bareng → Benar</text>
  <g class="fx pop" style="animation-delay:0.6s">
    <rect x="300" y="385" width="300" height="90" rx="45" fill="#2E7D32"/>
    <text x="450" y="449" font-size="48" font-weight="700" fill="#fff" text-anchor="middle">BENAR</text>
  </g>
  <text class="muncul" style="animation-delay:0.9s" x="450" y="550" font-size="28" font-style="italic" fill="#37474F" text-anchor="middle">“Ayo belajar bareng biar sama-sama tahu”</text>
</g>

<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="303" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 450 94 V160 H885 V405 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="405" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="fx pop" x="38" y="190" width="824" height="430" rx="28" fill="#fff" stroke="#EF6C00" stroke-width="6"/>
  <text class="muncul" style="animation-delay:0.2s" x="450" y="255" font-size="28" fill="#607D8B" text-anchor="middle">Langkah 2 · Pernyataan 2</text>
  <text class="muncul" style="animation-delay:0.4s" x="450" y="340" font-size="40" font-weight="700" fill="#EF6C00" text-anchor="middle">main bola → nilai jelek</text>
  <g class="fx pop" style="animation-delay:0.6s">
    <rect x="300" y="385" width="300" height="90" rx="45" fill="#C62828"/>
    <text x="450" y="449" font-size="48" font-weight="700" fill="#fff" text-anchor="middle">SALAH</text>
  </g>
  <text class="muncul" style="animation-delay:0.9s" x="450" y="540" font-size="28" font-style="italic" fill="#37474F" text-anchor="middle">“Mending aku main bola”</text>
  <text class="muncul" style="animation-delay:1.2s" x="450" y="590" font-size="28" font-style="italic" fill="#37474F" text-anchor="middle">“Kok nilaiku jelek banget”</text>
</g>

<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="603" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 750 94 V160 H885 V405 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="750" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="405" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="fx pop" x="38" y="190" width="824" height="430" rx="28" fill="#fff" stroke="#8D6E63" stroke-width="6"/>
  <text class="muncul" style="animation-delay:0.2s" x="450" y="255" font-size="28" fill="#607D8B" text-anchor="middle">Langkah 3 · Pernyataan 3</text>
  <text class="muncul" style="animation-delay:0.4s" x="450" y="340" font-size="40" font-weight="700" fill="#8D6E63" text-anchor="middle">harus belajar → Benar</text>
  <g class="fx pop" style="animation-delay:0.6s">
    <rect x="300" y="385" width="300" height="90" rx="45" fill="#2E7D32"/>
    <text x="450" y="449" font-size="48" font-weight="700" fill="#fff" text-anchor="middle">BENAR</text>
  </g>
  <text class="muncul" style="animation-delay:0.9s" x="450" y="540" font-size="28" font-style="italic" fill="#37474F" text-anchor="middle">“Kamu harus belajar kalau mau nilai bagus”</text>
  <text class="muncul" style="animation-delay:1.3s" x="450" y="590" font-size="28" font-weight="700" fill="#2E7D32" text-anchor="middle">Jawaban: B · S · B</text>
</g>
</svg>
