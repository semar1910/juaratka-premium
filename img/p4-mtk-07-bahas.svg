buh" style="animation-delay:1.30s" x="299.5" y="251.5" width="301.0" height="71" rx="12" fill="#EF6C00" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.90s"><text x="450" y="299" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">2/5 = 40%</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="60" y="408" width="780" height="54" rx="27" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="89" cy="435" r="16.2" fill="#2E7D32"/><path d="M82 435 L87 441 L97 429" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="445" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">A benar: 40% lebih besar dari 30%</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="64" y="9" width="248" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M188 94 V112 H885 V340 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="188" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="340" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M73 336 V348 H295 V336" fill="none" stroke="#1E88E5" stroke-width="5"/><g class="fx pop" style="animation-delay:0.80s"><text class="fx sorot" style="animation-delay:1.40s" x="184" y="386" text-anchor="middle" font-size="32" font-weight="700" fill="#1E88E5">30/100 = 30%</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="60" y="468" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="497" r="18" fill="#E53935"/><path d="M85 490 L99 504 M99 490 L85 504" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="507" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">B salah: 0,3 = 30%, bukan 3%</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="315" y="9" width="257" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M443 94 V112 H885 V400 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="443" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="400" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M73 238 V226 H599 V238" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:0.80s"><text class="fx sorot" style="animation-delay:1.40s" x="336" y="212" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">30% + 40% = 70%</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="60" y="528" width="780" height="54" rx="27" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="89" cy="555" r="16.2" fill="#2E7D32"/><path d="M82 555 L87 561 L97 549" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="122" y="565" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">C benar: dua hari pertama = 70%</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="574" y="9" width="262" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M705 94 V112 H885 V290 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="705" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="290" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-