<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Tidak ada petunjuk? Uji ganti</text><rect x="30" y="58" width="540" height="46" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2" /><text x="300.0" y="87.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >"Kayu jembatan itu sudah lapuk sehingga mudah patah."</text><rect x="30" y="124" width="540" height="50" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" /><line x1="46.0" y1="137.0" x2="70.0" y2="161.0" stroke="#EF4444" stroke-width="4" stroke-linecap="round" /><line x1="70.0" y1="137.0" x2="46.0" y2="161.0" stroke="#EF4444" stroke-width="4" stroke-linecap="round" /><text x="84.0" y="155.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start" >"Kayu jembatan itu sudah baru sehingga mudah patah."</text><rect x="30" y="186" width="540" height="50" rx="12" fill="#D1FAE5" stroke="#10B981" stroke-width="2" /><path d="M48 211 l7 8 l14 -16" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round"/><text x="84.0" y="217.0" font-size="13" font-weight="700" fill="#047857" text-anchor="start" >"Kayu jembatan itu sudah rapuh sehingga mudah patah."</text><text x="300.0" y="266.0" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle" >Kalimat tetap masuk akal? Tebakanmu benar</text>
