885 V400 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="613" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="400" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.60s"><rect x="40" y="440" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="469" r="18" fill="#E53935"/><path d="M65 462 L79 476 M79 462 L65 476" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="479" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Ayah hanya menyebut doa</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="431" y="9" width="365" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M613 94 V112 H885 V372 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="613" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="372" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.20s" d="M740 173 H790 V372 H820" fill="none" stroke="#90A4AE" stroke-width="4"/><path class="garis" style="animation-delay:0.20s" d="M740 257 H790 V372 H820" fill="none" stroke="#90A4AE" stroke-width="4"/><g class="fx pop" style="animation-delay:1.00s"><rect x="40" y="338" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="430" y="384" text-anchor="middle" font-size="32" font-weight="700" fill="#1B5E20">C: Angku, kakek Dimas</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="150" y="520" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D3