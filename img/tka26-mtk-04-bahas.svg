<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<rect width="900" height="700" fill="#FFFFFF"/>
<g id="tahap0">
  <g class="fx pop" style="animation-delay:0s"><rect x="20" y="16" width="250" height="70" rx="35" fill="#1E88E5"/><text x="145" y="60" text-anchor="middle" font-size="24" font-weight="600" fill="#fff">Kaki meja miring</text></g>
  <g class="fx pop" style="animation-delay:0.15s"><rect x="290" y="16" width="300" height="70" rx="35" fill="#EF6C00"/><text x="440" y="60" text-anchor="middle" font-size="24" font-weight="600" fill="#fff">Sudut A: kaki–papan</text></g>
  <g class="fx pop" style="animation-delay:0.3s"><rect x="610" y="16" width="270" height="70" rx="35" fill="#8D6E63"/><text x="745" y="60" text-anchor="middle" font-size="24" font-weight="600" fill="#fff">5 pilihan sudut</text></g>
</g>
<g id="tahap1">
<g class="penunjuk">
  <rect class="fx cincin" x="283" y="9" width="314" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 440 94 V160 H885 V285 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="440" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="285" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
  <line class="muncul" style="animation-delay:0.2s" x1="110" y1="215" x2="110" y2="350" stroke="#90A4AE" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <path class="muncul" style="animation-delay:0.2s" d="M132 215 V237 H110" fill="none" stroke="#90A4AE" stroke-width="4"/>
  <text class="muncul" style="animation-delay:0.2s" x="98" y="300" text-anchor="end" font-size="24" font-weight="600" fill="#78909C">90°</text>
  <rect class="fx tumbuh kiri" x="110" y="210" width="220" height="10" rx="5" fill="#8D6E63"/>
  <line class="garis" style="animation-delay:0.5s" x1="110" y1="215" x2="223" y2="350" stroke="#5D4037" stroke-width="10" stroke-linecap="round"/>
  <path class="garis" style="animation-delay:1.1s" d="M170 215 A60 60 0 0 1 148.6 261" fill="none" stroke="#EF6C00" stroke-width="6" stroke-linecap="round"/>
  <text class="fx pop" style="animation-delay:1.5s" x="190" y="266" text-anchor="middle" font-size="36" font-weight="700" fill="#EF6C00">A</text>
  <text class="muncul" style="animation-delay:0.6s" x="290" y="256" text-anchor="middle" font-size="24" fill="#5D4037">papan</text>
  <text class="muncul" style="animation-delay:0.8s" x="245" y="346" font-size="24" fill="#5D4037">kaki</text>
  <text class="muncul" style="animation-delay:1.8s" x="350" y="300" font-size="26" fill="#37474F">A lebih sempit</text>
  <text class="muncul" style="animation-delay:1.8s" x="350" y="332" font-size="26" fill="#37474F">dari siku-siku</text>
  <g class="fx pop" style="animation-delay:2.3s"><rect x="590" y="232" width="250" height="106" rx="24" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/><text x="715" y="283" text-anchor="middle" font-size="44" font-weight="700" fill="#EF6C00">Lancip</text><text x="715" y="319" text-anchor="middle" font-size="24" fill="#37474F">kurang dari 90°</text></g>
</g>
<g id="tahap2">
<g class="penunjuk">
  <rect class="fx cincin" x="603" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 745 94 V160 H885 V455 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="745" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="455" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
  <text class="muncul" x="40" y="466" font-size="28" font-weight="600" fill="#37474F">Pilih yang kurang dari 90°</text>
  <g class="fx pop" style="animation-delay:0.5s"><rect x="520" y="415" width="150" height="80" rx="40" fill="#2E7D32"/><text x="595" y="470" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">89°</text></g>
  <g class="fx pop" style="animation-delay:1.0s"><rect x="690" y="415" width="150" height="80" rx="40" fill="#2E7D32"/><text x="765" y="470" text-anchor="middle" font-size="44" font-weight="700" fill="#fff">75°</text></g>
</g>
<g id="tahap3">
<g class="penunjuk">
  <rect class="fx cincin" x="603" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 745 94 V160 H885 V600 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="745" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="600" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
  <text class="muncul" x="40" y="612" font-size="28" font-weight="600" fill="#37474F">Bukan lancip:</text>
  <g class="fx drop"><rect x="360" y="565" width="150" height="70" rx="35" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3"/><text x="435" y="614" text-anchor="middle" font-size="40" font-weight="700" fill="#546E7A">90°</text></g>
  <g class="fx drop" style="animation-delay:0.2s"><rect x="525" y="565" width="150" height="70" rx="35" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3"/><text x="600" y="614" text-anchor="middle" font-size="40" font-weight="700" fill="#546E7A">100°</text></g>
  <g class="fx drop" style="animation-delay:0.4s"><rect x="690" y="565" width="150" height="70" rx="35" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3"/><text x="765" y="614" text-anchor="middle" font-size="40" font-weight="700" fill="#546E7A">180°</text></g>
  <line class="garis" style="animation-delay:1.0s" x1="385" y1="600" x2="485" y2="600" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <line class="garis" style="animation-delay:1.3s" x1="550" y1="600" x2="650" y2="600" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <line class="garis" style="animation-delay:1.6s" x1="715" y1="600" x2="815" y2="600" stroke="#E53935" stroke-width="7" stroke-linecap="round"/>
  <text class="muncul" style="animation-delay:1.8s" x="435" y="672" text-anchor="middle" font-size="24" font-weight="600" fill="#C62828">siku-siku</text>
  <text class="muncul" style="animation-delay:2.0s" x="600" y="672" text-anchor="middle" font-size="24" font-weight="600" fill="#C62828">tumpul</text>
  <text class="muncul" style="animation-delay:2.2s" x="765" y="672" text-anchor="middle" font-size="24" font-weight="600" fill="#C62828">lurus</text>
</g>
</svg>
