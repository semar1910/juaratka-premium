<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Kata kunci bisa berganti kata</text><rect x="40" y="62" width="520" height="50" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="300.0" y="93.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >Soal: "Kendaraan apa yang dipakai Pak Budi?"</text><rect x="40" y="140" width="520" height="50" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="2" /><text x="300.0" y="171.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >Teks: "Pak Budi berangkat naik sepeda motor."</text><rect x="117.41999999999999" y="210" width="105.16000000000001" height="28" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="170.0" y="229.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" >kendaraan</text><text x="300.0" y="232.0" font-size="22" font-weight="700" fill="#6B7280" text-anchor="middle" >≈</text><rect x="363.56" y="210" width="132.88" height="28" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" /><text x="430.0" y="229.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >sepeda motor</text><text x="300.0" y="272.0" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle" >Cari kata yang sejenis, bukan hanya yang sama persis</text>
