="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="664" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="100" y="630" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="664" r="20.4" fill="#2E7D32"/><path d="M127 664 L134 672 L146 657" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="676" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">C: angkot, lalu jalan kaki</text></g></g></svg>