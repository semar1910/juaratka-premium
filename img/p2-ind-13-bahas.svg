 d="M264 210 L280 226 M280 210 L264 226" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="fx pop" style="animation-delay:1.30s"><rect x="50" y="410" width="800" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="82" cy="439" r="18" fill="#E53935"/><path d="M75 432 L89 446 M89 432 L75 446" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="110" y="449" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">A: menunggu bengkel buka</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="302" y="9" width="268" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M436 94 V112 H450 V196" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="436" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="196" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.20s" d="M296 285 L313 285" stroke="#607D8B" stroke-width="6" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:0.90s"><path d="M324 285 L308 293 L308 277 Z" fill="#607D8B"/></g><g class="fx pop" style="animation-delay:0.60s"><rect x="330" y="200" width="240" height="170" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><rect x="416" y="242" width="68" height="45" rx="9" fill="#43A047"/><rect x="423" y="249" width="20" height="16" rx="3" fill="#E8F5E9"/><rect x="450" y="249" width="25" height="16" rx="3" fill="#E8F5E9"/><circle cx="432" cy="290" r="8" fill="#263238"/><circle cx="468" cy="290" r="8" fill="#263238"/><text x="450" y="344" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">naik angkot</text></g><path class="garis" style="animation-delay:1.20s" d="M576 285 L593 285" stroke="#607D8B" stroke-wi