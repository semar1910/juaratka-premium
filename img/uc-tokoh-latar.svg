<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Tokoh dan latar</text><rect x="30" y="62" width="250" height="136" rx="12" fill="#D1FAE5" stroke="#047857" stroke-width="2" /><text x="155.0" y="90.0" font-size="16" font-weight="700" fill="#047857" text-anchor="middle" >Tokoh</text><text x="155.0" y="116.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >siapa yang berperan</text><text x="155.0" y="138.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >tokoh utama = yang</text><text x="155.0" y="160.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >mengalami masalah utama</text><rect x="320" y="62" width="250" height="136" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="445.0" y="90.0" font-size="16" font-weight="700" fill="#2563EB" text-anchor="middle" >Latar</text><text x="445.0" y="116.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >tempat: di sekolah</text><text x="445.0" y="138.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >waktu: pagi hari</text><text x="445.0" y="160.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >suasana: sepi, ramai, tegang</text><rect x="80" y="214" width="440" height="36" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" /><text x="300.0" y="238.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle" >Latar bukan hanya tempat: waktu dan suasana juga latar</text>
