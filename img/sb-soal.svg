<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Baca soal: cari kata kuncinya</text><rect x="40" y="70" width="520" height="100" rx="14" fill="#fff" stroke="#2563EB" stroke-width="2.5" /><text x="64.0" y="104.0" font-size="15" font-weight="700" fill="#2563EB" text-anchor="start" >Soal:</text><text x="300.0" y="146.0" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" ></text><text x="300" y="146" font-size="16" text-anchor="middle" fill="#111827"><tspan font-weight="700" fill="#B45309" text-decoration="underline">Berapa</tspan> kilogram <tspan font-weight="700" fill="#047857" text-decoration="underline">sampah</tspan> yang terkumpul <tspan font-weight="700" fill="#2563EB" text-decoration="underline">setiap minggu</tspan>?</text><rect x="64.32" y="204" width="151.36" height="28" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="2" /><text x="140.0" y="223.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >Berapa → angka</text><rect x="261.28" y="204" width="77.44" height="28" rx="14" fill="#D1FAE5" stroke="#047857" stroke-width="2" /><text x="300.0" y="223.0" font-size="14" font-weight="700" fill="#047857" text-anchor="middle" >sampah</text><rect x="378.94" y="204" width="142.12" height="28" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="450.0" y="223.0" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle" >setiap minggu</text><text x="300.0" y="280.0" font-size="15" font-weight="600" fill="#6B7280" text-anchor="middle" >Kata tanya: siapa, kapan, berapa, mengapa?</text>
</svg>
