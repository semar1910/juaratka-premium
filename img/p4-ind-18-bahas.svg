ill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="344" width="820" height="86" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="68" y="382" text-anchor="start" font-size="30" font-weight="700" fill="#263238">C. Tempat sampah bertutup</text><text x="68" y="416" text-anchor="start" font-size="28" font-weight="600" fill="#455A64">teks ada, gambar ada</text><circle cx="816" cy="387" r="24" fill="#2E7D32"/><path d="M805 387 L814 396 L828 379" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fx pop" style="animation-delay:1.00s"><rect x="150" y="530" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="564" r="20.4" fill="#2E7D32"/><path d="M177 564 L184 572 L196 557" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="576" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">jawaban: A dan C</text></g></g></svg>