<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="118" y="16" width="255" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="146" cy="54" r="10" fill="#1E88E5"/><text x="162" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">lampu nyala</text><rect x="389" y="16" width="132" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="417" cy="54" r="10" fill="#EF6C00"/><text x="433" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">rugi</text><rect x="537" y="16" width="245" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="565" cy="54" r="10" fill="#8D6E63"/><text x="581" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">garam laut</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="111" y="9" width="269" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M245 94 V112 H872 V168" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="245" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="168" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="140" width="820" height="56" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><rect x="40" y="140" width="12" height="56" rx="6" fill="#1E88E5"/><text x="68" y="178" text-anchor="start" font-size="28" font-weight="600" fill="#0D47A1">“lampu menyala terus tanpa ada orang”</text></g><g class="fx pop" style="animation-delay:0.20s"><rect x="160" y="220" width="580" height="70" rx="16" fill="#F3E5F5" stroke="#8E24AA" stroke-width="3"/><text x="450" y="267" text-anchor="middle" font-size="32" font-weight="700" fill="#4A148C">“membuang garam ke laut”</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="530" y="9" width="259" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M660 94 V112 H885 V385 H430" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="660" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="430" cy="385" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="330" width="395" height="110" rx="16" fill="#FFEBEE" stroke="#E53935" stroke-width="3" stroke-dasharray="9 6"/><circle cx="72" cy="385" r="20" fill="#E53935"/><path d="M64 377 L80 393 M80 377 L64 393" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="254" y="372" text-anchor="middle" font-size="28" font-weight="600" fill="#B71C1C">arti kata per kata</text><text x="254" y="416" text-anchor="middle" font-size="28" font-weight="700" fill="#B71C1C">laut jadi asin</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="40" y="456" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="485" r="18" fill="#E53935"/><path d="M65 478 L79 492 M79 478 L65 492" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="495" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Pilihan B: laut menjadi asin</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="382" y="9" width="146" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M455 94 V112 H885 V385 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="455" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="385" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="465" y="330" width="395" height="110" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><circle cx="497" cy="385" r="20" fill="#2E7D32"/><path d="M488 385 L495 393 L507 378" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="372" text-anchor="middle" font-size="28" font-weight="600" fill="#1B5E20">makna dalam cerita</text><text x="678" y="416" text-anchor="middle" font-size="28" font-weight="700" fill="#1B5E20">rugi, sia-sia</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="100" y="540" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="574" r="20.4" fill="#2E7D32"/><path d="M127 574 L134 582 L146 567" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="586" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">A: rugi, tidak berguna</text></g></g></svg>