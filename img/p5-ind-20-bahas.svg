<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 532" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="99" y="16" width="245" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="127" cy="54" r="10" fill="#1E88E5"/><text x="143" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">bakul jamu</text><rect x="360" y="16" width="181" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="388" cy="54" r="10" fill="#EF6C00"/><text x="404" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">keliling</text><rect x="556" y="16" width="245" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="584" cy="54" r="10" fill="#8D6E63"/><text x="600" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">setiap pagi</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="92" y="9" width="259" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M221 94 V112 H450 V146" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="221" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="146" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="150" width="770" height="66" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><rect x="40" y="150" width="12" height="66" rx="6" fill="#1E88E5"/><text x="68" y="193" text-anchor="start" font-size="28" font-weight="600" fill="#0D47A1">“menggendong bakul berisi botol jamu”</text></g><g class="fx pop" style="animation-delay:0.90s"><circle cx="840" cy="183" r="22" fill="#2E7D32"/><path d="M830 183 L838 191 L851 175" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="353" y="9" width="195" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M450 94 V112 H885 V267 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="267" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.50s"><rect x="40" y="238" width="770" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="267" r="18" fill="#E53935"/><path d="M65 260 L79 274 M79 260 L65 274" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="277" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">warung dekat pasar tidak ada di cerita</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="549" y="9" width="259" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M679 94 V112 H885 V380 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="679" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="380" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="322" width="770" height="66" rx="14" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/><rect x="40" y="322" width="12" height="66" rx="6" fill="#8D6E63"/><text x="68" y="365" text-anchor="start" font-size="28" font-weight="600" fill="#4E342E">“menjual jamu gendong keliling kampung”</text></g><g class="fx pop" style="animation-delay:0.90s"><circle cx="840" cy="355" r="22" fill="#2E7D32"/><path d="M830 355 L838 363 L851 347" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fx pop" style="animation-delay:1.40s"><rect x="40" y="440" width="770" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="76" cy="474" r="20.4" fill="#2E7D32"/><path d="M67 474 L74 482 L86 467" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="486" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">A dan C menunjukkan cirinya</text></g></g></svg>