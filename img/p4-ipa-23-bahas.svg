e" font-size="28" font-weight="600" fill="#263238">menyala</text></g><g class="fx pop" style="animation-delay:0.70s"><rect x="90" y="256" width="720" height="58" fill="#fff" stroke="#00897B" stroke-width="1.5"/><text x="300" y="295" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Penghapus karet</text><text x="660" y="295" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">padam</text></g><g class="fx pop" style="animation-delay:0.95s"><rect x="90" y="314" width="720" height="58" fill="#E0F2F1" stroke="#00897B" stroke-width="1.5"/><text x="300" y="353" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Klip kertas</text><text x="660" y="353" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">menyala</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="90" y="372" width="720" height="58" fill="#fff" stroke="#00897B" stroke-width="1.5"/><text x="300" y="411" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">Sendok plastik</text><text x="660" y="411" text-anchor="middle" font-size="28" font-weight="600" fill="#263238">padam</text></g><g class="fx kedut" style="animation-delay:1.40s"><rect x="93" y="201" width="714" height="52" rx="10" fill="none" stroke="#2E7D32" stroke-width="6"/></g><g class="fx kedut" style="animation-delay:1.70s"><rect x="93" y="317" width="714" height="52" rx="10" fill="none" stroke="#2E7D32" stroke-width="6"/></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="516" y="9" width="361" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M696 94 V112 H885 V480 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="696" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="480" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="90" y="446" width="720" height="52" rx="16" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/><text x="450" y="482" text-anchor="middle" font-size="28" font-weight="700" fill="#1B5E20">sambung = penghantar</text></g><g class="fx pop" style="animation-delay:0.90s"><rect x="90" y="506" width="720" height="52" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="450" y="542" text-anchor="middle" font-size="28" font-weight="700" fill="#0D47A1">bungkus = bukan penghantar</text></g><g class="fx pop" style="animation-delay:1.50s"><rect x="90" y="566" width="720" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="122" cy="595" r="18" fill="#E53935"/><path d="M115 588 L129 602 M129 588 L115 602" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="150" y="605" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">bukan penghantar untuk menyambung</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="23" y="9" width="309" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M177 94 V112 H885 V700 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="177" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="700" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="90" y="642" width="720" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="122" cy="671" r="18" fill="#E53935"/><path d="M115 664 L129 678 M129 664 L115 678" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="150" y="681" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">D: penyambung kare