<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 315" width="600" height="315" font-family="Poppins, Inter, Arial, sans-serif">
<rect width="600" height="315" fill="#fff"/>
<text x="300.0" y="30.0" font-size="18" font-weight="700" fill="#111827" text-anchor="middle" >"Ia memang kepala batu."</text><rect x="30" y="50" width="540" height="34" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2" /><text x="42.0" y="72.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" >Ibu sudah berkali-kali mengingatkan Dodi agar memakai helm.</text><rect x="30" y="92" width="540" height="34" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2" /><text x="42.0" y="114.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" >Teman-temannya juga menasihatinya.</text><rect x="30" y="134" width="540" height="34" rx="9" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2" /><text x="42.0" y="156.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" >Namun, Dodi tetap tidak mau mendengar.</text><rect x="30" y="176" width="540" height="34" rx="9" fill="#FFFBEB" stroke="#B45309" stroke-width="2" /><text x="42.0" y="198.0" font-size="13" font-weight="600" fill="#111827" text-anchor="start" >Ia memang kepala batu.</text><g id="tahap1" opacity="0"><rect x="43.2" y="222" width="193.6" height="28" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2" /><text x="140.0" y="241.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle" >kepalanya dari batu?</text><line x1="240.0" y1="228.0" x2="260.0" y2="248.0" stroke="#EF4444" stroke-width="4" stroke-linecap="round" /><line x1="260.0" y1="228.0" x2="240.0" y2="248.0" stroke="#EF4444" stroke-width="4" stroke-linecap="round" /></g><g id="tahap2" opacity="0"><rect x="30" y="50" width="540" height="118" rx="9" fill="none" stroke="#2563EB" stroke-width="3" /><rect x="347.49" y="222" width="185.02" height="28" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" /><text x="440.0" y="241.0" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle" >tidak mau mendengar</text></g><g id="tahap3" opacity="0"><rect x="90" y="268" width="420" height="36" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2" /><text x="300.0" y="292.0" font-size="14" font-weight="700" fill="#B45309" text-anchor="middle" >Uji: "Ia memang ... ." Kata apa yang cocok?</text></g>
</svg>
