<script><![CDATA[
(function(){var r=document.documentElement,n=1;
if(!r.hasAttribute('data-auto')&&!window.__studio){
setInterval(function(){
var g=document.getElementById('tahap'+n);if(g)g.classList.remove('kini');
n=n%3+1;r.setAttribute('data-tahap',n);
var h=document.getElementById('tahap'+n);if(h)h.classList.add('kini');},6000);}})();
]]></script>
