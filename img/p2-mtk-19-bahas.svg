><path class="garis" style="animation-delay:1.00s" d="M110 332 Q450 240 790 332" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:1.70s"><text x="450" y="256" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">total 40 menit</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="250" y="140" width="400" height="56" rx="16" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/><text x="450" y="179" text-anchor="middle" font-size="30" font-weight="700" fill="#4E342E">berhenti 10 menit</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="130" y="410" width="640" height="64" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="450" y="454" text-anchor="middle" font-size="32" font-weight="700" fill="#BF360C">bersepeda: 40 − 10 = 30 menit</text></g><g class="fx pop" style="animation-delay:2.80s"><rect x="100" y="490" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="519" r="18" fill="#E53935"/><path d="M125 512 L139 526 M139 512 L125 526" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="529" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">pakai 40 menit saja</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="22" y="9" width="258" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M151 94 V112 H885 V600 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="151" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="600" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="130" y="568" width="640" height="64" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="450" y="612" text-anchor="middle" font-size="32" font-weight="700" fill="#BF360C">30 menit = 30/60 = 1/2 jam</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="100" y="642" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="671" r="18" fill="#E53935"/><path d="M125 664 L139 678 M139 664 L125 678" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="681" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">30 menit = 0,3 jam</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="22" y="9" width="258" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M151 94 V112 H885 V752 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="151" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="752" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="120" y="718" width="660" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="156" cy="752" r="20.4" fill="#2E7D32"/><path d="M147 752 L154 760 L166 745" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="764" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">jarak = 12 × 1/2 = 6 km</text></g></g></svg>