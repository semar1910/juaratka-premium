<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 784" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="236" y="16" width="210" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="264" cy="54" r="10" fill="#1E88E5"/><text x="280" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">Jan–Mar</text><rect x="462" y="16" width="202" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="490" cy="54" r="10" fill="#EF6C00"/><text x="506" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">Apr–Jun</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="229" y="9" width="224" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M341 94 V112 H885 V300 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="341" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="300" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.10s"><path d="M120 190 V400 H820" stroke="#546E7A" stroke-width="4" fill="none"/><text x="178" y="436" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">Jan</text><text x="295" y="436" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">Feb</text><text x="412" y="436" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">Mar</text><text x="528" y="436" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">Apr</text><text x="645" y="436" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">Mei</text><text x="762" y="436" text-anchor="middle" font-size="28" font-weight="600" fill="#37474F">Jun</text></g><g class="drop" style="animation-delay:0.30s"><rect x="141" y="250" width="75" height="150" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="178" y="240" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">18</text></g><g class="drop" style="animation-delay:0.40s"><rect x="258" y="267" width="75" height="133" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="295" y="257" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">16</text></g><g class="drop" style="animation-delay:0.50s"><rect x="374" y="233" width="75" height="167" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="412" y="223" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">20</text></g><g class="drop" style="animation-delay:0.60s"><rect x="491" y="283" width="75" height="117" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="528" y="273" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">14</text></g><g class="drop" style="animation-delay:0.70s"><rect x="608" y="300" width="75" height="100" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="645" y="290" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">12</text></g><g class="drop" style="animation-delay:0.80s"><rect x="724" y="317" width="75" height="83" rx="6" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="762" y="307" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">10</text></g><g class="fx kedut" style="animation-delay:1.60s"><rect x="258" y="267" width="75" height="133" rx="6" fill="#E53935" fill-opacity=".55" stroke="#E53935" stroke-width="5"/></g><g class="fx kedut" style="animation-delay:1.80s"><rect x="374" y="233" width="75" height="167" rx="6" fill="#E53935" fill-opacity=".55" stroke="#E53935" stroke-width="5"/></g><g class="fx pop" style="animation-delay:2.20s"><rect x="100" y="560" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="589" r="18" fill="#E53935"/><path d="M125 582 L139 596 M139 582 L125 596" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="599" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">A salah: Feb 16 → Mar 20, naik</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="229" y="9" width="224" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M341 94 V112 H885 V300 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="341" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="300" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx kedut" style="animation-delay:0.30s"><rect x="374" y="233" width="75" height="167" rx="6" fill="#2E7D32" fill-opacity=".55" stroke="#2E7D32" stroke-width="5"/></g><g class="fx kedut" style="animation-delay:0.60s"><rect x="724" y="317" width="75" height="83" rx="6" fill="#2E7D32" fill-opacity=".55" stroke="#2E7D32" stroke-width="5"/></g><g class="fx pop" style="animation-delay:1.20s"><rect x="100" y="630" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="659" r="18" fill="#E53935"/><path d="M125 652 L139 666 M139 652 L125 666" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="669" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">B, D salah: tertinggi Mar, terendah Jun</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="455" y="9" width="216" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M563 94 V112 H885 V360 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="563" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="360" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M130 452 V466 H460 V452" fill="none" stroke="#1E88E5" stroke-width="5"/><g class="fx pop" style="animation-delay:0.70s"><text class="fx sorot" style="animation-delay:1.30s" x="295" y="516" text-anchor="middle" font-size="28" font-weight="700" fill="#1E88E5">18 + 16 + 20 = 54</text></g><path class="garis" style="animation-delay:1.20s" d="M480 452 V466 H810 V452" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:1.60s"><text class="fx sorot" style="animation-delay:2.20s" x="645" y="516" text-anchor="middle" font-size="28" font-weight="700" fill="#EF6C00">14 + 12 + 10 = 36</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="100" y="700" width="700" height="60" rx="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="132" cy="730" r="18.0" fill="#2E7D32"/><path d="M124 730 L130 737 L141 724" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="741" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">C benar: 36 lebih sedikit dari 54</text></g></g></svg>