" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="384" y="197" text-anchor="middle" font-size="34" font-weight="700" fill="#0D47A1">3/4</text></g><g class="fx pop" style="animation-delay:0.45s"><rect x="456" y="150" width="120" height="70" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="516" y="197" text-anchor="middle" font-size="34" font-weight="700" fill="#0D47A1">3/4</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="588" y="150" width="120" height="70" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="648" y="197" text-anchor="middle" font-size="34" font-weight="700" fill="#0D47A1">3/4</text></g><g class="fx pop" style="animation-delay:0.75s"><rect x="720" y="150" width="120" height="70" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="780" y="197" text-anchor="middle" font-size="34" font-weight="700" fill="#0D47A1">3/4</text></g><g class="fx pop" style="animation-delay:1.00s"><text class="fx sorot" style="animation-delay:1.60s" x="450" y="262" text-anchor="middle" font-size="34" font-weight="700" fill="#2E7D32">6 loyang × 3/4 = 4 1/2 kg</text></g><g class="fx pop" style="animation-delay:2.00s"><rect x="150" y="290" width="600" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="182" cy="319" r="18" fill="#E53935"/><path d="M175 312 L189 326 M189 312 L175 326" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="210" y="329" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">6 : 3/4 = 8 → salah operasi</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="564" y="9" width="321" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M725 94 V112 H885 V478 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="725" cy="94" r="9" fill="#E53935"/><g class="fx pop" style=