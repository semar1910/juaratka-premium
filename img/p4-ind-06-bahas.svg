<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 782" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="157" y="16" width="333" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="185" cy="54" r="10" fill="#1E88E5"/><text x="201" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">pesan Pak Hasan</text><rect x="506" y="16" width="238" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="534" cy="54" r="10" fill="#EF6C00"/><text x="550" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">sikap Tono</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="150" y="9" width="347" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M323 94 V112 H450 V146" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="323" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="146" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="150" width="820" height="66" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><rect x="40" y="150" width="12" height="66" rx="6" fill="#1E88E5"/><text x="68" y="193" text-anchor="start" font-size="28" font-weight="600" fill="#0D47A1">“Hujan atau kemarau, air tetap dihemat”</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="40" y="250" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="279" r="18" fill="#E53935"/><path d="M65 272 L79 286 M79 272 L65 286" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="289" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">A: hemat air hanya saat kemarau</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="150" y="9" width="347" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M323 94 V112 H885 V330 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="323" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="330" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="340" width="820" height="66" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><rect x="40" y="340" width="12" height="66" rx="6" fill="#1E88E5"/><text x="68" y="383" text-anchor="start" font-size="28" font-weight="600" fill="#0D47A1">“Tetes demi tetes, berember-ember”</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="40" y="430" width="820" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="76" cy="464" r="20.4" fill="#2E7D32"/><path d="M67 464 L74 472 L86 457" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="476" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">B: air harus dihemat</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="150" y="9" width="347" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M323 94 V112 H885 V520 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="323" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="520" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="520" width="820" height="66" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><rect x="40" y="520" width="12" height="66" rx="6" fill="#1E88E5"/><text x="68" y="563" text-anchor="start" font-size="28" font-weight="600" fill="#0D47A1">“Kerusakan kecil jangan dibiarkan”</text></g><g class="fx pop" style="animation-delay:0.80s"><rect x="40" y="604" width="820" height="66" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><rect x="40" y="604" width="12" height="66" rx="6" fill="#EF6C00"/><text x="68" y="647" text-anchor="start" font-size="28" font-weight="600" fill="#BF360C">“Maaf, tadi aku tidak peduli”</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="40" y="690" width="820" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="76" cy="724" r="20.4" fill="#2E7D32"/><path d="M67 724 L74 732 L86 717" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="736" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">C: peduli kerusakan kecil</text></g></g></svg>