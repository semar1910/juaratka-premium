array="10 8" stroke-linecap="round"/><circle class="fx pop" cx="403" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="300" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect x="40" y="250" width="380" height="100" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="230" y="311" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">Sore: Kak Rendi</text><path class="garis" style="animation-delay:0.40s" d="M430 300 L459 300" stroke="#607D8B" stroke-width="6" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:1.10s"><path d="M470 300 L454 308 L454 292 Z" fill="#607D8B"/></g><rect x="480" y="250" width="380" height="100" rx="16" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/><text x="670" y="311" text-anchor="middle" font-size="30" font-weight="700" fill="#4E342E">Pentas: Raka</text><g class="fx pop" style="animation-delay:1.00s"><rect x="40" y="380" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="409" r="18" fill="#E53935"/><path d="M65 402 L79 416 M79 402 L65 416" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="419" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Raka memuji, tetapi sesudah pentas</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="572" y="9" width="298" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M721 94 V112 H885 V504 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="721" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="504" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="80" y="470" width="740" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="116" cy="504" r="20.4" fill="#2E7D32"/><path d="M107 504 L114 512 L126 497" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="156" y="516" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">C: Kak Rendi lebih dulu</text></g></g></svg>