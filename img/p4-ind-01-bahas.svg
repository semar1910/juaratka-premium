 Jawa Timur</text><circle cx="816" cy="387" r="24" fill="#2E7D32"/><path d="M805 387 L814 396 L828 379" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fx pop" style="animation-delay:0.80s"><rect x="150" y="470" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="504" r="20.4" fill="#2E7D32"/><path d="M177 504 L184 512 L196 497" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="516" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">jawaban: B dan C</text></g></g></svg>