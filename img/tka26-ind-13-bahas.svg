<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
  <rect x="12" y="16" width="280" height="70" rx="35" fill="#1E88E5"/>
  <text x="152" y="64" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Kedua kalinya</text>
  <rect x="308" y="16" width="280" height="70" rx="35" fill="#EF6C00"/>
  <text x="448" y="64" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Waktu itu</text>
  <rect x="604" y="16" width="280" height="70" rx="35" fill="#8D6E63"/>
  <text x="744" y="64" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Kali ini</text>
</g>
<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="5" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 152 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="152" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect x="38" y="190" width="824" height="430" rx="28" fill="#F4F6FA" stroke="#CFD8DC" stroke-width="3"/>
  <text class="muncul" x="450" y="236" font-size="28" fill="#546E7A" text-anchor="middle">Langkah 1 · Cari perjalanan pertama</text>
  <text class="fx pop" style="animation-delay:0.3s" x="450" y="312" font-size="42" font-weight="700" fill="#1E88E5" text-anchor="middle">kedua kalinya</text>
  <path class="garis" style="animation-delay:0.8s" d="M450 334 V364 M435 350 L450 366 L465 350" fill="none" stroke="#546E7A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="fx pop" style="animation-delay:1.1s" x="450" y="414" font-size="44" font-weight="700" fill="#2E7D32" text-anchor="middle">Perjalanan sebelumnya</text>
  <text class="muncul" style="animation-delay:1.6s" x="450" y="462" font-size="28" font-style="italic" fill="#455A64" text-anchor="middle">“Ini adalah kedua kalinya Adit dan Danu”</text>
  <line class="muncul" style="animation-delay:2.0s" x1="250" y1="540" x2="650" y2="540" stroke="#B0BEC5" stroke-width="6" stroke-linecap="round"/>
  <g class="fx pop" style="animation-delay:2.2s"><circle class="fx kedut" style="animation-delay:2.8s" cx="250" cy="540" r="36" fill="#fff" stroke="#1E88E5" stroke-width="5"/><text x="250" y="552" font-size="36" font-weight="700" fill="#1E88E5" text-anchor="middle">1</text></g>
  <g class="fx pop" style="animation-delay:2.5s"><circle cx="650" cy="540" r="36" fill="#1E88E5"/><text x="650" y="552" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">2</text></g>
  <text class="muncul" style="animation-delay:2.7s" x="250" y="608" font-size="28" fill="#37474F" text-anchor="middle">Dulu (ditanya)</text>
  <text class="muncul" style="animation-delay:2.9s" x="650" y="608" font-size="28" fill="#37474F" text-anchor="middle">Kali ini (kedua)</text>
</g>
<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="301" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 448 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="448" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect x="38" y="190" width="824" height="430" rx="28" fill="#F4F6FA" stroke="#CFD8DC" stroke-width="3"/>
  <text class="muncul" x="450" y="236" font-size="28" fill="#546E7A" text-anchor="middle">Langkah 2 · Bedakan dua waktu</text>
  <g class="muncul" style="animation-delay:0.2s">
    <rect x="58" y="262" width="380" height="340" rx="24" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
    <text x="248" y="306" font-size="36" font-weight="700" fill="#EF6C00" text-anchor="middle">Waktu itu</text>
    <text x="248" y="342" font-size="28" fill="#BF5B00" text-anchor="middle">(pertama)</text>
  </g>
  <g class="fx pop" style="animation-delay:0.6s">
    <path d="M188 404 H308 L290 438 H206 Z" fill="#1E88E5"/>
    <rect x="244" y="356" width="6" height="48" fill="#546E7A"/>
    <path d="M252 358 L294 400 H252 Z" fill="#fff" stroke="#546E7A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M170 452 q15 -12 30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#1E88E5" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="muncul" style="animation-delay:1.0s" x="248" y="504" font-size="40" font-weight="700" fill="#263238" text-anchor="middle">Naik kapal</text>
  <text class="muncul" style="animation-delay:1.2s" x="248" y="544" font-size="28" fill="#455A64" text-anchor="middle">dari bawah</text>
  <text class="muncul" style="animation-delay:1.2s" x="248" y="580" font-size="28" fill="#455A64" text-anchor="middle">jembatan Musi</text>
  <g class="muncul" style="animation-delay:1.8s">
    <rect x="462" y="262" width="380" height="340" rx="24" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/>
    <text x="652" y="306" font-size="36" font-weight="700" fill="#6D4C41" text-anchor="middle">Kali ini</text>
    <text x="652" y="342" font-size="28" fill="#6D4C41" text-anchor="middle">(kedua)</text>
  </g>
  <g class="fx pop" style="animation-delay:2.2s">
    <rect x="560" y="396" width="184" height="14" rx="5" fill="#8D6E63"/>
    <ellipse cx="590" cy="426" rx="24" ry="12" fill="#90A4AE"/>
    <ellipse cx="652" cy="426" rx="24" ry="12" fill="#90A4AE"/>
    <ellipse cx="714" cy="426" rx="24" ry="12" fill="#90A4AE"/>
    <path d="M550 452 q15 -12 30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#1E88E5" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text class="muncul" style="animation-delay:2.6s" x="652" y="504" font-size="40" font-weight="700" fill="#263238" text-anchor="middle">Jalan kaki</text>
  <text class="muncul" style="animation-delay:2.8s" x="652" y="544" font-size="28" fill="#455A64" text-anchor="middle">jembatan ponton</text>
  <text class="muncul" style="animation-delay:3.2s" x="652" y="580" font-size="28" fill="#C62828" text-anchor="middle">bukan yang pertama</text>
</g>
<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="301" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 448 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="448" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect x="38" y="190" width="824" height="430" rx="28" fill="#F4F6FA" stroke="#CFD8DC" stroke-width="3"/>
  <text class="muncul" x="450" y="236" font-size="28" fill="#546E7A" text-anchor="middle">Langkah 3 · Cocokkan pilihan</text>
  <g class="fx muncul" style="animation-delay:0.3s">
    <rect x="58" y="258" width="784" height="70" rx="20" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
    <circle cx="100" cy="293" r="26" fill="#90A4AE"/>
    <text x="100" y="304" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">A</text>
    <text x="148" y="303" font-size="28" fill="#607D8B">Mobil di jembatan ponton</text>
    <text x="815" y="303" font-size="28" font-weight="700" fill="#90A4AE" text-anchor="end">tak ada</text>
  </g>
  <g class="fx muncul" style="animation-delay:0.9s">
    <rect x="58" y="340" width="784" height="70" rx="20" fill="#FFF8E1" stroke="#FFB300" stroke-width="4"/>
    <circle cx="100" cy="375" r="26" fill="#FFB300"/>
    <text x="100" y="386" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">B</text>
    <text x="148" y="385" font-size="28" fill="#37474F">Jalan kaki, jembatan ponton</text>
    <text x="815" y="385" font-size="28" font-weight="700" fill="#EF6C00" text-anchor="end">kali ini</text>
  </g>
  <g class="fx pop" style="animation-delay:2.9s">
    <rect x="58" y="422" width="784" height="70" rx="20" fill="#E8F5E9" stroke="#43A047" stroke-width="5"/>
    <circle cx="100" cy="457" r="26" fill="#43A047"/>
    <text x="100" y="468" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <text x="148" y="467" font-size="28" font-weight="700" fill="#1B5E20">Kapal dari bawah jembatan Musi</text>
  </g>
  <g class="fx muncul" style="animation-delay:1.9s">
    <rect x="58" y="504" width="784" height="70" rx="20" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/>
    <circle cx="100" cy="539" r="26" fill="#90A4AE"/>
    <text x="100" y="550" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">D</text>
    <text x="148" y="549" font-size="28" fill="#607D8B">Jalan kaki di jembatan Musi</text>
    <text x="815" y="549" font-size="28" font-weight="700" fill="#90A4AE" text-anchor="end">tak ada</text>
  </g>
  <path class="garis" style="animation-delay:3.5s" d="M772 462 L790 480 L824 444" fill="none" stroke="#2E7D32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
