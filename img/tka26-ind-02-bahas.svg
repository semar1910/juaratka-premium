<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
<rect x="30" y="13" width="270" height="76" rx="38" fill="#1E88E5"/><text x="165" y="62" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">keindahan alam</text>
<rect x="320" y="13" width="250" height="76" rx="38" fill="#EF6C00"/><text x="445" y="62" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">spot menarik</text>
<rect x="590" y="13" width="250" height="76" rx="38" fill="#8D6E63"/><text x="715" y="62" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">tersembunyi</text>
</g>
<g id="tahap1"><g class="fx drop"><rect x="36" y="128" width="810" height="104" rx="22" fill="#FFFFFF" stroke="#8D6E63" stroke-width="5"/><circle class="fx kedut" style="animation-delay:0.7s" cx="88" cy="180" r="30" fill="#8D6E63"/><text x="88" y="192" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="140" y="174" font-size="34" font-weight="700" fill="#263238">Istilah: kalimat petunjuk</text><text x="140" y="216" font-size="28" fill="#455A64">“permata tersembunyi” di Kulon Progo</text></g><g class="penunjuk"><rect class="fx cincin" x="583" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 715 94 V108 H885 V180 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="715" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="180" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g></g>
<g id="tahap2"><polygon class="muncul" points="428,236 454,236 441,252" fill="#90A4AE"/><g class="fx drop"><rect x="36" y="256" width="810" height="104" rx="22" fill="#FFFFFF" stroke="#1E88E5" stroke-width="5"/><circle class="fx kedut" style="animation-delay:0.7s" cx="88" cy="308" r="30" fill="#1E88E5"/><text x="88" y="320" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="140" y="302" font-size="34" font-weight="700" fill="#263238">Konteks: indah, banyak spot</text><text x="140" y="344" font-size="28" fill="#455A64">keindahan alam; spot foto menarik</text></g><g class="penunjuk"><rect class="fx cincin" x="23" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><rect class="fx cincin" x="313" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 445 94 V108 H885 V308 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="445" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="308" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g></g>
<g id="tahap3"><polygon class="muncul" points="428,364 454,364 441,380" fill="#90A4AE"/><g class="fx drop"><rect x="36" y="384" width="810" height="104" rx="22" fill="#FFFFFF" stroke="#8D6E63" stroke-width="5"/><circle class="fx kedut" style="animation-delay:0.7s" cx="88" cy="436" r="30" fill="#8D6E63"/><text x="88" y="448" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="140" y="430" font-size="34" font-weight="700" fill="#263238">Tersembunyi: belum dikenal</text><text x="140" y="472" font-size="28" fill="#455A64">permata + tersembunyi</text></g><g class="penunjuk"><rect class="fx cincin" x="583" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 715 94 V108 H885 V436 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="715" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="436" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g></g>
<g id="tahap4"><polygon class="muncul" points="428,492 454,492 441,508" fill="#90A4AE"/><g class="fx drop"><rect x="36" y="512" width="810" height="104" rx="22" fill="#FFFFFF" stroke="#2E7D32" stroke-width="5"/><circle class="fx kedut" style="animation-delay:0.7s" cx="88" cy="564" r="30" fill="#2E7D32"/><text x="88" y="576" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="140" y="558" font-size="34" font-weight="700" fill="#263238">Cocokkan: B dan C benar</text><text x="140" y="600" font-size="28" fill="#455A64">A salah: ramai, bukan tersembunyi</text></g><g class="penunjuk"><rect class="fx cincin" x="23" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><rect class="fx cincin" x="313" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><rect class="fx cincin" x="583" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 445 94 V108 H885 V564 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="445" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="564" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g></g>
</svg>