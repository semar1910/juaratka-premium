<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<rect width="900" height="600" fill="#FFFFFF"/>
<g id="tahap0">
  <rect x="15" y="16" width="270" height="70" rx="35" fill="#1E88E5"/>
  <text x="150" y="62" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Hujan deras</text>
  <rect x="315" y="16" width="270" height="70" rx="35" fill="#EF6C00"/>
  <text x="450" y="62" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Setelah tiba</text>
  <rect x="615" y="16" width="270" height="70" rx="35" fill="#8D6E63"/>
  <text x="750" y="62" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Menikmati</text>
</g>
<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="8" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 150 94 V112 H885 V193 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="193" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="fx pop" style="animation-delay:0.20s" x="15" y="125" width="830" height="136" rx="24" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
  <text class="muncul" style="animation-delay:0.50s" x="430" y="163" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#1E88E5">Langkah 1 · Cari peristiwa</text>
  <text class="muncul" style="animation-delay:0.90s" x="430" y="211" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="44" font-weight="700" fill="#263238">Hujan = Acara batal</text>
  <text class="muncul" style="animation-delay:1.40s" x="430" y="246" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#455A64">“hujan deras turun”</text>
</g>
<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="308" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 450 94 V112 H885 V353 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="353" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="fx pop" style="animation-delay:0.20s" x="15" y="285" width="830" height="136" rx="24" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
  <text class="muncul" style="animation-delay:0.50s" x="430" y="323" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#EF6C00">Langkah 2 · Cek urutan waktu</text>
  <text class="muncul" style="animation-delay:0.90s" x="430" y="371" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="38" font-weight="700" fill="#263238">Hujan setelah tiba = B salah</text>
  <text class="muncul" style="animation-delay:1.40s" x="430" y="406" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#455A64">“ketika mereka tiba di Pulau Kemaro”</text>
</g>
<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="608" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 750 94 V112 H885 V513 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="750" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="513" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <rect class="fx pop" style="animation-delay:0.20s" x="15" y="445" width="830" height="136" rx="24" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/>
  <text class="muncul" style="animation-delay:0.50s" x="430" y="483" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#8D6E63">Langkah 3 · Cocokkan pilihan</text>
  <text class="muncul" style="animation-delay:0.90s" x="430" y="531" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="38" font-weight="700" fill="#263238">Berkeliling + makan = A, C benar</text>
  <text class="muncul" style="animation-delay:1.40s" x="430" y="566" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#455A64">“berkeliling pulau” · “mencoba makanan”</text>
</g>
</svg>