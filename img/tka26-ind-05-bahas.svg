 </g><rect x="40" y="200" width="820" height="425" rx="28" fill="#FFF8EC" stroke="#D7CCC8" stroke-width="3"/><text x="450" y="252" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#6D4C41">Langkah 3 · Cek isi daging</text><rect class="fx pop" style="animation-delay:0.1s" x="70" y="290" width="300" height="60" rx="30" fill="#1E88E5"/><text class="muncul" style="animation-delay:0.30000000000000004s" x="220" y="332" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Sebelum</text><rect x="530" y="290" width="300" height="60" rx="30" fill="#ECEFF1"/><text x="680" y="332" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#90A4AE">Sesudah</text><path d="M385 320 H505 M492 307 L507 320 L492 333" fill="none" stroke="#B0BEC5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="muncul" style="animation-delay:0.6s" x="450" y="425" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="38" font-weight="700" fill="#263238">daging dan tepung = Sebelum</text><text class="muncul" style="animation-delay:1.2s" x="450" y="520" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#5D4037">“Awalnya, dari daging dan tepung”</text><text class="muncul" style="animation-delay:1.7s" x="450" y="585" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#E53935">Pernyataan 2: Isi hanya daging.</text></g>
