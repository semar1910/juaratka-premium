<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0"><rect x="15" y="16" width="280" height="70" rx="35" fill="#1E88E5"/><text x="155" y="64" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Awalnya</text><rect x="310" y="16" width="280" height="70" rx="35" fill="#EF6C00"/><text x="450" y="64" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Kini</text><rect x="605" y="16" width="280" height="70" rx="35" fill="#8D6E63"/><text x="745" y="64" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Bisa juga</text></g>
<g id="tahap1"><g class="penunjuk">
  <rect class="fx cincin" x="8" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><rect class="fx cincin" x="303" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 155 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="155" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
 </g><rect x="40" y="200" width="820" height="425" rx="28" fill="#FFF8EC" stroke="#D7CCC8" stroke-width="3"/><text x="450" y="252" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#6D4C41">Langkah 1 · Cari penanda waktu</text><rect class="fx pop" style="animation-delay:0.1s" x="70" y="290" width="300" height="60" rx="30" fill="#1E88E5"/><text class="muncul" style="animation-delay:0.30000000000000004s" x="220" y="332" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Sebelum</text><rect class="fx pop" style="animation-delay:0.1s" x="530" y="290" width="300" height="60" rx="30" fill="#EF6C00"/><text class="muncul" style="animation-delay:0.30000000000000004s" x="680" y="332" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Sesudah</text><text x="450" y="300" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#263238">Jepang</text><path d="M385 335 H505 M492 322 L507 335 L492 348" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="muncul" style="animation-delay:0.6s" x="450" y="425" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="38" font-weight="700" fill="#263238">Awalnya = Sebelum</text><text class="muncul" style="animation-delay:0.6s" x="450" y="477" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="38" font-weight="700" fill="#263238">Kini = Sesudah</text><text class="muncul" style="animation-delay:1.2s" x="450" y="545" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#5D4037">“Di Jepang, sayur digoreng tepung”</text></g>
<g id="tahap2"><g class="penunjuk">
  <rect class="fx cincin" x="303" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 450 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
 </g><rect x="40" y="200" width="820" height="425" rx="28" fill="#FFF8EC" stroke="#D7CCC8" stroke-width="3"/><text x="450" y="252" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#6D4C41">Langkah 2 · Cek isi sayuran</text><rect x="70" y="290" width="300" height="60" rx="30" fill="#ECEFF1"/><text x="220" y="332" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#90A4AE">Sebelum</text><rect class="fx pop" style="animation-delay:0.1s" x="530" y="290" width="300" height="60" rx="30" fill="#EF6C00"/><text class="muncul" style="animation-delay:0.30000000000000004s" x="680" y="332" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Sesudah</text><path d="M385 320 H505 M492 307 L507 320 L492 333" fill="none" stroke="#B0BEC5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text class="muncul" style="animation-delay:0.6s" x="450" y="425" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="38" font-weight="700" fill="#263238">berisi sayuran = Sesudah</text><text class="muncul" style="animation-delay:1.2s" x="450" y="520" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" fill="#5D4037">“Kini bakwan berisi aneka sayuran”</text><text class="muncul" style="animation-delay:1.7s" x="450" y="585" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="600" fill="#E53935">Pernyataan 1: Isi aneka sayuran.</text></g>
<g id="tahap3"><g class="penunjuk">
  <rect class="fx cincin" x="8" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
