/text><g class="muncul" style="animation-delay:0.3s"><rect x="60" y="275" width="370" height="90" rx="22" fill="#EDE7F6" stroke="#5E35B1" stroke-width="4"/><text x="245" y="334" font-size="30" font-weight="600" fill="#333" text-anchor="middle">Bacaan: bukan ciri</text></g><g class="muncul" style="animation-delay:0.6s"><rect x="470" y="275" width="370" height="90" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="655" y="334" font-size="30" font-weight="600" fill="#333" text-anchor="middle">Gambar: ada orang</text></g><text class="fx pop" style="animation-delay:1.0s" x="451" y="480" font-size="50" font-weight="800" fill="#EF6C00" text-anchor="middle">orang ada: A dan B</text><text class="muncul" style="animation-delay:1.6s" x="451" y="565" font-size="28" font-style="italic" fill="#444" text-anchor="middle">“jalur khusus untuk pejalan kaki”</text></g></svg>