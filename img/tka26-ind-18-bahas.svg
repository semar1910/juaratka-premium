<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="70" y="16" width="250" height="70" rx="35" fill="#2E7D32"/><text x="195" y="62" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Ruang hijau</text><rect x="340" y="16" width="250" height="70" rx="35" fill="#1E88E5"/><text x="465" y="62" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Mobil listrik</text><rect x="610" y="16" width="250" height="70" rx="35" fill="#EF6C00"/><text x="735" y="62" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Jalur khusus</text></g><g id="tahap1"><g class="drop"><rect x="40" y="190" width="822" height="420" rx="28" fill="#FFF8EC" stroke="#5E35B1" stroke-width="5"/></g><text class="muncul" x="70" y="245" font-size="28" font-weight="700" fill="#666">Pahami pertanyaan</text><g class="muncul" style="animation-delay:0.3s"><rect x="60" y="275" width="330" height="90" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="225" y="334" font-size="30" font-weight="600" fill="#333" text-anchor="middle">Ciri di bacaan</text></g><path class="garis" d="M 405 320 H 495" fill="none" stroke="#5E35B1" stroke-width="6" stroke-linecap="round"/><path class="muncul" style="animation-delay:0.8s" d="M 480 300 L 500 320 L 480 340" fill="none" stroke="#5E35B1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g class="muncul" style="animation-delay:0.6s"><rect x="510" y="275" width="330" height="90" rx="22" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><text x="675" y="334" font-size="30" font-weight="600" fill="#333" text-anchor="middle">Isi gambar</text></g><text class="fx pop" style="animation-delay:1.0s" x="451" y="480" font-size="50" font-weight="800" fill="#5E35B1" text-anchor="middle">cek tiap pernyataan</text><text class="muncul" style="animation-delay:1.6s" x="451" y="565" font-size="28" font-style="italic" fill="#444" text-anchor="middle">“belum nampak dalam gambar”</text></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="63" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 195 94 V160 H885 V400 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="195" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="400" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="drop"><rect x="40" y="190" width="822" height="420" rx="28" fill="#FFF8EC" stroke="#2E7D32" stroke-width="5"/></g><text class="muncul" x="70" y="245" font-size="28" font-weight="700" fill="#666">Cek ruang hijau</text><g class="muncul" style="animation-delay:0.3s"><rect x="60" y="275" width="370" height="90" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="245" y="334" font-size="30" font-weight="600" fill="#333" text-anchor="middle">Bacaan: ada</text></g><g class="muncul" style="animation-delay:0.6s"><rect x="470" y="275" width="370" height="90" rx="22" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><text x="655" y="334" font-size="30" font-weight="600" fill="#333" text-anchor="middle">Gambar: tidak ada</text></g><text class="fx pop" style="animation-delay:1.0s" x="451" y="480" font-size="50" font-weight="800" fill="#2E7D32" text-anchor="middle">ruang hijau: A benar</text><text class="muncul" style="animation-delay:1.6s" x="451" y="565" font-size="28" font-style="italic" fill="#444" text-anchor="middle">“ruang terbuka hijau yang nyaman dan asri”</text></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="333" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 465 94 V160 H885 V400 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="465" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle 