<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif">
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
  <rect x="25" y="16" width="270" height="70" rx="35" fill="#1E88E5"/>
  <text x="160" y="61" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">tiap hari bawa</text>
  <rect x="315" y="16" width="195" height="70" rx="35" fill="#EF6C00"/>
  <text x="412" y="61" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">bantu cari</text>
  <rect x="530" y="16" width="345" height="70" rx="35" fill="#8D6E63"/>
  <text x="702" y="61" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">bawa botol sendiri</text>
</g>

<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="18" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 160 94 V160 H885 V255 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="160" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="255" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop" style="animation-delay:0.2s">
    <rect x="30" y="180" width="810" height="150" rx="24" fill="#E3F2FD" stroke="#1E88E5" stroke-width="5"/>
    <text x="435" y="219" font-size="28" fill="#555" text-anchor="middle">1. Cari bukti pertama</text>
    <text class="fx pop" style="animation-delay:0.8s" x="435" y="272" font-size="40" font-weight="700" fill="#2E7D32" text-anchor="middle">tiap hari bawa: Sesuai</text>
    <text class="muncul" style="animation-delay:1.2s" x="435" y="312" font-size="28" fill="#1565C0" text-anchor="middle">“Kamu tiap hari bawa Si Biru”</text>
  </g>
</g>

<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="308" y="9" width="209" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 412 94 V160 H885 V415 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="412" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="415" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop" style="animation-delay:0.2s">
    <rect x="30" y="340" width="810" height="150" rx="24" fill="#FFF3E0" stroke="#EF6C00" stroke-width="5"/>
    <text x="435" y="379" font-size="28" fill="#555" text-anchor="middle">2. Bedakan kata kerja</text>
    <text class="fx pop" style="animation-delay:0.8s" x="435" y="432" font-size="40" font-weight="700" fill="#C62828" text-anchor="middle">bantu cari: Tidak Sesuai</text>
    <text class="muncul" style="animation-delay:1.2s" x="435" y="472" font-size="28" fill="#E65100" text-anchor="middle">“Kita bantu cari botol”</text>
  </g>
</g>

<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="523" y="9" width="359" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 702 94 V160 H885 V575 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="702" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="575" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop" style="animation-delay:0.2s">
    <rect x="30" y="500" width="810" height="150" rx="24" fill="#EFEBE9" stroke="#8D6E63" stroke-width="5"/>
    <text x="435" y="539" font-size="28" fill="#555" text-anchor="middle">3. Hubungkan ajakan</text>
    <text class="fx pop" style="animation-delay:0.8s" x="435" y="592" font-size="40" font-weight="700" fill="#2E7D32" text-anchor="middle">bawa botol sendiri: Sesuai</text>
    <text class="muncul" style="animation-delay:1.2s" x="435" y="632" font-size="28" fill="#5D4037" text-anchor="middle">“seperti bawa botol sendiri”</text>
  </g>
</g>
</svg>
