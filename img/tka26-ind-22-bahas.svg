<path class="fx pop" style="animation-delay:.9s" d="M 82 271 L 108 297 M 108 271 L 82 297" stroke="#E53935" stroke-width="7" stroke-linecap="round" fill="none"/><text class="muncul" style="animation-delay:0.4s" x="135" y="295" text-anchor="start" font-size="30" font-weight="600" fill="#263238" >B: bukan belajar bersama</text>
<path class="fx pop" style="animation-delay:.9s" d="M 82 321 L 108 347 M 108 321 L 82 347" stroke="#E53935" stroke-width="7" stroke-linecap="round" fill="none"/><text class="muncul" style="animation-delay:0.7s" x="135" y="345" text-anchor="start" font-size="30" font-weight="600" fill="#263238" >C: tidak ada sombong</text>
<rect class="fx pop" style="animation-delay:1.0s" x="240" y="385" width="420" height="70" rx="35" fill="#10B981"/><text class="muncul" style="animation-delay:1.1s" x="450" y="432" text-anchor="middle" font-size="44" font-weight="700" fill="#FFFFFF" >Jawaban D</text>
<path class="fx pop" style="animation-delay:1.3s" d="M 590 420 L 612 442 L 648 400" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text class="muncul" style="animation-delay:1.6s" x="450" y="523" text-anchor="middle" font-size="28" font-weight="400" fill="#607D8B" >“Kamu harus belajar kalau mau nilai bagus”</text>
</g>
</svg>