<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
<rect class="fx pop" style="animation-delay:0.0s" x="10" y="12" width="280" height="78" rx="39" fill="#1E88E5"/>
<text x="150" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Peribahasa</text>
<rect class="fx pop" style="animation-delay:0.15s" x="310" y="12" width="280" height="78" rx="39" fill="#EF6C00"/>
<text x="450" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Harus belajar</text>
<rect class="fx pop" style="animation-delay:0.3s" x="610" y="12" width="280" height="78" rx="39" fill="#8D6E63"/>
<text x="750" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">Tidak belajar</text>
</g>
<g id="tahap1">
<g class="penunjuk">
  <rect class="fx cincin" x="303" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <rect class="fx cincin" x="603" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 750 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="750" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect x="38" y="190" width="824" height="370" rx="24" fill="#FFFFFF" stroke="#E0D6C6" stroke-width="3"/>
<text class="muncul" style="animation-delay:0.2s" x="450" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#8D6E63" >Langkah 1 · Lihat keadaan Arul</text>
<text class="muncul" style="animation-delay:0.5s" x="450" y="315" text-anchor="middle" font-size="38" font-weight="700" fill="#263238" >Tidak belajar, nilai jelek</text>
<path class="garis" style="animation-delay:0.9s" d="M 450 330 L 450 376" fill="none" stroke="#8D6E63" stroke-width="6" stroke-linecap="round"/><path class="muncul" style="animation-delay:1.6s" d="M 438 360 L 450 376 L 462 360" fill="none" stroke="#8D6E63" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="fx pop" style="animation-delay:1.0s" x="150" y="385" width="600" height="70" rx="35" fill="#8D6E63"/><text class="muncul" style="animation-delay:1.1s" x="450" y="432" text-anchor="middle" font-size="44" font-weight="700" fill="#FFFFFF" >Arul harus belajar</text>
<text class="muncul" style="animation-delay:1.4s" x="450" y="523" text-anchor="middle" font-size="28" font-weight="400" fill="#607D8B" >“Kok nilaiku jelek banget?”</text>
</g>
<g id="tahap2">
<g class="penunjuk">
  <rect class="fx cincin" x="3" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 150 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect x="38" y="190" width="824" height="370" rx="24" fill="#FFFFFF" stroke="#E0D6C6" stroke-width="3"/>
<text class="muncul" style="animation-delay:0.2s" x="450" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#1E88E5" >Langkah 2 · Maknai peribahasa</text>
<rect class="fx pop" style="animation-delay:0.4s" x="60" y="268" width="320" height="70" rx="20" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/><text class="muncul" style="animation-delay:0.55s" x="220" y="316" text-anchor="middle" font-size="36" font-weight="700" fill="#263238" >Usaha dulu</text>
<path class="garis" style="animation-delay:0.8s" d="M 395 303 L 500 303" fill="none" stroke="#1E88E5" stroke-width="6" stroke-linecap="round"/><path class="muncul" style="animation-delay:1.5s" d="M 484 291 L 500 303 L 484 315" fill="none" stroke="#1E88E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect class="fx pop" style="animation-delay:1.0s" x="520" y="268" width="320" height="70" rx="20" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/><text class="muncul" style="animation-delay:1.15s" x="680" y="316" text-anchor="middle" font-size="36" font-weight="700" fill="#263238" >Senang nanti</text>
<rect class="fx pop" style="animation-delay:1.0s" x="150" y="385" width="600" height="70" rx="35" fill="#1E88E5"/><text class="muncul" style="animation-delay:1.1s" x="450" y="432" text-anchor="middle" font-size="44" font-weight="700" fill="#FFFFFF" >Harus berusaha dulu</text>
<text class="muncul" style="animation-delay:1.6s" x="450" y="523" text-anchor="middle" font-size="28" font-weight="400" fill="#607D8B" >“Harus berusaha kalau mau berhasil”</text>
</g>
<g id="tahap3">
<g class="penunjuk">
  <rect class="fx cincin" x="603" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
