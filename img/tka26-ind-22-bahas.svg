</g>
<rect x="38" y="190" width="824" height="370" rx="24" fill="#FFFFFF" stroke="#E0D6C6" stroke-width="3"/>
<text class="muncul" style="animation-delay:0.2s" x="450" y="245" text-anchor="middle" font-size="28" font-weight="700" fill="#8D6E63" >Langkah 3 · Periksa pilihan A</text>
<rect class="fx pop" style="animation-delay:0.4s" x="50" y="268" width="340" height="70" rx="20" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><text class="muncul" style="animation-delay:0.55s" x="220" y="316" text-anchor="middle" font-size="36" font-weight="700" fill="#263238" >A: lebih giat</text><path class="fx pop" style="animation-delay:.9s" d="M 349 275 L 375 301 M 375 275 L 349 301" stroke="#E53935" stroke-width="7" stroke-linecap="round" fill="none"/>
<text class="muncul" style="animation-delay:0.7s" x="450" y="317" text-anchor="middle" font-size="56" font-weight="700" fill="#263238" >≠</text>
<rect class="fx pop" style="animation-delay:0.9s" x="510" y="268" width="340" height="70" rx="20" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/><text class="muncul" style="animation-delay:1.05s" x="680" y="316" text-anchor="middle" font-size="36" font-weight="700" fill="#263238" >Belum belajar</text>
<rect class="fx pop" style="animation-delay:1.0s" x="190" y="385" width="520" height="70" rx="35" fill="#E53935"/><text class="muncul" style="animation-delay:1.1s" x="450" y="432" text-anchor="middle" font-size="44" font-weight="700" fill="#FFFFFF" >A kurang tepat</text>
<text class="muncul" style="animation-delay:1.6s" x="450" y="523" text-anchor="middle" font-size="28" font-weight="400" fill="#607D8B" >“Dulu aku tidak belajar”</text>
</g>
<g id="tahap4">
