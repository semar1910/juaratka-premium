<svg viewBox="0 0 900 570" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
  <g class="fx pop">
    <rect x="15" y="18" width="280" height="66" rx="33" fill="#1E88E5"/>
    <text x="155" y="61" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Enggak mau</text>
  </g>
  <g class="fx pop" style="animation-delay:0.15s">
    <rect x="305" y="18" width="280" height="66" rx="33" fill="#EF6C00"/>
    <text x="445" y="61" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Nilai jelek</text>
  </g>
  <g class="fx pop" style="animation-delay:0.3s">
    <rect x="595" y="18" width="280" height="66" rx="33" fill="#8D6E63"/>
    <text x="735" y="61" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">Mengangguk</text>
  </g>
</g>

<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="8" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 155 94 V106 H885 V190 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="155" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="190" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop" style="animation-delay:0.2s">
    <rect x="20" y="122" width="842" height="136" rx="22" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
    <text x="441" y="158" text-anchor="middle" font-size="28" fill="#455A64">Langkah 1 · Cari sikap awal</text>
    <text x="441" y="206" text-anchor="middle" font-size="40" font-weight="700" fill="#1E88E5">Enggak mau → Menolak</text>
    <text x="441" y="244" text-anchor="middle" font-size="28" fill="#37474F">“Enggak mau, ah! Aku malas.”</text>
  </g>
</g>

<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="298" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <rect class="fx cincin" x="588" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 735 94 V106 H885 V338 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="735" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="338" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop" style="animation-delay:0.2s">
    <rect x="20" y="270" width="842" height="136" rx="22" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
    <text x="441" y="306" text-anchor="middle" font-size="28" fill="#455A64">Langkah 2 · Cari sikap akhir</text>
    <text x="441" y="354" text-anchor="middle" font-size="40" font-weight="700" fill="#EF6C00">Diajak → Mau belajar</text>
    <text x="441" y="392" text-anchor="middle" font-size="28" fill="#37474F">“Arul pun mengangguk.”</text>
  </g>
</g>

<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="588" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 735 94 V106 H885 V486 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="735" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="486" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop" style="animation-delay:0.2s">
    <rect x="20" y="418" width="842" height="136" rx="22" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/>
    <text x="441" y="454" text-anchor="middle" font-size="28" fill="#455A64">Langkah 3 · Cocokkan pilihan</text>
    <text x="441" y="502" text-anchor="middle" font-size="40" font-weight="700" fill="#2E7D32">Cocokkan → Jawaban C</text>
    <text x="441" y="540" text-anchor="middle" font-size="28" fill="#37474F">A, B, D tidak ada di cerita</text>
  </g>
</g>
</svg>
