<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 766" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="62" y="16" width="279" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="90" cy="54" r="10" fill="#1E88E5"/><text x="106" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">adonan 800 g</text><rect x="358" y="16" width="249" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="386" cy="54" r="10" fill="#EF6C00"/><text x="402" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">tepung 2/5</text><rect x="623" y="16" width="215" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="651" cy="54" r="10" fill="#8D6E63"/><text x="667" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">gula 0,25</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="351" y="9" width="263" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M482 94 V112 H246 V196" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="482" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="246" cy="196" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="110" y="200" width="680" height="74" rx="14" fill="#F5E6C8" stroke="#8B6B3E" stroke-width="3"/><g class="fx pop" style="animation-delay:1.20s"><text class="fx sorot" style="animation-delay:1.80s" x="790" y="186" text-anchor="end" font-size="32" font-weight="700" fill="#5D4037">adonan = 100%</text></g><rect class="fx kiri tumbuh" style="animation-delay:0.50s" x="111.5" y="201.5" width="269.0" height="71" rx="12" fill="#EF6C00" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.10s"><text x="246" y="249" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">40%</text></g><rect class="fx kiri tumbuh" style="animation-delay:0.90s" x="383.5" y="201.5" width="167.0" height="71" rx="12" fill="#8D6E63" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.50s"><text x="467" y="249" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">25%</text></g><g class="fx pop" style="animation-delay:1.50s"><text x="246" y="310" text-anchor="middle" font-size="28" font-weight="600" fill="#EF6C00">2/5 = 40%</text></g><g class="fx pop" style="animation-delay:1.80s"><text x="467" y="310" text-anchor="middle" font-size="28" font-weight="600" fill="#8D6E63">0,25 = 25%</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="110" y="370" width="680" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="142" cy="399" r="18" fill="#E53935"/><path d="M135 392 L149 406 M149 392 L135 406" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="170" y="409" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">2/5 − 0,25 langsung? bentuknya beda</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="55" y="9" width="293" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M202 94 V112 H450 V196" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="202" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="196" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><text x="110" y="480" text-anchor="start" font-size="34" font-weight="700" fill="#EF6C00">tepung: 40% × 800 = 320 g</text></g><g class="fx pop" style="animation-delay:1.00s"><text x="110" y="540" text-anchor="start" font-size="34" font-weight="700" fill="#8D6E63">gula: 25% × 800 = 200 g</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="55" y="9" width="293" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M202 94 V112 H450 V196" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="202" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="196" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="110" y="590" width="680" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="146" cy="624" r="20.4" fill="#2E7D32"/><path d="M137 624 L144 632 L156 617" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="636" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">320 − 200 = 120 g</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="110" y="674" width="680" height="68" rx="34" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="146" cy="708" r="20.4" fill="#E53935"/><path d="M138 700 L154 716 M154 700 L138 716" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="186" y="719" text-anchor="start" font-size="30" font-weight="700" fill="#B71C1C">15% bukan 15 g</text></g></g></svg>