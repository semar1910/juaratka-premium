-width="3"/><text x="510" y="204" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">1,5 jam</text></g><g class="fx pop" style="animation-delay:1.20s"><text x="704" y="204" text-anchor="start" font-size="30" font-weight="700" fill="#4E342E">Pergi</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="60" y="236" width="640" height="52" rx="26" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="88" cy="262" r="15.6" fill="#2E7D32"/><path d="M81 262 L86 268 L96 257" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="272" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">A benar: pergi 2 jam 30 menit</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="18" y="9" width="252" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M143 94 V112 H885 V327 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="143" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="327" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="60" y="298" width="560" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="327" r="18" fill="#E53935"/><path d="M85 320 L99 334 M99 320 L85 334" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="337" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">(30 + 60) ÷ 2 = 45 km/jam</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="60" y="364" width="640" height="52" rx="26" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="88" cy="390" r="15.6" fill="#E53935"/><path d="M82 384 L94 396 M94 384 L82 396" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="400" text-anchor="start" font-size="28" font-weight="700" fill="#B71C1C">B salah: 120 ÷ 2,5 = 48 km/jam</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="271" y="9" width="252" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M397 94 V112 H885 V457 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="397" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="457" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="60" y="426" width="560" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="455" r="18" fill="#E53935"/><path d="M85 448 L99 462 M99 448 L85 462" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="465" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">lebih cepat = lebih singkat</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="60" y="492" width="540" height="52" rx="26" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="88" cy="518" r="15.6" fill="#2E7D32"/><path d="M81 518 L86 524 L96 513" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="528" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">C benar: 1,5 jam &gt; 1 jam</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="525" y="9" width="357" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M704 94 V112 H885 V628 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="704" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-d