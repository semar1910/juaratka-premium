<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="Poppins, Inter, Arial, sans-serif">
<rect width="600" height="250" fill="#fff"/>
<text x="300.0" y="34.0" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" >Siapa yang ditanya?</text><rect x="30" y="62" width="250" height="136" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2" /><text x="155.0" y="90.0" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle" >Perasaan tokoh</text><text x="155.0" y="116.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >apa yang dirasakan</text><text x="155.0" y="138.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >tokoh saat peristiwa</text><text x="155.0" y="160.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >terjadi</text><rect x="320" y="62" width="250" height="136" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2" /><text x="445.0" y="90.0" font-size="16" font-weight="700" fill="#6D28D9" text-anchor="middle" >Respons pembaca</text><text x="445.0" y="116.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >perasaan yang wajar</text><text x="445.0" y="138.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >muncul pada orang</text><text x="445.0" y="160.0" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" >yang membacanya</text><text x="300.0" y="228.0" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle" >Baca lagi soalnya: tokoh atau pembaca?</text>
</svg>
