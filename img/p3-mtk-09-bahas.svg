e="28" font-weight="700" fill="#fff">1/8 m</text></g><path class="garis" style="animation-delay:0.90s" d="M93 198 V186 H327 V198" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:1.40s"><text class="fx sorot" style="animation-delay:2.00s" x="210" y="172" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">2 × 1/8 = 1/4 m</text></g><g class="fx pop" style="animation-delay:1.80s"><rect x="130" y="444" width="640" height="60" rx="30" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="162" cy="474" r="18.0" fill="#2E7D32"/><path d="M154 474 L160 481 L171 468" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="198" y="485" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">B: dua potong 1/4 m, benar</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="163" y="9" width="255" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M290 94 V112 H885 V545 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="290" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="545" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><rect x="130" y="516" width="640" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="162" cy="545" r="18" fill="#E53935"/><path d="M155 538 L169 552 M169 538 L155 552" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="190" y="555" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">C: 3/4 × 6 = 4 1/2 m, keliru</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="163" y="9" width="255" height="90" rx="45" fill="none" stroke="#E53935" stroke-width=