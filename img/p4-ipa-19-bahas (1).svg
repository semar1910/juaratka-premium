="422" text-anchor="middle" font-size="28" font-weight="700" fill="#4E342E">sama</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="320" y="9" width="232" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M436 94 V112 H885 V300 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="436" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="300" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx kedut" style="animation-delay:0.30s"><rect x="628" y="153" width="174" height="226" rx="10" fill="none" stroke="#EF6C00" stroke-width="6"/></g><g class="fx pop" style="animation-delay:0.80s"><text x="450" y="470" text-anchor="middle" font-size="32" font-weight="700" fill="#EF6C00">lebar naik → waktu naik</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="554" y="9" width="268" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M688 94 V112 H885 V560 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="688" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="560" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="40" y="520" width="260" height="86" rx="16" fill="#E0F2F1" stroke="#00897B" stroke-width="3"/><text x="170" y="573" text-anchor="middle" font-size="28" font-weight="700" fill="#004D40">lebar ↑</text></g><path class="garis" style="animation-delay:0.60s" d="M306 563 L303 563" stroke="#00897B" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:1.30s"><path d="M314 563 L298 571 L298 555 Z"