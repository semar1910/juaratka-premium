<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="74" y="16" width="243" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="102" cy="54" r="10" fill="#1E88E5"/><text x="118" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">1 1/2 liter</text><rect x="333" y="16" width="181" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="361" cy="54" r="10" fill="#EF6C00"/><text x="377" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">6 gelas</text><rect x="531" y="16" width="296" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="559" cy="54" r="10" fill="#8D6E63"/><text x="575" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">minum 3 gelas</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="326" y="9" width="195" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M424 94 V112 H885 V270 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="424" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="270" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="100" y="230" width="700" height="80" rx="14" fill="#F5E6C8" stroke="#8B6B3E" stroke-width="3"/><g class="fx pop" style="animation-delay:0.50s"><text class="fx sorot" style="animation-delay:1.10s" x="800" y="216" text-anchor="end" font-size="34" font-weight="700" fill="#0D47A1">1 1/2 liter</text></g><line class="muncul" style="animation-delay:0.96s" x1="216.7" y1="234" x2="216.7" y2="306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:1.02s" x1="333.3" y1="234" x2="333.3" y2="306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:1.08s" x1="450.0" y1="234" x2="450.0" y2="306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:1.14s" x1="566.7" y1="234" x2="566.7" y2="306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:1.20s" x1="683.3" y1="234" x2="683.3" y2="306" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><path class="garis" style="animation-delay:1.60s" d="M103 322 V334 H214 V322" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:2.10s"><text class="fx sorot" style="animation-delay:2.70s" x="158" y="372" text-anchor="middle" font-size="32" font-weight="700" fill="#EF6C00">1/4 liter</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="40" y="410" width="400" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="439" r="18" fill="#E53935"/><path d="M65 432 L79 446 M79 432 L65 446" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="449" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">1 1/2 × 6 = 9 liter</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="524" y="9" width="310" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M678 94 V112 H885 V270 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="678" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="270" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="101.5" y="231.5" width="347.0" height="77" rx="12" fill="#8D6E63" fill-opacity=".85"/><g class="fx pop" style="animation-delay:0.90s"><text x="275" y="282" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">diminum</text></g><path class="garis" style="animation-delay:1.00s" d="M453 322 V334 H797 V322" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:1.50s"><text class="fx sorot" style="animation-delay:2.10s" x="625" y="372" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">3 × 1/4 = 3/4 liter</text></g><g class="fx pop" style="animation-delay:1.90s"><rect x="470" y="410" width="400" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="502" cy="439" r="18" fill="#E53935"/><path d="M495 432 L509 446 M509 432 L495 446" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="530" y="449" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">1 1/2 − 1/4 = 1 1/4</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="524" y="9" width="310" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M678 94 V112 H885 V330 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="678" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="330" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M103 218 V206 H447 V218" fill="none" stroke="#8D6E63" stroke-width="5"/><g class="fx pop" style="animation-delay:0.80s"><text class="fx sorot" style="animation-delay:1.40s" x="275" y="192" text-anchor="middle" font-size="32" font-weight="700" fill="#8D6E63">diminum 3/4 liter</text></g><g class="fx pop" style="animation-delay:1.30s"><rect x="150" y="490" width="600" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="186" cy="524" r="20.4" fill="#2E7D32"/><path d="M177 524 L184 532 L196 517" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="226" y="536" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">Benar – Salah – Benar</text></g></g></svg>