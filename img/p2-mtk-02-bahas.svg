<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 777" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="110" y="16" width="171" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="138" cy="54" r="10" fill="#1E88E5"/><text x="154" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">4 buku</text><rect x="298" y="16" width="191" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="326" cy="54" r="10" fill="#EF6C00"/><text x="342" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">3 pensil</text><rect x="505" y="16" width="285" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="533" cy="54" r="10" fill="#8D6E63"/><text x="549" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">bayar 20.000</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="103" y="9" width="185" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M196 94 V112 H150 V196" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="196" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="150" cy="196" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="drop" style="animation-delay:0.40s"><path d="M68 214 Q80 210 92 216 V253 Q80 246 68 251 Z" fill="#42A5F5"/><path d="M116 214 Q104 210 92 216 V253 Q104 246 116 251 Z" fill="#1E88E5"/></g><g class="drop" style="animation-delay:0.55s"><path d="M144 214 Q156 210 168 216 V253 Q156 246 144 251 Z" fill="#42A5F5"/><path d="M192 214 Q180 210 168 216 V253 Q180 246 192 251 Z" fill="#1E88E5"/></g><g class="drop" style="animation-delay:0.70s"><path d="M220 214 Q232 210 244 216 V253 Q232 246 220 251 Z" fill="#42A5F5"/><path d="M268 214 Q256 210 244 216 V253 Q256 246 268 251 Z" fill="#1E88E5"/></g><g class="drop" style="animation-delay:0.85s"><path d="M296 214 Q308 210 320 216 V253 Q308 246 296 251 Z" fill="#42A5F5"/><path d="M344 214 Q332 210 320 216 V253 Q332 246 344 251 Z" fill="#1E88E5"/></g><g class="fx pop" style="animation-delay:1.00s"><text x="390" y="250" text-anchor="start" font-size="34" font-weight="700" fill="#0D47A1">4 × 3.500 = 14.000</text></g><g class="drop" style="animation-delay:1.00s"><rect x="64" y="297" width="40" height="19" rx="3" fill="#EF6C00"/><rect x="64" y="304" width="40" height="6" fill="#fff" fill-opacity=".25"/><rect x="64" y="297" width="6" height="19" rx="2" fill="#F48FB1"/><path d="M104 297 L120 307 L104 317 Z" fill="#FFE0B2"/><path d="M114 304 L120 307 L114 310 Z" fill="#37474F"/></g><g class="drop" style="animation-delay:1.15s"><rect x="140" y="297" width="40" height="19" rx="3" fill="#EF6C00"/><rect x="140" y="304" width="40" height="6" fill="#fff" fill-opacity=".25"/><rect x="140" y="297" width="6" height="19" rx="2" fill="#F48FB1"/><path d="M180 297 L196 307 L180 317 Z" fill="#FFE0B2"/><path d="M190 304 L196 307 L190 310 Z" fill="#37474F"/></g><g class="drop" style="animation-delay:1.30s"><rect x="216" y="297" width="40" height="19" rx="3" fill="#EF6C00"/><rect x="216" y="304" width="40" height="6" fill="#fff" fill-opacity=".25"/><rect x="216" y="297" width="6" height="19" rx="2" fill="#F48FB1"/><path d="M256 297 L272 307 L256 317 Z" fill="#FFE0B2"/><path d="M266 304 L272 307 L266 310 Z" fill="#37474F"/></g><g class="fx pop" style="animation-delay:1.60s"><text x="390" y="325" text-anchor="start" font-size="34" font-weight="700" fill="#BF360C">3 × 1.500 = 4.500</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="60" y="358" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="387" r="18" fill="#E53935"/><path d="M85 380 L99 394 M99 380 L85 394" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="397" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">3.500 + 1.500 = 5.000 (lupa dikali)</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="291" y="9" width="205" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M393 94 V112 H885 V470 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="393" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="470" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="60" y="436" width="780" height="68" rx="34" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/><text x="450" y="482" text-anchor="middle" font-size="34" font-weight="700" fill="#0D47A1">14.000 + 4.500 = 18.500</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="60" y="520" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="549" r="18" fill="#E53935"/><path d="M85 542 L99 556 M99 542 L85 556" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="559" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">18.500 = total belanja, bukan kembalian</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="498" y="9" width="299" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M647 94 V112 H885 V640 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="647" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="640" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><circle cx="92" cy="632" r="21" fill="#FBC02D" stroke="#F57F17" stroke-width="3"/><circle cx="92" cy="632" r="13" fill="none" stroke="#F57F17" stroke-width="2"/></g><g class="fx pop" style="animation-delay:0.50s"><text class="fx sorot" style="animation-delay:1.10s" x="145" y="645" text-anchor="start" font-size="34" font-weight="700" fill="#4E342E">20.000 − 18.500 = 1.500</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="60" y="685" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="719" r="20.4" fill="#2E7D32"/><path d="M87 719 L94 727 L106 712" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="731" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">kembalian Rp1.500,00 (C)</text></g></g></svg>