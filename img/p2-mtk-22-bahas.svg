roke="#1E88E5" stroke-width="3"/><text x="220" y="152" text-anchor="middle" font-size="28" font-weight="700" fill="#0D47A1">5 m</text></g><g class="fx pop" style="animation-delay:1.00s"><path d="M346 190 V350 M337 190 H355 M337 350 H355" stroke="#1E88E5" stroke-width="3"/><text x="358" y="280" text-anchor="start" font-size="28" font-weight="700" fill="#0D47A1">4 m</text></g><g class="fx pop" style="animation-delay:1.10s"><path d="M94 350 V470 M85 350 H103 M85 470 H103" stroke="#EF6C00" stroke-width="3"/><text x="82" y="420" text-anchor="end" font-size="28" font-weight="700" fill="#BF360C">3 m</text></g><g class="fx pop" style="animation-delay:1.20s"><path d="M120 496 H200 M120 487 V505 M200 487 V505" stroke="#EF6C00" stroke-width="3"/><text x="160" y="532" text-anchor="middle" font-size="28" font-weight="700" fill="#BF360C">2 m</text></g><g class="fx pop" style="animation-delay:1.30s"><text x="440" y="230" text-anchor="start" font-size="30" font-weight="700" fill="#1E88E5">atas: 5 × 4 = 20 m²</text></g><g class="fx pop" style="animation-delay:1.70s"><text x="440" y="274" text-anchor="start" font-size="30" font-weight="700" fill="#EF6C00">bawah: 2 × 3 = 6 m²</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="430" y="296" width="430" height="62" rx="31" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="463" cy="327" r="18.599999999999998" fill="#2E7D32"/><path d="M455 327 L461 334 L472 320" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="338" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">1: luas 26 m²</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="521" y="9" width="335" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M688 94 V112 H885 V528 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="688" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="528" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="440" y="382" width="36" height="36" rx="4" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/></g><g class="fx pop" style="animation-delay:0.50s"><text x="488" y="410" text-anchor="start" font-size="30" font-weight="700" fill="#8D6E63">1 ubin = 0,25 m²</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="430" y="428" width="430" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="462" cy="457" r="18" fill="#E53935"/><path d="M455 450 L469 464 M469 450 L455 464" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="490" y="467" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">52 ubin? 26 : 0,5</text></g><g class="fx pop" style="animation-delay:2.00s"><rect x="430" y="498" width="430" height="62" rx="31" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="463" cy="529" r="18.599999999999998" fill="#E53935"/><path d="M456 522 L470 536 M470 522 L456 536" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="500" y="540" text-anchor="start" font-size="30" font-weight="700" fill="#B71C1C">2: 104 ubin</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="45" y="9" width="236" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M163 94 V112 H885 V703 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="163" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="703" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="120" y="190" width="200" height="280" fill="none" stroke="#607D8B" stroke-width="3" stroke-dasharray="10 7"/></g><g class="fx pop" style="animation-delay:0.80s"><rect x="200" y="350" width="120" height="120" fill="#FFF1F0" stroke="#E53935" stroke-width="4" stroke-dasharray="9 6"/><text x="260" y="420" text-anchor="middle" font-size="30" font-weight="700" fill="#B71C1C">9 m²</text></g><g class="fx pop" style="animation-delay:1.20s"><text x="440" y="610" text-anchor="start" font-size="30" font-weight="700" fill="#1E88E5">kotak: 5 × 7 = 35 m²</text></g><g class="fx pop" style="animation-delay:1.60s"><text x="440" y="654" text-anchor="start" font-size="30" font-weight="700" fill="#E53935">kosong: 3 × 3 = 9 m²</text></g><g class="fx pop" style="animation-delay:2.10s"><rect x="430" y="672" width="430" height="62" rx="31" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="463" cy="703" r="18.599999999999998" fill="#2E7D32"/><path d="M455 703 L461 710 L472 696" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="714" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">3: 35 − 9 = 26</text></g><g class="fx pop" style="animation-delay:2.60s"><text class="fx sorot" style="animation-delay:3.20s" x="645" y="786" text-anchor="middle" font-size="34" font-weight="700" fill="#2E7D32">Jawaban: B, S, B</text></g></g></svg>