="3" stroke-linejoin="round" fill-opacity="0.5"/><polygon points="130,210 214,160 466,160 382,210" fill="#FFFFFF" stroke="#607D8B" stroke-width="3" stroke-linejoin="round" fill-opacity="0.5"/><polygon points="130,420 382,420 382,273 130,273" fill="#FFCC80" stroke="#EF6C00" stroke-width="3" stroke-linejoin="round" fill-opacity="0.6"/><polygon points="382,420 466,370 466,223 382,273" fill="#FFCC80" stroke="#EF6C00" stroke-width="3" stroke-linejoin="round" fill-opacity="0.6"/><polygon points="130,273 214,223 466,223 382,273" fill="#FFCC80" stroke="#EF6C00" stroke-width="3" stroke-linejoin="round" fill-opacity="0.8"/><text x="206" y="462" text-anchor="middle" font-size="30" font-weight="700" fill="#1E88E5">60 cm</text><text x="426" y="462" text-anchor="middle" font-size="30" font-weight="700" fill="#1E88E5">40 cm</text><g class="fx pop" style="animation-delay:0.30s"><text x="256" y="356" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">35 cm</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="490" y="160" width="370" height="56" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="675" y="199" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">60 × 40 × 35</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="40" y="486" width="820" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="70" cy="514" r="16.8" fill="#2E7D32"/><path d="M62 514 L68 520 L78 508" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="525" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">A: air 60 × 40 × 35 = 84.000 cm³</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="19" y="9" width="294" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M166 94 V112 H885 V576 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="166" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="576" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="muncul" style="animation-delay:0.20s"><polygon points="130,420 382,420 382,210 130,210" fill="none" stroke="#1E88E5" stroke-width="6" stroke-linejoin="round"/><polygon points="382,420 466,370 466,160 382,210" fill="none" stroke="#1E88E5" stroke-width="6" stroke-linejoin="round"/><polygon points="130,210 214,160 466,160 382,210" fill="none" stroke="#1E88E5" stroke-width="6" stroke-linejoin="round"/></g><g class="fx pop" style="animation-delay:0.40s"><path d="M112 210 L112 420" stroke="#1E88E5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M121 210 L103 210" stroke="#1E88E5" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M121 420 L103 420" stroke="#1E88E5" stroke-width="3" fill="none" stroke-linecap="round"/><text x="102" y="325" text-anchor="end" font-size="30" font-weight="700" fill="#1E88E5">50 cm</text></g><g class="fx pop" style="animation-delay:0.80s"><rect x="490" y="222" width="370" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="522" cy="251" r="18" fill="#E53935"/><path d="M515 244 L529 258 M529 244 L515 258" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="550" y="261" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">air = 120 liter?</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="40" y="548" width="820" height="56" rx="28" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="70" cy="576" r="16.8" fill="#E53935"/><path d="M63 569 L77 583 M77 569 L63 583" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="104" y="587" text-anchor="start" font-size="30" font-weight="700" fill="#B71C1C">B: air bukan 120 liter, tetapi 84 liter</text></g></g><