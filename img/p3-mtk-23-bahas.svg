ut" style="animation-delay:0.90s" cx="872" cy="700" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><circle cx="332" cy="242" r="20" fill="#E53935"/><path d="M324 234 L340 250 M340 234 L324 250" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="fx pop" style="animation-delay:0.60s"><rect x="490" y="346" width="370" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="522" cy="375" r="18" fill="#E53935"/><path d="M515 368 L529 382 M529 368 L515 382" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="550" y="385" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">15 cm = 15 liter?</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="40" y="672" width="820" height="56" rx="28" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="70" cy="700" r="16.8" fill="#E53935"/><path d="M63 693 L77 707 M77 693 L63 707" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="104" y="711" text-anchor="start" font-size="30" font-weight="700" fill="#B71C1C">D: 15 cm bukan 15 liter, sisa ruang 36 liter</text></g></g><g id="tahap5"><g class="penunjuk"><rect class="fx cincin" x="548" y="9" width="333" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M714 94 V112 H885 V762 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="714" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="762" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="490" y="408" width="370" height="56" rx="16" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/><text x="675" y="447" text-anchor="middle" font-size="30" font-weight="700" fill="#4E342E">40 − 36 = 4 liter</text></g><g class="fx pop" style="animation-delay:0.90s"><rect x="40" y="734" width="820" height="56" rx="28" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="70" cy="762" r="16.8" fill="#2E7D32"/><path d="M62 762 L68 768 L78 756" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="773" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">E: 40 liter &gt; 36 liter, air tumpah</text></g></g></svg>