fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="196" y="660" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">A: miskin oksigen, ke paru-paru</text></g></g></svg>