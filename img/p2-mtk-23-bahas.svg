<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 802" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="28" y="16" width="293" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="56" cy="54" r="10" fill="#1E88E5"/><text x="72" y="64" text-anchor="start" font-size="28" font-weight="700" fill="#1F2937">100×60×50 cm</text><rect x="336" y="16" width="212" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="364" cy="54" r="10" fill="#EF6C00"/><text x="380" y="64" text-anchor="start" font-size="28" font-weight="700" fill="#1F2937">air 20 cm</text><rect x="564" y="16" width="308" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="592" cy="54" r="10" fill="#8D6E63"/><text x="608" y="64" text-anchor="start" font-size="28" font-weight="700" fill="#1F2937">tambah 60 liter</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="21" y="9" width="307" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M174 94 V112 H885 V246 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="174" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="246" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="100" y="210" width="700" height="74" rx="14" fill="#F5E6C8" stroke="#8B6B3E" stroke-width="3"/><g class="fx pop" style="animation-delay:0.90s"><text class="fx sorot" style="animation-delay:1.50s" x="100" y="196" text-anchor="start" font-size="34" font-weight="700" fill="#1E88E5">300 liter</text></g><g class="fx pop" style="animation-delay:1.20s"><text x="450" y="345" text-anchor="middle" font-size="28" font-weight="700" fill="#1E88E5">100 × 60 × 50 = 300.000 cm³ = 300 liter</text></g></g><g id="tahap2"><g class="penunjuk"><rect class