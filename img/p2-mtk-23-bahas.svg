00 cm³</text></g><g class="fx pop" style="animation-delay:1.60s"><text x="450" y="500" text-anchor="middle" font-size="28" font-weight="700" fill="#2E7D32">180.000 ÷ 6.000 = 30 cm</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="130" y="540" width="640" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="162" cy="569" r="18" fill="#E53935"/><path d="M155 562 L169 576 M169 562 L155 576" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="190" y="579" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">1 liter = 100 cm³ → 21 cm</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="557" y="9" width="322" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M718 94 V112 H885 V246 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="718" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="246" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M523 198 V186 H797 V198" fill="none" stroke="#2E7D32" stroke-width="5"/><g class="fx pop" style="animation-delay:0.80s"><text class="fx sorot" style="animation-delay:1.40s" x="660" y="172" text-anchor="middle" font-size="32" font-weight="700" fill="#2E7D32">sisa 120 liter</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="130" y="625" width="640" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="162" cy="654" r="18" fill="#E53935"/><path d="M155 647 L169 661 M169 647 L155 661" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="190" y="664" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">300 − 60 = 240: lupa air awal</text></g><g class="fx pop" 