xt></g><g class="fx pop" style="animation-delay:0.30s"><text x="40" y="218" text-anchor="start" font-size="28" font-weight="700" fill="#0D47A1">Raka</text></g><g class="fx pop" style="animation-delay:0.50s"><text x="40" y="328" text-anchor="start" font-size="28" font-weight="700" fill="#BF360C">Sari</text></g><rect class="fx kiri tumbuh" style="animation-delay:1.00s" x="151.5" y="181.5" width="172.0" height="53" rx="12" fill="#1E88E5" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.60s"><text x="238" y="220" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">A: 6 km</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="517" y="9" width="361" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M697 94 V112 H885 V272 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="697" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="272" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.20s" x="326.5" y="181.5" width="347.0" height="53" rx="12" fill="#1E88E5" fill-opacity=".85"/><rect class="fx kiri tumbuh" style="animation-delay:0.60s" x="326.5" y="291.5" width="347.0" height="53" rx="12" fill="#EF6C00" fill-opacity=".85"/><g class="fx pop" style="animation-delay:1.20s"><text x="410" y="328" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">B: 1 jam</text></g><g class="fx pop" style="animation-delay:1.40s"><text class="fx sorot" style="animation-delay:2.00s" x="400" y="272" text-anchor="middle" font-size="30" font-weight="700" fill="#8D6E63">selisih 18 − 12 = 6 km/jam</text></g><line class="muncul" style="animation-delay:2.00s" x1="675" y1="176" x2="675" y2="392" stroke="#2E7D32" stroke-width="4" stroke-dasharray="9 7"/><g class="fx pop" style="animation-delay:2.20s"><circle cx="675" cy="392" r="12" fill="#2E7D32" stroke="#fff" stroke-width="3"/><text x="675" y="440" text-anchor="middle" font-size="30" font-weight="700" fill="#1B5E20">08.30</text></g><g class="fx pop" style="animation-delay:2.80s"><rect x="60" y="472" width="560" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="501" r="18" fill="#E53935"/><path d="M85 494 L99 508 M99 494 L85 508" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="511" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">6 km ÷ 12 km/jam = 0,5 jam</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="517" y="9" width="361" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M697 94 V112 H885 V570 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="697" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="570" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><text class="fx sorot" style="animation-delay:1.00s" x="450" y="570" text-anchor="middle" font-size="30" font-weight="700" fill="#2E7D32">C · 18 × 1 = 12 × 1 1/2 = 18 km</text></g></g><g id="tahap4"><g class="penunjuk"><rect class="fx cincin" x="273" y="9" width="241" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M394 94 V112 H885 V618 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="394" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="618" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><line class="muncul" style="animation-delay:0.20s" x1="500" y1="176" x2="500" y2="392" stroke="#E53935" stroke-width="4" stroke-dasharray="9 7"/><g class="fx pop" style="animation-delay:0.50s"><circle cx="500" cy="392" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/><text x="500" y="440" text-anchor="middle" font-size="30" font-weight="700" fill="#B71C1C">08.00</text></g><g class="fx pop" style="animation-delay:1.80s"><rect x="60" y="590" width="660" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="619" r="18" fill="#E53935"/><path d="M85 612 L99 626 M99 612 L85 626" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="629" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Pukul 08.00: Raka 12 km, Sari 9 km</text></g></g><g id="tahap5"><g class="penunjuk"><rect class="fx cincin" x="273" y="9" width="241" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M394 94 V112 H885 V694 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="394" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="694" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><path d="M150 176 V167 H675 V176" fill="none" stroke="#1E88E5" stroke-width="5"/></g><g class="fx pop" style="animation-delay:0.50s"><text x="412" y="158" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">E: Raka 1 1/2 jam</text></g><g class="fx kedut" style="animation-delay:1.00s"><rect x="322" y="287" width="356" height="62" rx="14" fill="none" stroke="#EF6C00" stroke-width="5"/></g><g class="fx pop" style="animation-delay:1.80s"><rect x="110" y="666" width="680" height="52" rx="26" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="138" cy="692" r="1