ay:0.30s"><rect x="60" y="616" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="650" r="20.4" fill="#2E7D32"/><path d="M87 650 L94 658 L106 643" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="660" text-anchor="start" font-size="28" font-weight="700" fill="#1B5E20">C: kaktus simpan air, teratai cari cahaya</text></g></g></svg>