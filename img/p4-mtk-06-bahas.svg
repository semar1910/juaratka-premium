width="2.5" stroke-dasharray="7 6"/><line class="muncul" style="animation-delay:0.44s" x1="660.0" y1="204" x2="660.0" y2="266" stroke="#8B6B3E" stroke-width="2.5" stroke-dasharray="7 6"/><g class="fx pop" style="animation-delay:1.00s"><text x="250" y="370" text-anchor="middle" font-size="44" font-weight="700" fill="#0D47A1">3/5</text></g><path class="garis" style="animation-delay:1.40s" d="M330 352 L549 352" stroke="#EF6C00" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:2.10s"><path d="M560 352 L544 360 L544 344 Z" fill="#EF6C00"/></g><g class="fx pop" style="animation-delay:1.60s"><text x="445" y="326" text-anchor="middle" font-size="32" font-weight="700" fill="#BF360C">× 20</text></g><g class="fx pop" style="animation-delay:2.00s"><text x="660" y="370" text-anchor="middle" font-size="44" font-weight="700" fill="#0D47A1">60/100</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="100" y="410" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="439" r="18" fill="#E53935"/><path d="M125 432 L139 446 M139 432 L125 446" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="449" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">35% → angka 3 dan 5 digabung</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="377" y="9" width="391" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M572 94 V112 H885 V540 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="572" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="540" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><text class="fx sorot" style="animation-delay:0.90s" x="450" y="508" text-anchor="middle" font-size="36" font-weight="700" fill="#BF360C">60/100 = 0,60 = 0,6</text></g><path class="garis" style="animation-delay:0.20s" d="M100 600 H800" stroke="#607D8B" stroke-width="6" stroke-linecap="round" fill="none"/><g class="fx pop" style="animation-delay:0.50s"><circle cx="100" cy="600" r="12" fill="#607D8B" stroke="#fff" stroke-width="3"/><text x="100" y="648" text-anchor="middle" font-size="30" font-weight="700" fill="#263238">0</text></g><g class="fx pop" style="animation-delay:0.70s"><circle cx="800" cy="600" r="12" fill="#607D8B" stroke="#fff" stroke-width="3"/><text x="800" y="648" text-anchor="middle" font-size="30" font-weight="700" fill="#263238">1</text></g><g class="fx pop" style="animation-delay:1.20s"><circle cx="520" cy="600" r="12" fill="#EF6C00" stroke="#fff" stroke-width="3"/><text x="520" y="574" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">0,6</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="133" y="9" width="242" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M254 94 V112 H885 V700 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="254" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="700" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="100" y="680" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="714" r="20.4" fill="#2E7D32"/><path d="M127 714 L134 722 L146 707" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="726" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">D: 0,6 atau 60%</text></g></g></svg>