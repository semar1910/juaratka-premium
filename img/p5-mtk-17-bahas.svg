und"/><circle class="fx pop" cx="734" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="660" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><rect class="fx kiri tumbuh" style="animation-delay:0.30s" x="624.3" y="241.5" width="144.2" height="53" rx="12" fill="#2E7D32" fill-opacity=".85"/><g class="fx pop" style="animation-delay:0.90s"><text x="696" y="278" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">1.150 mL</text></g><g class="fx pop" style="animation-delay:0.90s"><rect x="40" y="470" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="499" r="18" fill="#E53935"/><path d="M65 492 L79 506 M79 492 L65 506" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="509" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">Rp24.000: lupa isi awal 1.250 mL</text></g><g class="fx pop" style="animation-delay:1.60s"><text x="450" y="565" text-anchor="middle" font-size="32" font-weight="700" fill="#263238">sisa 1.150 mL = 1,15 L</text></g><g class="fx pop" style="animation-delay:2.20s"><text x="450" y="612" text-anchor="middle" font-size="32" font-weight="700" fill="#263238">1,15 × Rp10.000 = Rp11.500</text></g><g class="fx pop" style="animation-delay:2.80s"><rect x="100" y="635" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="669" r="20.4" fill="#2E7D32"/><path d="M127 669 L134 677 L146 662" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="681" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">Rp11.500,00</text></g></g></svg>