><circle cx="652" cy="298" r="4" fill="#3E2723"/><path d="M633 313 Q642 319 651 313" stroke="#3E2723" stroke-width="4" fill="none" stroke-linecap="round"/></g><g class="fx pop" style="animation-delay:1.60s"><text x="450" y="390" text-anchor="middle" font-size="30" font-weight="700" fill="#EF6C00">5 rincian, satu topik</text></g><g class="fx pop" style="animation-delay:2.20s"><rect x="100" y="416" width="700" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="132" cy="445" r="18" fill="#E53935"/><path d="M125 438 L139 452 M139 438 L125 452" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="160" y="455" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">satu rincian saja = terlalu sempit</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="58" y="9" width="297" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M207 94 V112 H885 V534 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="207" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="534" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="210" y="256" width="96" height="96" rx="20" fill="none" stroke="#E53935" stroke-width="4" stroke-dasharray="9 6"/><circle cx="300" cy="262" r="20" fill="#E53935"/><text x="300" y="272" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">A</text></g><g class="fx pop" style="animation-delay:0.40s"><rect x="402" y="256" width="96" height="96" rx="20" fill="none" stroke="#E53935" stroke-width="4" stroke-dasharray="9 6"/><circle cx="492" cy="262" r="20" fill="#E53935"/><text x="492" y="272" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">C</text></g><g class="fx pop" style