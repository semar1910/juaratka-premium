aya</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="20" y="9" width="352" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M196 94 V112 H885 V740 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="196" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="740" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="45" y="710" width="810" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="81" cy="744" r="20.4" fill="#2E7D32"/><path d="M72 744 L79 752 L91 737" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="121" y="755" text-anchor="start" font-size="30" font-weight="700" fill="#1B5E20">A: pati dibuat bila terkena cahaya</text></g></g></svg>