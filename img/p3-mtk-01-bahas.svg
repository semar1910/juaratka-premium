<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 632" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="180" y="16" width="244" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="208" cy="54" r="10" fill="#1E88E5"/><text x="224" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">kiri: 12 × 8</text><rect x="440" y="16" width="280" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="468" cy="54" r="10" fill="#EF6C00"/><text x="484" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">kanan: 12 × 6</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="173" y="9" width="258" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M302 94 V112 H225 V168" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="302" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="225" cy="168" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="60" y="170" width="330" height="150" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="225" y="240" text-anchor="middle" font-size="44" font-weight="700" fill="#0D47A1">12 × 8</text><text x="225" y="288" text-anchor="middle" font-size="28" font-weight="600" fill="#0D47A1">baris × banjar</text></g><circle cx="80" cy="190" r="20" fill="#1E88E5"/><text x="80" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">1</text><g class="fx pop" style="animation-delay:1.00s"><rect x="60" y="345" width="330" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="379" r="20.4" fill="#2E7D32"/><path d="M87 379 L94 387 L106 372" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="391" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">= 96 kursi</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="433" y="9" width="294" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M580 94 V112 H675 V168" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="580" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="675" cy="168" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><rect x="510" y="170" width="330" height="150" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="675" y="240" text-anchor="middle" font-size="44" font-weight="700" fill="#BF360C">12 × 6</text><text x="675" y="288" text-anchor="middle" font-size="28" font-weight="600" fill="#BF360C">baris × banjar</text></g><circle cx="530" cy="190" r="20" fill="#EF6C00"/><text x="530" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">2</text><g class="fx pop" style="animation-delay:0.90s"><rect x="510" y="345" width="330" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="542" cy="374" r="18" fill="#E53935"/><path d="M535 367 L549 381 M549 367 L535 381" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="570" y="384" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">12 + 6 = 18</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="510" y="420" width="330" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="546" cy="454" r="20.4" fill="#2E7D32"/><path d="M537 454 L544 462 L556 447" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="586" y="466" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">= 72 kursi</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="173" y="9" width="258" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M302 94 V112 H885 V574 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="302" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="574" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><circle cx="450" cy="520" r="20" fill="#2E7D32"/><text x="450" y="530" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">3</text><g class="fx pop" style="animation-delay:0.40s"><rect x="180" y="540" width="540" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="216" cy="574" r="20.4" fill="#2E7D32"/><path d="M207 574 L214 582 L226 567" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="256" y="586" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">96 + 72 = 168 kursi</text></g></g></svg>