/><g class="fx pop" style="animation-delay:0.30s"><circle cx="90" cy="575" r="12" fill="#607D8B" stroke="#fff" stroke-width="3"/><text x="90" y="623" text-anchor="middle" font-size="30" font-weight="700" fill="#263238">0</text></g><path class="garis" style="animation-delay:0.50s" d="M90 567 Q330 475 570 567" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:1.20s"><text x="330" y="491" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">lauk 40 menit</text></g><g class="fx pop" style="animation-delay:1.30s"><circle cx="570" cy="575" r="12" fill="#EF6C00" stroke="#fff" stroke-width="3"/><text x="570" y="623" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">40</text></g><g class="fx pop" style="animation-delay:1.70s"><circle cx="630" cy="575" r="12" fill="#1E88E5" stroke="#fff" stroke-width="3"/><text x="630" y="623" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">45</text></g><path class="muncul" style="animation-delay:1.9s" d="M630 288 V563" stroke="#E53935" stroke-width="4" stroke-dasharray="8 7" fill="none"/><g class="fx pop" style="animation-delay:2.20s"><text class="fx sorot" style="animation-delay:2.80s" x="450" y="695" text-anchor="middle" font-size="34" font-weight="700" fill="#E53935">selisih: 45 − 40 = 5 menit</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="152" y="9" width="292" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M298 94 V112 H885 V760 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="298" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="760" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="90" y="725" width="720" height="68" rx="34" fill="#E