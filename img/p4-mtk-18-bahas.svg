<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 817" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
