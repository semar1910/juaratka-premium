<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Poppins, Arial, sans-serif">
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
<rect x="10" y="16" width="280" height="70" rx="35" fill="#1E88E5"/>
<text x="150" y="61" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dibandingkan</text>
<rect x="305" y="16" width="290" height="70" rx="35" fill="#EF6C00"/>
<text x="450" y="61" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dinda tak suka</text>
<rect x="610" y="16" width="280" height="70" rx="35" fill="#8D6E63"/>
<text x="750" y="61" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Apa adanya</text>
</g>
<g id="tahap1">
<g class="penunjuk">
  <rect class="fx cincin" x="298" y="9" width="304" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 450 94 V160 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="fx muncul" x="38" y="185" width="824" height="380" rx="28" fill="#FFFDF7" stroke="#1E88E5" stroke-width="4"/>
<text class="muncul" style="animation-delay:0.20s" x="70" y="245" font-size="28" fill="#6B6B6B">Langkah 1 · Pahami pertanyaan</text>
<text class="muncul" style="animation-delay:0.40s" x="70" y="325" font-size="36" font-weight="600" fill="#333333">Dinda ikut senasib</text>
<path class="garis" style="animation-delay:0.60s" d="M70 388 H108 M94 372 L110 388 L94 404" fill="none" stroke="#1E88E5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="muncul" style="animation-delay:0.70s" x="130" y="405" font-size="50" font-weight="700" fill="#1E88E5">Ikut merasakan</text>
<text class="muncul" style="animation-delay:1.00s" x="70" y="490" font-size="28" font-style="italic" fill="#555555">“tidak suka dibanding-bandingkan”</text>
<circle class="fx pop" style="animation-delay:0.60s" cx="790" cy="375" r="62" fill="#1E88E5"/>
<path class="garis" style="animation-delay:0.90s" d="M762 358 H818 M762 392 H818" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="tahap2">
<g class="penunjuk">
  <rect class="fx cincin" x="3" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <rect class="fx cincin" x="603" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 150 94 V160 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="fx muncul" x="38" y="185" width="824" height="380" rx="28" fill="#FFFDF7" stroke="#2E9E5B" stroke-width="4"/>
<text class="muncul" style="animation-delay:0.20s" x="70" y="245" font-size="28" fill="#6B6B6B">Langkah 2 · Pernyataan 1</text>
<text class="muncul" style="animation-delay:0.40s" x="70" y="325" font-size="36" font-weight="600" fill="#333333">Mama terus membandingkan</text>
<path class="garis" style="animation-delay:0.60s" d="M70 388 H108 M94 372 L110 388 L94 404" fill="none" stroke="#2E9E5B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="muncul" style="animation-delay:0.70s" x="130" y="405" font-size="50" font-weight="700" fill="#2E9E5B">Setuju</text>
<text class="muncul" style="animation-delay:1.00s" x="70" y="490" font-size="28" font-style="italic" fill="#555555">“Coba saja kamu ... seperti”</text>
<circle class="fx pop" style="animation-delay:0.60s" cx="790" cy="375" r="62" fill="#2E9E5B"/>
<path class="garis" style="animation-delay:0.90s" d="M762 378 L783 400 L822 350" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="tahap3">
<g class="penunjuk">
  <rect class="fx cincin" x="3" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 150 94 V160 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="fx muncul" x="38" y="185" width="824" height="380" rx="28" fill="#FFFDF7" stroke="#D84343" stroke-width="4"/>
<text class="muncul" style="animation-delay:0.20s" x="70" y="245" font-size="28" fill="#6B6B6B">Langkah 3 · Pernyataan 2</text>
<text class="muncul" style="animation-delay:0.40s" x="70" y="325" font-size="36" font-weight="600" fill="#333333">Lianne bangga pada teman</text>
<path class="garis" style="animation-delay:0.60s" d="M70 388 H108 M94 372 L110 388 L94 404" fill="none" stroke="#D84343" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="muncul" style="animation-delay:0.70s" x="130" y="405" font-size="50" font-weight="700" fill="#D84343">Tidak Setuju</text>
<text class="muncul" style="animation-delay:1.00s" x="70" y="490" font-size="28" font-style="italic" fill="#555555">“aku sangat bangga kepadanya”</text>
<circle class="fx pop" style="animation-delay:0.60s" cx="790" cy="375" r="62" fill="#D84343"/>
<path class="garis" style="animation-delay:0.90s" d="M767 352 L813 398 M813 352 L767 398" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g id="tahap4">
<g class="penunjuk">
  <rect class="fx cincin" x="603" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 750 94 V160 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="750" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
<rect class="fx muncul" x="38" y="185" width="824" height="380" rx="28" fill="#FFFDF7" stroke="#2E9E5B" stroke-width="4"/>
<text class="muncul" style="animation-delay:0.20s" x="70" y="245" font-size="28" fill="#6B6B6B">Langkah 4 · Pernyataan 3</text>
<text class="muncul" style="animation-delay:0.40s" x="70" y="325" font-size="36" font-weight="600" fill="#333333">Harus seperti Albert</text>
<path class="garis" style="animation-delay:0.60s" d="M70 388 H108 M94 372 L110 388 L94 404" fill="none" stroke="#2E9E5B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text class="muncul" style="animation-delay:0.70s" x="130" y="405" font-size="50" font-weight="700" fill="#2E9E5B">Setuju</text>
<text class="muncul" style="animation-delay:1.00s" x="70" y="490" font-size="28" font-style="italic" fill="#555555">“Aku harus bisa seperti Albert”</text>
<circle class="fx pop" style="animation-delay:0.60s" cx="790" cy="375" r="62" fill="#2E9E5B"/>
<path class="garis" style="animation-delay:0.90s" d="M762 378 L783 400 L822 350" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</svg>
