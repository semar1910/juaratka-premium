<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0"><rect x="30" y="16" width="250" height="70" rx="35" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/><text x="155.0" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">Latih gambar</text><rect x="305" y="16" width="250" height="70" rx="35" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/><text x="430.0" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">Kirim gambar</text><rect x="580" y="16" width="290" height="70" rx="35" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/><text x="725.0" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="#1F2937">Gagal dan kesal</text></g>
<g id="tahap1"><g class="penunjuk">
  <rect class="fx cincin" x="23" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 155 94 V124 H885 V195 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="155" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="195" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g><g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="145" width="800" height="100" rx="24" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
  <text x="70" y="181" font-size="28" font-weight="600" fill="#1E88E5">Tindakan</text>
  <text x="815" y="181" text-anchor="end" font-size="28" fill="#374151">“melatih kemampuan menggambarku”</text>
  <text class="muncul" style="animation-delay:0.5s" x="70" y="227" font-size="44" font-weight="700" fill="#111827">gagal → terus melatih</text></g></g>
<g id="tahap2"><g class="penunjuk">
  <rect class="fx cincin" x="573" y="9" width="304" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 725 94 V124 H885 V310 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="725" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="310" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g><g class="fx pop" style="animation-delay:0.2s"><rect x="40" y="260" width="385" height="100" rx="20" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
  <text x="64" y="304" font-size="30" font-weight="700" fill="#111827">A salah</text>
  <text x="64" y="342" font-size="28" fill="#374151">matematika: milik Albert</text><path class="garis" style="animation-delay:0.6000000000000001s" d="M375 274 L401 300 M401 274 L375 300" stroke="#E53935" stroke-width="6" stroke-linecap="round" fill="none"/></g><g class="fx pop" style="animation-delay:0.5s"><rect x="455" y="260" width="385" height="100" rx="20" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
  <text x="479" y="304" font-size="30" font-weight="700" fill="#111827">B salah</text>
  <text x="479" y="342" font-size="28" fill="#374151">basket: tidak bisa</text><path class="garis" style="animation-delay:0.9s" d="M790 274 L816 300 M816 274 L790 300" stroke="#E53935" stroke-width="6" stroke-linecap="round" fill="none"/></g></g>
<g id="tahap3"><g class="penunjuk">
  <rect class="fx cincin" x="573" y="9" width="304" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 725 94 V124 H885 V425 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="725" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="425" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g><g class="fx drop" style="animation-delay:0.2s"><rect x="40" y="375" width="800" height="100" rx="24" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/>
  <text x="70" y="411" font-size="28" font-weight="600" fill="#E53935">Uji pilihan D</text>
  <text x="815" y="411" text-anchor="end" font-size="28" fill="#374151">“Aku kesal sekali”</text>
  <text class="muncul" style="animation-delay:0.5s" x="70" y="457" font-size="44" font-weight="700" fill="#111827">kesal, bukan lapang dada</text></g></g>
<g id="tahap4"><g class="penunjuk">
  <rect class="fx cincin" x="23" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 155 94 V124 H885 V528 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="155" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="528" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g><g class="fx pop" style="animation-delay:0.3s"><rect x="40" y="490" width="800" height="76" rx="24" fill="#E8F5E9" stroke="#43A047" stroke-width="4"/>
  <text x="440" y="541" text-anchor="middle" font-size="40" font-weight="700" fill="#1B5E20">Jawaban C: pantang menyerah</text></g></g>
</svg>