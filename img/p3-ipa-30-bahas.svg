 stroke-width="3" stroke-linecap="round"/><text x="590" y="385" text-anchor="start" font-size="28" font-weight="700" fill="#BF360C">R: hujan</text></g><path class="garis" style="animation-delay:2.30s" d="M508 375 L403 375" stroke="#EF6C00" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:3.00s"><path d="M392 375 L408 367 L408 383 Z" fill="#EF6C00"/></g><g class="fx pop" style="animation-delay:2.60s"><rect x="60" y="340" width="320" height="70" rx="35" fill="#EFEBE9" stroke="#8D6E63" stroke-width="4"/><path d="M96 354 C114 375 110 395 96 395 C82 395 78 375 96 354 Z" fill="#29B6F6"/><text x="130" y="385" text-anchor="start" font-size="28" font-weight="700" fill="#4E342E">S: mengalir</text></g><path class="garis" style="animation-delay:3.10s" d="M220 328 L220 253" stroke="#8D6E63" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:3.80s"><path d="M220 242 L228 258 L212 258 Z" fill="#8D6E63"/></g><g class="fx pop" style="animation-delay:3.60s"><circle cx="90" cy="280" r="20" fill="#2E7D32"/><text x="90" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">A</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="306" y="9" width="271" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M441 94 V112 H680 V160" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="441" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="680" cy="160" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><circle cx="550" cy="280" r="20" fill="#2E7D32"/><text x="550" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">B</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="23" y="