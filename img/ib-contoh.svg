ll="#B91C1C" text-anchor="middle" >C: mengubah isi</text><rect x="410" y="184" width="170" height="40" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2" /><text x="495.0" y="209.0" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="middle" >D: menambah info</text></g><g id="tahap3" opacity="0"><rect x="110" y="240" width="380" height="36" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2" /><text x="300.0" y="264.0" font-size="13" font-weight="700" fill="#047857" text-anchor="middle" >Pilihan yang memuat ketiga ide pokok = ?</text></g>
