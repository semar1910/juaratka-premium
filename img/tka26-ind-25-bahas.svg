<svg viewBox="0 0 900 610" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif">
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
  <g class="fx pop">
    <rect x="15" y="12" width="420" height="80" rx="40" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
    <text x="225" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#0D47A1">Yunus: laut + jala</text>
  </g>
  <g class="fx pop" style="animation-delay:0.25s">
    <rect x="465" y="12" width="420" height="80" rx="40" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
    <text x="675" y="63" text-anchor="middle" font-size="28" font-weight="700" fill="#BF360C">Kamal: perahu rusak</text>
  </g>
</g>

<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="8" y="9" width="434" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 225 94 V122 H885 V210 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="225" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="210" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop">
    <rect x="24" y="140" width="838" height="140" rx="24" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/>
    <text x="48" y="178" font-size="28" fill="#455A64">1 · Cari petunjuk</text>
    <text x="443" y="230" text-anchor="middle" font-size="40" font-weight="700" fill="#0D47A1">Kegiatan Yunus → A dan B</text>
    <text x="443" y="266" text-anchor="middle" font-size="28" fill="#37474F">ia mengarungi laut dan melempar jala</text>
  </g>
</g>

<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="458" y="9" width="434" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 675 94 V122 H885 V362 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="675" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="362" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop">
    <rect x="24" y="292" width="838" height="140" rx="24" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4"/>
    <text x="48" y="330" font-size="28" fill="#455A64">2 · Cek pelaku</text>
    <text x="443" y="382" text-anchor="middle" font-size="40" font-weight="700" fill="#BF360C">Perahu rusak → Kamal</text>
    <text x="443" y="418" text-anchor="middle" font-size="28" fill="#37474F">Aku sibuk memperbaiki perahuku</text>
  </g>
</g>

<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="8" y="9" width="434" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 225 94 V122 H885 V514 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="225" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="514" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx drop">
    <rect x="24" y="444" width="838" height="140" rx="24" fill="#E8F5E9" stroke="#43A047" stroke-width="4"/>
    <text x="48" y="482" font-size="28" fill="#455A64">3 · Pilih jawaban</text>
    <text x="443" y="534" text-anchor="middle" font-size="40" font-weight="700" fill="#1B5E20">Jawaban: A dan B</text>
    <text x="443" y="570" text-anchor="middle" font-size="28" fill="#37474F">C milik Kamal, bukan Yunus</text>
  </g>
</g>
</svg>
