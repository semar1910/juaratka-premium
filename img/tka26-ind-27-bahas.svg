<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0"><rect x="10" y="16" width="270" height="70" rx="35" fill="#1E88E5"/><text x="145" y="45" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Ayah jelaskan</text><text x="145" y="76" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">keadaan sulit</text><rect x="315" y="16" width="270" height="70" rx="35" fill="#EF6C00"/><text x="450" y="45" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Rara sadar</text><text x="450" y="76" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">& minta maaf</text><rect x="620" y="16" width="270" height="70" rx="35" fill="#8D6E63"/><text x="755" y="45" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Hanya minta</text><text x="755" y="76" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">buku cerita</text></g>
<g id="tahap1">
  <g class="penunjuk">
  <rect class="fx cincin" x="3" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 145 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="145" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
  <rect class="fx muncul" x="40" y="190" width="810" height="330" rx="28" fill="#fff" stroke="#1E88E5" stroke-width="6"/>
  <text class="muncul" style="animation-delay:0.2s" x="445" y="255" font-size="28" fill="#555" text-anchor="middle">Langkah 1: cari penjelasan Ayah</text>
  <text class="muncul" style="animation-delay:0.5s" x="445" y="365" font-size="44" font-weight="700" fill="#1E88E5" text-anchor="middle">Penjaga vila → Keadaan sulit</text>
  <text class="muncul" style="animation-delay:0.9s" x="445" y="455" font-size="28" fill="#333" text-anchor="middle">“ayah hanya penjaga vila”</text>
</g>
<g id="tahap2">
  <g class="penunjuk">
  <rect class="fx cincin" x="308" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 450 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
  <rect class="fx muncul" x="40" y="190" width="810" height="330" rx="28" fill="#fff" stroke="#EF6C00" stroke-width="6"/>
  <text class="muncul" style="animation-delay:0.2s" x="445" y="255" font-size="28" fill="#555" text-anchor="middle">Langkah 2: lihat sikap Rara</text>
  <text class="muncul" style="animation-delay:0.5s" x="445" y="365" font-size="44" font-weight="700" fill="#EF6C00" text-anchor="middle">Minta maaf → Menerima</text>
  <text class="muncul" style="animation-delay:0.9s" x="445" y="455" font-size="28" fill="#333" text-anchor="middle">“Rara hanya meminta buku cerita”</text>
</g>
<g id="tahap3">
  <g class="penunjuk">
  <rect class="fx cincin" x="613" y="9" width="284" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
  <path class="alir" d="M 755 94 V160 H885 V420 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <circle class="fx pop" cx="755" cy="94" r="9" fill="#E53935"/>
  <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="420" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
</g>
  <rect class="fx muncul" x="40" y="190" width="810" height="330" rx="28" fill="#fff" stroke="#8D6E63" stroke-width="6"/>
  <text class="muncul" style="animation-delay:0.2s" x="445" y="255" font-size="28" fill="#555" text-anchor="middle">Langkah 3: cocokkan pilihan</text>
  <text class="muncul" style="animation-delay:0.5s" x="445" y="365" font-size="44" font-weight="700" fill="#8D6E63" text-anchor="middle">Menerima rela → Ikhlas</text>
  <text class="muncul" style="animation-delay:0.9s" x="445" y="455" font-size="28" fill="#333" text-anchor="middle">Lega, puas, ceria: tak ada bukti</text>
</g>
</svg>