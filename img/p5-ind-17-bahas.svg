ff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.30s" d="M396 343 L463 343" stroke="#EF6C00" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:1.00s"><path d="M474 343 L458 351 L458 335 Z" fill="#EF6C00"/></g><g class="fx pop" style="animation-delay:0.90s"><rect x="480" y="300" width="380" height="86" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="670" y="353" text-anchor="middle" font-size="28" font-weight="700" fill="#BF360C">jentik tak berkembang</text></g><g class="fx pop" style="animation-delay:1.80s"><rect x="60" y="430" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="459" r="18" fill="#E53935"/><path d="M85 452 L99 466 M99 452 L85 466" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="469" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">hasil kebiasaan lain = pengecoh</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="143" y="9" width="372" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M329 94 V112 H885 V554 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="329" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="554" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="110" y="520" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="146" cy="554" r="20.4" fill="#2E7D32"/><path d="M137 554 L144 562 L156 547" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="186" y="566" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">B: jentik tidak berkembang</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="110" y="604" width="700" height="68" rx="34" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="146" cy="638" r="20.4" fill="#E53935"/><path d="M138 630 L154 646 M154 630 L138 646" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="186" y="649" text-anchor="start" font-size="30" font-weight="700" fill="#B71C1C">A: hasil jendela dibuka</text></g></g></svg>