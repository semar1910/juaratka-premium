nit</text></g><g class="fx pop" style="animation-delay:0.80s"><text x="415" y="180" text-anchor="start" font-size="30" font-weight="700" fill="#0D47A1">12 ÷ 24 = 1/2 jam</text></g><g class="fx pop" style="animation-delay:1.00s"><text x="415" y="235" text-anchor="start" font-size="30" font-weight="700" fill="#4E342E">18 ÷ 36 = 1/2 jam</text></g><g class="fx pop" style="animation-delay:1.60s"><rect x="90" y="270" width="760" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="122" cy="299" r="18" fill="#E53935"/><path d="M115 292 L129 306 M129 292 L115 306" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="150" y="309" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">18 km lebih jauh, jadi lebih lama? (salah)</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="23" y="9" width="264" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M156 94 V112 H885 V462 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="156" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="462" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.10s" d="M90 462 H810" stroke="#607D8B" stroke-width="6" stroke-linecap="round" fill="none"/><g class="fx pop" style="animation-delay:0.30s"><circle cx="90" cy="462" r="12" fill="#607D8B" stroke="#fff" stroke-width="3"/><text x="90" y="510" text-anchor="middle" font-size="30" font-weight="700" fill="#263238">08.00</text></g><path class="garis" style="animation-delay:0.60s" d="M90 454 Q244 362 399 454" fill="none" stroke="#1E88E5" stroke-width="5"/><g class="fx pop" style="animation-delay:1.30s"><text x="244" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">30 me