<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
<rect x="20" y="16" width="250" height="70" rx="35" fill="#1E88E5"/>
<text x="145.0" y="61" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Hujan deras</text>
<rect x="285" y="16" width="330" height="70" rx="35" fill="#EF6C00"/>
<text x="450.0" y="61" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Tetap menikmati</text>
<rect x="630" y="16" width="250" height="70" rx="35" fill="#8D6E63"/>
<text x="755.0" y="61" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">Bersyukur</text>
</g>
<g id="tahap1">
<g class="penunjuk"><rect class="fx cincin" x="13" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 145 94 V112 H885 V210 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="145" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="210" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<rect class="fx pop" x="40" y="135" width="822" height="150" rx="26" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4" style="animation-delay:0.20s"/>
<text class="muncul" style="animation-delay:0.5s" x="451" y="173" font-size="28" font-weight="600" fill="#546E7A" text-anchor="middle">1  Cari kejadian</text>
<text class="muncul" style="animation-delay:0.8s" x="451" y="223" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">hujan, acara batal</text>
<text class="muncul" style="animation-delay:1.1s" x="451" y="263" font-size="28" fill="#37474F" text-anchor="middle">“lampion harus dibatalkan”</text>
</g>
<g id="tahap2">
<g class="penunjuk"><rect class="fx cincin" x="278" y="9" width="344" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><rect class="fx cincin" x="623" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 450 94 V112 H885 V375 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="375" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<rect class="fx pop" x="40" y="300" width="822" height="150" rx="26" fill="#FFF3E0" stroke="#EF6C00" stroke-width="4" style="animation-delay:0.20s"/>
<text class="muncul" style="animation-delay:0.5s" x="451" y="338" font-size="28" font-weight="600" fill="#546E7A" text-anchor="middle">2  Baca sikap tokoh</text>
<text class="muncul" style="animation-delay:0.8s" x="451" y="388" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">tetap menikmati</text>
<text class="muncul" style="animation-delay:1.1s" x="451" y="428" font-size="28" fill="#37474F" text-anchor="middle">“tetap berusaha menikmati perayaan”</text>
</g>
<g id="tahap3">
<g class="penunjuk"><rect class="fx cincin" x="623" y="9" width="264" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 755 94 V112 H885 V540 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="755" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="540" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<rect class="fx pop" x="40" y="465" width="822" height="150" rx="26" fill="#E8F5E9" stroke="#43A047" stroke-width="4" style="animation-delay:0.20s"/>
<text class="muncul" style="animation-delay:0.5s" x="451" y="503" font-size="28" font-weight="600" fill="#546E7A" text-anchor="middle">3  Cocokkan pilihan</text>
<text class="muncul" style="animation-delay:0.8s" x="451" y="553" font-size="42" font-weight="700" fill="#263238" text-anchor="middle">Jawaban A</text>
<text class="muncul" style="animation-delay:1.1s" x="451" y="593" font-size="28" fill="#37474F" text-anchor="middle">B hanya sedih, C dan D diam saja</text>
</g>
</svg>