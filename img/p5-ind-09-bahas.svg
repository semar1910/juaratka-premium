<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 682" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="223" y="16" width="188" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="251" cy="54" r="10" fill="#1E88E5"/><text x="267" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">kedipan</text><rect x="428" y="16" width="249" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="456" cy="54" r="10" fill="#EF6C00"/><text x="472" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">Kata Kakek</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="216" y="9" width="202" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M318 94 V112 H130 V150" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="318" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="130" cy="150" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><text x="450" y="192" text-anchor="middle" font-size="32" font-weight="700" fill="#0D47A1">Kata Kakek: kedipan itu ...</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="30" y="330" width="350" height="90" rx="16" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="205" y="385" text-anchor="middle" font-size="28" font-weight="700" fill="#0D47A1">cahaya berkedip</text><circle cx="205" cy="262" r="20" fill="#FFF176" stroke="#F9A825" stroke-width="3"/><rect x="196" y="282" width="18" height="14" rx="3" fill="#90A4AE"/></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="421" y="9" width="263" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M552 94 V112 H885 V376 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="552" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="376" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.20s" d="M384 375 L485 375" stroke="#607D8B" stroke-width="5" fill="none" stroke-linecap="round"/><g class="fx pop" style="animation-delay:0.90s"><path d="M496 375 L480 383 L480 367 Z" fill="#607D8B"/></g><g class="fx pop" style="animation-delay:0.50s"><rect x="500" y="330" width="350" height="90" rx="16" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><text x="675" y="385" text-anchor="middle" font-size="28" font-weight="700" fill="#BF360C">memanggil temannya</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="110" y="480" width="680" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="142" cy="509" r="18" fill="#E53935"/><path d="M135 502 L149 516 M149 502 L135 516" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="170" y="519" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">C: menerangi jalan (tidak ada di bacaan)</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="216" y="9" width="202" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M318 94 V112 H885 V626 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="318" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="626" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="60" y="590" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="624" r="20.4" fill="#2E7D32"/><path d="M87 624 L94 632 L106 617" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="636" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">B: memanggil kunang-kunang lain</text></g></g></svg>