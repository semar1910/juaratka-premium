<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="90" y="16" width="314" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="118" cy="54" r="10" fill="#1E88E5"/><text x="134" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">mulai tanggal 8</text><rect x="420" y="16" width="390" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="448" cy="54" r="10" fill="#EF6C00"/><text x="464" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">berhenti tanggal 29</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="83" y="9" width="328" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M247 94 V112 H150 V200" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="247" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="150" cy="200" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.20s" d="M80 330 H820" stroke="#607D8B" stroke-width="6" stroke-linecap="round" fill="none"/><g class="fx pop" style="animation-delay:0.50s"><circle cx="80" cy="330" r="12" fill="#1E88E5" stroke="#fff" stroke-width="3"/><text x="80" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">8</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="413" y="9" width="404" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M615 94 V112 H885 V330 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="615" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="330" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><circle cx="820" cy="330" r="12" fill="#EF6C00" stroke="#fff" stroke-width="3"/><text x="820" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">29</text></g><g class="fx pop" style="animation-delay:1.00s"><text class="fx sorot" style="animation-delay:1.60s" x="450" y="440" text-anchor="middle" font-size="34" font-weight="700" fill="#EF6C00">29 − 8 = 21 hari</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="413" y="9" width="404" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M615 94 V112 H885 V570 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="615" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="570" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><path class="garis" style="animation-delay:0.20s" d="M80 322 Q203 230 327 322" fill="none" stroke="#1E88E5" stroke-width="5"/><g class="fx pop" style="animation-delay:0.90s"><text x="203" y="246" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">+7 hari</text></g><g class="fx pop" style="animation-delay:0.60s"><circle cx="327" cy="330" r="12" fill="#1E88E5" stroke="#fff" stroke-width="3"/><text x="327" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">15</text></g><path class="garis" style="animation-delay:1.00s" d="M327 322 Q450 230 573 322" fill="none" stroke="#1E88E5" stroke-width="5"/><g class="fx pop" style="animation-delay:1.70s"><text x="450" y="246" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">+7 hari</text></g><g class="fx pop" style="animation-delay:1.40s"><circle cx="573" cy="330" r="12" fill="#1E88E5" stroke="#fff" stroke-width="3"/><text x="573" y="378" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">22</text></g><path class="garis" style="animation-delay:1.80s" d="M573 322 Q697 230 820 322" fill="none" stroke="#1E88E5" stroke-width="5"/><g class="fx pop" style="animation-delay:2.50s"><text x="697" y="246" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">+7 hari</text></g><g class="fx pop" style="animation-delay:2.40s"><rect x="40" y="470" width="820" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="499" r="18" fill="#E53935"/><path d="M65 492 L79 506 M79 492 L65 506" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="509" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">4 pekan? Itu menghitung 4 tanggal</text></g><g class="fx pop" style="animation-delay:3.00s"><rect x="100" y="548" width="700" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="136" cy="582" r="20.4" fill="#2E7D32"/><path d="M127 582 L134 590 L146 575" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="594" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">21 hari = 3 pekan</text></g></g></svg>