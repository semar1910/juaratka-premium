<svg viewBox="0 0 900 630" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0"><g class="fx pop" style="animation-delay:0.0s"><rect x="6" y="9" width="244" height="84" rx="42" fill="#1E88E5"/><text x="128.0" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Pasukan Kotak</text></g><g class="fx pop" style="animation-delay:0.1s"><rect x="258" y="9" width="372" height="84" rx="42" fill="#EF6C00"/><text x="444.0" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">roket, ikan, menara</text></g><g class="fx pop" style="animation-delay:0.2s"><rect x="638" y="9" width="252" height="84" rx="42" fill="#8D6E63"/><text x="764.0" y="62" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Bendera</text></g></g>
<g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="-1" y="9" width="258" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 128 94 V160 H885 V248 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="128" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="248" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx drop" style="animation-delay:0.2s"><rect x="38" y="180" width="824" height="136" rx="24" fill="#FFF8EC" stroke="#1E88E5" stroke-width="5"/><text x="450" y="216" text-anchor="middle" font-size="28" fill="#1E88E5" font-weight="700">Cari petunjuk</text><text x="450" y="264" text-anchor="middle" font-size="40" fill="#263238" font-weight="700">Pasukan Kotak = kalimatnya</text><text class="muncul" style="animation-delay:0.6s" x="450" y="302" text-anchor="middle" font-size="28" fill="#546E7A">bermain dengan Pasukan Kotak</text></g></g>
<g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="251" y="9" width="386" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 444 94 V160 H885 V396 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="444" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="396" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx drop" style="animation-delay:0.2s"><rect x="38" y="328" width="824" height="136" rx="24" fill="#FFF8EC" stroke="#EF6C00" stroke-width="5"/><text x="450" y="364" text-anchor="middle" font-size="28" fill="#EF6C00" font-weight="700">Baca contoh</text><text x="450" y="412" text-anchor="middle" font-size="40" fill="#263238" font-weight="700">seperti = roket, menara</text><text class="muncul" style="animation-delay:0.6s" x="450" y="450" text-anchor="middle" font-size="28" fill="#546E7A">seperti roket, ikan, dan menara</text></g></g>
<g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="631" y="9" width="266" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 764 94 V160 H885 V544 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="764" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="544" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx drop" style="animation-delay:0.2s"><rect x="38" y="476" width="824" height="136" rx="24" fill="#FFF8EC" stroke="#8D6E63" stroke-width="5"/><text x="450" y="512" text-anchor="middle" font-size="28" fill="#8D6E63" font-weight="700">Cocokkan pilihan</text><text x="450" y="560" text-anchor="middle" font-size="40" fill="#263238" font-weight="700">Bendera = bukan Kotak</text><text class="muncul" style="animation-delay:0.6s" x="450" y="598" text-anchor="middle" font-size="28" fill="#546E7A">atap rumah, bendera, dan kipas angin</text></g></g>
</svg>