x="10" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><text x="306" y="316" text-anchor="middle" font-size="30" font-weight="700" fill="#0D47A1">dag</text></g><g class="fx pop" style="animation-delay:0.34s"><rect x="360" y="312" width="92" height="54" rx="10" fill="#1E88E5" stroke="#1E88E5" stroke-width="3"/><text x="406" y="350" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">g</text></g><path class="garis" style="animation-delay:1.00s" d="M106 206 Q256 170 406 308" fill="none" stroke="#EF6C00" stroke-width="5"/><g class="fx pop" style="animation-delay:1.70s"><text x="256" y="186" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">turun 3: × 1.000</text></g><g class="fx pop" style="animation-delay:1.20s"><text x="500" y="250" text-anchor="start" font-size="34" font-weight="700" fill="#0D47A1">2 kg = 2.000 g</text></g><g class="fx pop" style="animation-delay:1.70s"><text x="500" y="305" text-anchor="start" font-size="34" font-weight="700" fill="#4E342E">1/2 kg = 500 g</text></g><g class="fx pop" style="animation-delay:2.20s"><text x="500" y="360" text-anchor="start" font-size="34" font-weight="700" fill="#BF360C">750 g tetap 750 g</text></g><g class="fx pop" style="animation-delay:2.80s"><rect x="60" y="410" width="780" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="92" cy="439" r="18" fill="#E53935"/><path d="M85 432 L99 446 M99 432 L85 446" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="120" y="449" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">2 + 750 + 500 = 1.252 (2 kg lupa diubah)</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="279" y="9" width="297" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M427 94 V112 H885 V515 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="427" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="515" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="60" y="482" width="780" height="68" rx="34" fill="#E3F2FD" stroke="#1E88E5" stroke-width="4"/><text x="450" y="528" text-anchor="middle" font-size="34" font-weight="700" fill="#0D47A1">2.000 + 750 + 500 = 3.250 g</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="578" y="9" width="304" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M729 94 V112 H885 V600 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="729" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="600" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="60" y="566" width="780" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="96" cy="600" r="20.4" fill="#2E7D32"/><path d="M87 600 L94 608 L106 593" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="612" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">3.250 g = jawaban B</text></g><g class="fx pop" style="animation-delay:1.20s"><rect x="60" y="646" width="780" height="68" rx="34" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="96" cy="680" r="20.4" fill="#E53935"/><path d="M88 672 L104 688 M104 672 L88 688" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="136" y="692" text-anchor="start" font-size="32" font-weight="700" fill="#B71C1C">C: 1/2 kg dikira 1.000 g</text></g></g></svg>