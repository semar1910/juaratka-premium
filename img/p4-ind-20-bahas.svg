<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 592" font-family="Poppins, Arial, sans-serif"><style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style><g id="tahap0"><rect x="128" y="16" width="244" height="76" rx="38" fill="#1E88E5" fill-opacity=".12" stroke="#1E88E5" stroke-width="3"/><circle cx="156" cy="54" r="10" fill="#1E88E5"/><text x="172" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">penumpang</text><rect x="388" y="16" width="188" height="76" rx="38" fill="#EF6C00" fill-opacity=".12" stroke="#EF6C00" stroke-width="3"/><circle cx="416" cy="54" r="10" fill="#EF6C00"/><text x="432" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">nelayan</text><rect x="593" y="16" width="180" height="76" rx="38" fill="#8D6E63" fill-opacity=".12" stroke="#8D6E63" stroke-width="3"/><circle cx="621" cy="54" r="10" fill="#8D6E63"/><text x="637" y="65" text-anchor="start" font-size="30" font-weight="700" fill="#1F2937">kemudi</text></g><g id="tahap1"><g class="penunjuk"><rect class="fx cincin" x="121" y="9" width="258" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M250 94 V112 H450 V146" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="250" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="450" cy="146" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="150" width="770" height="66" rx="14" fill="#E3F2FD" stroke="#1E88E5" stroke-width="3"/><rect x="40" y="150" width="12" height="66" rx="6" fill="#1E88E5"/><text x="68" y="193" text-anchor="start" font-size="28" font-weight="600" fill="#0D47A1">“mengantar penumpang menyeberangi”</text></g><g class="fx pop" style="animation-delay:0.90s"><circle cx="840" cy="183" r="22" fill="#2E7D32"/><path d="M830 183 L838 191 L851 175" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="381" y="9" width="202" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M482 94 V112 H885 V267 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="482" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="267" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="234" width="770" height="66" rx="14" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/><rect x="40" y="234" width="12" height="66" rx="6" fill="#EF6C00"/><text x="68" y="277" text-anchor="start" font-size="28" font-weight="600" fill="#BF360C">“perahu nelayan membawa jaring”</text></g><g class="fx pop" style="animation-delay:0.90s"><circle cx="840" cy="267" r="22" fill="#E53935"/><path d="M831 258 L849 276 M849 258 L831 276" stroke="#fff" stroke-width="5" stroke-linecap="round"/></g><g class="fx pop" style="animation-delay:1.40s"><rect x="40" y="318" width="770" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="72" cy="347" r="18" fill="#E53935"/><path d="M65 340 L79 354 M79 340 L65 354" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="100" y="357" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">jaring milik nelayan, bukan Pak Rustam</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="586" y="9" width="194" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M682 94 V112 H885 V433 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="682" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="433" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.30s"><rect x="40" y="400" width="770" height="66" rx="14" fill="#EFEBE9" stroke="#8D6E63" stroke-width="3"/><rect x="40" y="400" width="12" height="66" rx="6" fill="#8D6E63"/><text x="68" y="443" text-anchor="start" font-size="28" font-weight="600" fill="#4E342E">“bertahun-tahun memegang kemudi”</text></g><g class="fx pop" style="animation-delay:0.90s"><circle cx="840" cy="433" r="22" fill="#2E7D32"/><path d="M830 433 L838 441 L851 425" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g><g class="fx pop" style="animation-delay:1.40s"><rect x="40" y="500" width="770" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="76" cy="534" r="20.4" fill="#2E7D32"/><path d="M67 534 L74 542 L86 527" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="116" y="546" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">A dan C menunjukkan pekerjaannya</text></g></g></svg>