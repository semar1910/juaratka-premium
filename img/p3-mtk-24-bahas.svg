t></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="68" y="9" width="376" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M256 94 V112 H885 V552 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="256" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="552" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.20s"><text x="350" y="180" text-anchor="start" font-size="30" font-weight="700" fill="#4A148C">? = 25°</text></g><g class="fx pop" style="animation-delay:0.60s"><rect x="430" y="520" width="430" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="466" cy="554" r="20.4" fill="#2E7D32"/><path d="M457 554 L464 562 L476 547" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="506" y="566" text-anchor="start" font-size="32" font-weight="700" fill="#1B5E20">C: 25°</text></g><g class="fx pop" style="animation-delay:1.40s"><rect x="430" y="598" width="430" height="68" rx="34" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/><circle cx="466" cy="632" r="20.4" fill="#E53935"/><path d="M458 624 L474 640 M474 624 L458 640" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="506" y="642" text-anchor="start" font-size="28" font-weight="700" fill="#B71C1C">D: 155° = 65° + 90°</text></g></g></svg>