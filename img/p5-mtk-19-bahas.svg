eight="700" fill="#BF360C">15 menit</text></g><g class="fx pop" style="animation-delay:1.30s"><circle cx="630" cy="300" r="12" fill="#EF6C00" stroke="#fff" stroke-width="3"/><text x="630" y="348" text-anchor="middle" font-size="30" font-weight="700" fill="#BF360C">06.15</text></g><g class="fx pop" style="animation-delay:1.90s"><text class="fx sorot" style="animation-delay:2.50s" x="450" y="410" text-anchor="middle" font-size="34" font-weight="700" fill="#2E7D32">900 m ÷ 15 menit = 60 m/menit</text></g></g><g id="tahap2"><g class="penunjuk"><rect class="fx cincin" x="563" y="9" width="249" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M687 94 V112 H885 V520 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="687" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="520" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><circle cx="450" cy="300" r="12" fill="#2E7D32" stroke="#fff" stroke-width="3"/><text x="450" y="348" text-anchor="middle" font-size="30" font-weight="700" fill="#1B5E20">10 menit</text></g><g class="fx pop" style="animation-delay:1.00s"><rect x="110" y="450" width="640" height="58" rx="14" fill="#FFF1F0" stroke="#E53935" stroke-width="2.5" stroke-dasharray="8 6"/><circle cx="142" cy="479" r="18" fill="#E53935"/><path d="M135 472 L149 486 M149 472 L135 486" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="170" y="489" text-anchor="start" font-size="28" font-weight="600" fill="#B71C1C">600 ÷ 50 = 12 (salah)</text></g><g class="fx pop" style="animation-delay:1.80s"><text class="fx sorot" style="animation-delay:2.40s" x="450" y="570" text-anchor="middle" font-size="34" font-weight="700" fill="#2E7D32">600 ÷ 60 = 10 menit</text></g></g><g id="tahap3"><g class="penunjuk"><rect class="fx cincin" x="563" y="9" width="249" height="90" rx="45" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M687 94 V112 H885 V690 H872" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="687" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="872" cy="690" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g><g class="fx pop" style="animation-delay:0.40s"><circle cx="810" cy="300" r="12" fill="#2E7D32" stroke="#fff" stroke-width="3"/><text x="810" y="348" text-anchor="middle" font-size="30" font-weight="700" fill="#1B5E20">20 menit</text></g><g class="fx pop" style="animation-delay:1.00s"><text class="fx sorot" style="animation-delay:1.60s" x="450" y="636" text-anchor="middle" font-size="34" font-weight="700" fill="#2E7D32">60 × 20 = 1.200 m</text></g><g class="fx pop" style="animation-delay:1.80s"><rect x="90" y="670" width="720" height="68" rx="34" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><circle cx="126" cy="704" r="20.4" fill="#2E7D32"/><path d="M117 704 L124 712 L136 697" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="166" y="716" text-anchor="start" font-size="34" font-weight="700" fill="#1B5E20">Urutan: Benar, Salah, Benar</text></g></g></svg>