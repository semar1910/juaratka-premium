<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, Arial, sans-serif">
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>
<g id="tahap0">
<g class="fx pop" style="animation-delay:0.0s"><rect x="10" y="14" width="280" height="74" rx="37" fill="#1E88E5"/><text x="150" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">melawan</text><text x="150" y="77" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">rasa malas</text></g>
<g class="fx pop" style="animation-delay:0.1s"><rect x="310" y="14" width="280" height="74" rx="37" fill="#EF6C00"/><text x="450" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">melaut</text><text x="450" y="77" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">setiap hari</text></g>
<g class="fx pop" style="animation-delay:0.2s"><rect x="610" y="14" width="280" height="74" rx="37" fill="#8D6E63"/><text x="750" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">perahu</text><text x="750" y="77" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">sendiri</text></g>
</g>
<g id="tahap1">
<g class="penunjuk"><rect class="fx cincin" x="3" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 150 94 V102 H885 V170 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="170" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="drop" style="animation-delay:0.2s"><rect x="15" y="112" width="840" height="116" rx="20" fill="#FFF8EC" stroke="#1E88E5" stroke-width="5"/>
<text x="38" y="143" font-size="28" font-weight="600" fill="#546E7A">1 · Cari bagian yang ditanya</text>
<text x="38" y="184" font-size="36" font-weight="700" fill="#263238">setelah ditegur <tspan fill="#1E88E5">→</tspan><tspan fill="#1E88E5"> sesudah teguran</tspan></text>
<text x="38" y="218" font-size="28" font-style="italic" fill="#546E7A">“Kamal hanya terdiam.”</text></g>
</g>
<g id="tahap2">
<g class="penunjuk"><rect class="fx cincin" x="3" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 150 94 V102 H885 V296 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="150" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="296" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="drop" style="animation-delay:0.2s"><rect x="15" y="238" width="840" height="116" rx="20" fill="#FFF8EC" stroke="#EF6C00" stroke-width="5"/>
<text x="38" y="269" font-size="28" font-weight="600" fill="#546E7A">2 · Baca perubahan sikap</text>
<text x="38" y="310" font-size="36" font-weight="700" fill="#263238">melawan malas <tspan fill="#EF6C00">→</tspan><tspan fill="#EF6C00"> Mulai rajin</tspan></text>
<text x="38" y="344" font-size="28" font-style="italic" fill="#546E7A">“Kamal melawan rasa malasnya”</text></g>
</g>
<g id="tahap3">
<g class="penunjuk"><rect class="fx cincin" x="303" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 450 94 V102 H885 V422 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/><rect class="fx cincin" x="603" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/><path class="alir" d="M 750 94 V102 H885 V422 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/><circle class="fx pop" cx="750" cy="94" r="9" fill="#E53935"/><g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="422" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g></g>
<g class="drop" style="animation-delay:0.2s"><rect x="15" y="364" width="840" height="116" rx="20" fill="#FFF8EC" stroke="#8D6E63" stroke-width="5"/>
<text x="38" y="395" font-size="28" font-weight="600" fill="#546E7A">3 · Kumpulkan bukti</text>
<text x="38" y="436" font-size="36" font-weight="700" fill="#263238">melaut setiap hari <tspan fill="#8D6E63">→</tspan><tspan fill="#8D6E63"> Menjadi rajin</tspan></text>
<text x="38" y="470" font-size="28" font-style="italic" fill="#546E7A">“bahkan melaut dengan perahunya sendiri”</text></g>
</g>
<g id="tahap4">
<g class="drop" style="animation-delay:0.2s"><rect x="15" y="490" width="840" height="116" rx="20" fill="#FFF8EC" stroke="#10B981" stroke-width="5"/>
<text x="38" y="521" font-size="28" font-weight="600" fill="#546E7A">4 · Cocokkan pilihan</text>
<text x="38" y="562" font-size="36" font-weight="700" fill="#263238">cocokkan bukti <tspan fill="#10B981">→</tspan><tspan fill="#10B981"> Jawaban A</tspan></text>
<text x="38" y="596" font-size="28" font-style="italic" fill="#546E7A">B, C, D tidak sesuai bacaan</text></g>
<g class="fx pop" style="animation-delay:0.8s"><circle cx="775" cy="548" r="42" fill="#10B981"/><text x="775" y="562" text-anchor="middle" font-size="46" font-weight="700" fill="#fff">A</text></g>
</g>
</svg>