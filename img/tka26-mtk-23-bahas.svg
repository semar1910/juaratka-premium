<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, sans-serif">
<style>
.fx{transform-box:fill-box;transform-origin:center}
.kiri{transform-origin:left center}
.penunjuk{visibility:hidden}
.kini .penunjuk{visibility:visible}
.kini .pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.kini .drop{animation:drop .55s ease-out both}
.kini .tumbuh{animation:tumbuh .9s ease-out both}
.kini .muncul{animation:muncul .5s ease-out both}
.kini .garis{stroke-dasharray:900;animation:garis .9s ease-out both}
.kini .kedut{animation:kedut .45s ease-in-out 3}
.kini .sorot{animation:kedut .45s ease-in-out 3,sorot .45s ease-in-out 3}
.kini .cincin{animation:cincin .7s ease-in-out 5}
.kini .alir{animation:muncul .3s ease-out both,alir .5s linear 8}
@keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{0%{opacity:0;transform:translateY(-60px)}70%{opacity:1;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tumbuh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes muncul{from{opacity:0}to{opacity:1}}
@keyframes garis{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
@keyframes kedut{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes sorot{50%{fill:#E53935}}
@keyframes cincin{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.07);opacity:.45}}
@keyframes alir{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
</style>

<g id="tahap0">
  <rect x="20" y="16" width="280" height="70" rx="35" fill="#1E88E5"/>
  <text x="160" y="60" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">Rina 6 dari 10</text>
  <rect x="310" y="16" width="280" height="70" rx="35" fill="#EF6C00"/>
  <text x="450" y="60" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">Dika 60 dari 100</text>
  <rect x="600" y="16" width="280" height="70" rx="35" fill="#8D6E63"/>
  <text x="740" y="60" font-size="24" font-weight="600" fill="#fff" text-anchor="middle">Siti titik 0,6</text>
</g>

<g id="tahap1">
  <g class="penunjuk">
    <rect class="fx cincin" x="13" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <rect class="fx cincin" x="303" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <rect class="fx cincin" x="593" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 450 94 V160 H885 V540 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="450" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="540" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx muncul" style="animation-delay:0.2s">
    <rect x="40" y="200" width="150" height="64" rx="32" fill="#1E88E5"/>
    <text x="115" y="242" font-size="28" font-weight="600" fill="#fff" text-anchor="middle">Rina</text>
    <text x="215" y="242" font-size="26" fill="#333">6 dari 10 potong</text>
    <text x="640" y="248" font-size="44" font-weight="700" fill="#1E88E5">= 6/10</text>
  </g>
  <g class="fx muncul" style="animation-delay:0.9s">
    <rect x="40" y="290" width="150" height="64" rx="32" fill="#EF6C00"/>
    <text x="115" y="332" font-size="28" font-weight="600" fill="#fff" text-anchor="middle">Dika</text>
    <text x="215" y="332" font-size="26" fill="#333">60% = 60/100</text>
    <text x="640" y="338" font-size="44" font-weight="700" fill="#EF6C00">= 6/10</text>
  </g>
  <g class="fx muncul" style="animation-delay:1.6s">
    <rect x="40" y="380" width="150" height="64" rx="32" fill="#8D6E63"/>
    <text x="115" y="422" font-size="28" font-weight="600" fill="#fff" text-anchor="middle">Siti</text>
    <text x="215" y="422" font-size="26" fill="#333">titik di 0,6</text>
    <text x="640" y="428" font-size="44" font-weight="700" fill="#8D6E63">= 6/10</text>
  </g>
  <g class="fx pop" style="animation-delay:2.4s">
    <rect x="40" y="500" width="822" height="80" rx="20" fill="#E8F5E9" stroke="#43A047" stroke-width="4"/>
    <text x="451" y="554" font-size="40" font-weight="700" fill="#2E7D32" text-anchor="middle">Semua 6/10: Benar</text>
  </g>
</g>

<g id="tahap2">
  <g class="penunjuk">
    <rect class="fx cincin" x="13" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 160 94 V160 H885 V540 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="160" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="540" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <g class="fx muncul" style="animation-delay:0.2s">
    <text x="450" y="260" font-size="64" font-weight="700" fill="#1E88E5" text-anchor="middle">6/10</text>
  </g>
  <g class="fx muncul" style="animation-delay:0.9s">
    <text x="450" y="340" font-size="36" fill="#333" text-anchor="middle">6 ÷ 2 = 3</text>
    <text x="450" y="400" font-size="36" fill="#333" text-anchor="middle">10 ÷ 2 = 5</text>
  </g>
  <g class="fx pop" style="animation-delay:1.7s">
    <text x="450" y="468" font-size="52" font-weight="700" fill="#1E88E5" text-anchor="middle">6/10 = 3/5</text>
  </g>
  <g class="fx pop" style="animation-delay:2.4s">
    <rect x="40" y="500" width="822" height="80" rx="20" fill="#E8F5E9" stroke="#43A047" stroke-width="4"/>
    <text x="451" y="554" font-size="40" font-weight="700" fill="#2E7D32" text-anchor="middle">Rina = 3/5: Benar</text>
  </g>
</g>

<g id="tahap3">
  <g class="penunjuk">
    <rect class="fx cincin" x="593" y="9" width="294" height="84" rx="42" fill="none" stroke="#E53935" stroke-width="5"/>
    <path class="alir" d="M 740 94 V160 H885 V540 H862" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
    <circle class="fx pop" cx="740" cy="94" r="9" fill="#E53935"/>
    <g class="fx pop" style="animation-delay:0.30s"><circle class="fx kedut" style="animation-delay:0.90s" cx="862" cy="540" r="12" fill="#E53935" stroke="#fff" stroke-width="3"/></g>
  </g>
  <text class="fx muncul" style="animation-delay:0.2s" x="40" y="262" font-size="28" font-weight="600" fill="#8D6E63">Siti 3/5</text>
  <rect class="fx kiri tumbuh" style="animation-delay:0.4s" x="250" y="220" width="330" height="64" fill="#8D6E63"/>
  <rect x="250" y="220" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="360" y="220" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="470" y="220" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="580" y="220" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="690" y="220" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <text class="fx muncul" style="animation-delay:1.2s" x="40" y="372" font-size="28" font-weight="600" fill="#00897B">Anita 2/5</text>
  <rect class="fx kiri tumbuh" style="animation-delay:1.4s" x="250" y="330" width="220" height="64" fill="#00897B"/>
  <rect x="250" y="330" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="360" y="330" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="470" y="330" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="580" y="330" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <rect x="690" y="330" width="110" height="64" fill="none" stroke="#333" stroke-width="3"/>
  <g class="fx pop" style="animation-delay:2.0s">
    <rect x="470" y="326" width="110" height="72" rx="6" fill="none" stroke="#E53935" stroke-width="5" stroke-dasharray="10 8"/>
    <text x="525" y="450" font-size="28" font-weight="600" fill="#E53935" text-anchor="middle">kurang 1 kotak</text>
  </g>
  <g class="fx pop" style="animation-delay:2.6s">
    <rect x="40" y="500" width="822" height="80" rx="20" fill="#FFEBEE" stroke="#E53935" stroke-width="4"/>
    <text x="451" y="554" font-size="40" font-weight="700" fill="#C62828" text-anchor="middle">2/5 beda dari 3/5: Salah</text>
  </g>
</g>
</svg>
